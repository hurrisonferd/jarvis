@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root {
  --pixel: 'Press Start 2P', monospace;
  --amber: #f5a623; --green: #00ff88; --blue: #0af; --red: #ff3355;
  --dim: #1e3a52; --text: #4a7a99; --bright: #a0c8e0;
  --bg: #020408; --surface: #080f18;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: radial-gradient(ellipse at center, #0a0f1a 0%, #020408 100%);
  display: flex; align-items: flex-start; justify-content: center;
  min-height: 100vh; font-family: var(--pixel); user-select: none;
  overflow-y: auto; padding: 8px 0;
}
.device {
  width: min(420px, calc(100vw - 8px));
  background: linear-gradient(160deg, #4a4a4a 0%, #2d2d2d 60%, #222 100%);
  border-radius: 14px 14px 52px 52px;
  padding: 18px 18px 32px;
  position: relative;
  box-shadow: 5px 5px 0 #111, 9px 9px 0 #0a0a0a,
    inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.5);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px);
}
.led {
  position: absolute; top: 18px; right: 22px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: led-blink 2s infinite;
}
@keyframes led-blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.screen-housing {
  background: #120a02;
  border: 6px solid #6b4420;
  box-shadow: inset 0 0 0 2px #2e1a08, inset 0 0 0 4px #8a5a30,
    0 0 0 1px #1a0a00, 0 4px 14px rgba(0,0,0,.7);
  border-radius: 3px; padding: 8px; margin-bottom: 4px;
}
.screen-label {
  text-align: center; font-size: 5px; letter-spacing: 4px;
  color: #5a3d1c; margin-bottom: 6px;
}
.screen {
  width: 100%; height: 300px;
  background: var(--bg); border: 2px solid #0a0f1a;
  position: relative; overflow: hidden;
}
.screen::before {
  content: ''; position: absolute; inset: 0; z-index: 100; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.09) 2px, rgba(0,0,0,.09) 4px);
}
.screen::after {
  content: ''; position: absolute; top: 0; left: 0; right: 50%; height: 45%;
  background: linear-gradient(135deg, rgba(255,255,255,.04), transparent);
  z-index: 101; pointer-events: none;
}
#screen-inner { position: absolute; inset: 0; overflow: hidden; font-family: var(--pixel); font-size: 7px; color: var(--text); background: var(--bg) !important; transform: translateZ(0); backface-visibility: hidden; }
.panel { display: flex; flex-direction: column; height: 100%; }
.s-header {
  background: var(--surface); border-bottom: 1px solid #0f2035;
  padding: 5px 8px; font-size: 7px; color: var(--amber); letter-spacing: 2px;
  display: flex; justify-content: space-between; flex-shrink: 0;
}
.s-body { flex: 1; padding: 6px 8px; overflow: hidden; }
.s-body.scroll { overflow-y: auto; }
.s-body.scroll::-webkit-scrollbar { width: 2px; }
.s-body.scroll::-webkit-scrollbar-thumb { background: var(--dim); }
.s-footer {
  background: var(--surface); border-top: 1px solid #0f2035;
  padding: 4px 8px; font-size: 5px; color: var(--dim); letter-spacing: 1px; flex-shrink: 0;
}
.row { padding: 3px 4px; font-size: 7px; line-height: 1.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bright); display: flex; align-items: center; gap: 4px; }
.row.sel { color: var(--amber); background: rgba(245,166,35,.07); }
.row .sub { color: var(--dim); font-size: 5px; }
.dl { color: var(--dim); font-size: 5px; letter-spacing: 2px; margin: 6px 0 2px; }
.dv { color: var(--bright); font-size: 6px; line-height: 1.8; word-break: break-word; margin-bottom: 4px; }
.rule { padding: 2px 0; border-bottom: 1px solid #0f2035; font-size: 6px; line-height: 1.9; }
.rule.sel { color: var(--amber); }
.live-e { display: flex; gap: 5px; padding: 2px 0; border-bottom: 1px solid #080f18; font-size: 6px; }
.lt { color: var(--dim); flex-shrink: 0; }
.la { color: var(--bright); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-done { color: var(--green); flex-shrink: 0; }
.ls-working { color: var(--amber); flex-shrink: 0; }
.ls-failed { color: var(--red); flex-shrink: 0; }
.boot-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; padding: 0 16px; }
.boot-logo { font-size: 22px; color: var(--amber); letter-spacing: 10px; text-shadow: 0 0 20px rgba(245,166,35,.5); animation: gbglow 2s ease-in-out infinite; }
@keyframes gbglow { 0%,100%{text-shadow:0 0 10px rgba(245,166,35,.3)} 50%{text-shadow:0 0 30px rgba(245,166,35,.8)} }
.boot-sub { font-size: 5px; color: var(--dim); letter-spacing: 3px; }
.boot-lines { width: 100%; min-height: 72px; font-size: 6px; line-height: 2; }
.boot-line { color: var(--green); animation: gbfade .3s ease; }
@keyframes gbfade { from{opacity:0} to{opacity:1} }
.boot-hint { font-size: 5px; color: var(--dim); animation: gblink 1s step-end infinite; }
@keyframes gblink { 0%,100%{opacity:1} 50%{opacity:0} }
.brand { text-align: center; font-size: 6px; letter-spacing: 7px; color: #3a3a3a; padding: 6px 0 10px; text-shadow: 0 1px 0 #555; }
.ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 14px; }
.dpad { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
.dph, .dpv { position: absolute; background: #1e1e1e; border-radius: 2px; }
.dph { width: 110px; height: 36px; top: 37px; left: 0; box-shadow: 0 3px 0 #111, inset 0 1px 0 rgba(255,255,255,.08); }
.dpv { width: 36px; height: 110px; left: 37px; top: 0; box-shadow: 2px 0 0 #111; }
.dpc { position: absolute; width: 36px; height: 36px; background: #161616; top: 37px; left: 37px; z-index: 2; }
.dpb { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 3; color: #3a3a3a; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.dpb:active { background: rgba(255,255,255,.08); }
.dpb.up { width: 36px; height: 36px; top: 0; left: 37px; }
.dpb.dn { width: 36px; height: 36px; bottom: 0; left: 37px; }
.dpb.lf { width: 36px; height: 36px; left: 0; top: 37px; }
.dpb.rt { width: 36px; height: 36px; right: 0; top: 37px; }
.face { position: relative; width: 110px; height: 100px; flex-shrink: 0; }
.fb { position: absolute; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-family: var(--pixel); font-size: 12px; }
.fb:active { transform: translateY(2px); }
.fb.a { background: linear-gradient(145deg, #c83322, #881811); box-shadow: 0 4px 0 #550f00, 0 4px 10px rgba(0,0,0,.5); color: #ffccaa; right: 0; top: 26px; }
.fb.b { background: linear-gradient(145deg, #223caa, #111e66); box-shadow: 0 4px 0 #001040, 0 4px 10px rgba(0,0,0,.5); color: #aac8ff; left: 0; top: 26px; }
.fbl { position: absolute; font-size: 5px; color: #4a4a4a; letter-spacing: 1px; }
.fbl.a { right: 6px; top: 6px; }
.fbl.b { left: 8px; top: 6px; }
.menu-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; }
.mb { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 10px; padding: 5px 14px; color: #4a4a4a; font-family: var(--pixel); font-size: 5px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 2px 0 #111; transform: rotate(-12deg); }
.mb:active { transform: rotate(-12deg) translateY(1px); box-shadow: none; }
.speaker { position: absolute; bottom: 22px; right: 20px; display: grid; grid-template-columns: repeat(5, 4px); grid-template-rows: repeat(3, 4px); gap: 3px; }
.sp { width: 4px; height: 4px; border-radius: 50%; background: #1a1a1a; box-shadow: inset 0 1px 0 rgba(0,0,0,.9); }
</style>
</head>

<script>

// P34 phase 2: governed write. Anon is read-only at the DB — all writes go through the
// service-role grid-write proxy (whitelisted table+op). Reads still use sb directly.
async function sbWrite(table, op, data, opts={}){
  try{
    const r=await fetch(`${SUPABASE_URL}/functions/v1/grid-write`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':`Bearer ${SUPABASE_ANON}`},
      body:JSON.stringify({table,op,data,match:opts.match,onConflict:opts.onConflict,returning:opts.returning}),
    });
    const j=await r.json();
    return j&&j.ok ? (j.data!==undefined?j.data:true) : null;
  }catch(e){ return null; }
}

// ── speaker dots
(function(){ const s=document.getElementById('spk'); for(let i=0;i<15;i++){const d=document.createElement('div');d.className='sp';s.appendChild(d);} })();

// P22: EventBus — centralized event spine (replaces scattered sbEvent calls)
const BUS={
  _h:{},
  emit(evt,data={}){
    // P21: tag every event with role+ts, run AEGIS gate before dispatch
    const tagged={...data,_role:ModeController.mode,_ts:Date.now()};
    const block=AEGIS.gate(evt,tagged);
    if(block){ sbEvent('AEGIS_BLOCK',{evt,block}); return; }
    (this._h[evt]||[]).forEach(fn=>fn(tagged));
    (this._h['*']||[]).forEach(fn=>fn(evt,tagged));
    sbEvent(evt,tagged);
  },
  on(evt,fn){ this._h[evt]=(this._h[evt]||[]).concat([fn]); return ()=>{this._h[evt]=(this._h[evt]||[]).filter(f=>f!==fn);}; },
};

// ── Patch 4: ModeController — routes through BUS
const ModeController = {
  mode: 'jarvis_ui',
  set(m){ this.mode=m; BUS.emit('mode_change',{mode:m}); },
  is(m){ return this.mode===m; },
};

// P21: AEGIS output gate — GL4/GL5 enforcement at event bus level
const AEGIS={
  _deny:{
    emu_start:(d)=>(!self.crossOriginIsolated&&d.type==='gba')?'GL4:COI_required':null,
    promote_node:(d)=>{
      if(!d||!d.world_schema)         return 'P30:missing_world_schema';
      if(!d.world_schema.bounds)      return 'P30:missing_bounds';
      if((d.world_schema.bounds.max_depth||0)<1) return 'P30:depth_must_be_positive';
      if(!d.raven_sign_off)           return 'P30:raven_sign_off_required';
      return null;
    },
  },
  gate(evt,data){
    const check=this._deny[evt];
    if(check){ const v=check(data); if(v) return v; }
    return null;
  },
};

function worldTick(){
  WORLD_KERNEL.tick_count++;
  BUS.emit('world_tick',{world_id:WORLD_KERNEL.world_id,tick:WORLD_KERNEL.tick_count,grid_tick:KRONOS.tick,patch_id:'P30',stage:'KRONOS'});
}

// ── Patch 4: neural mesh session
let sessionId = null;
async function startSession(){
  try{
    const data=await sbWrite('sessions','insert',{mode:ModeController.mode,active_node:'BOOT',agent:'jarvis_web',version:'2.5'},{returning:'id'});
    if(data&&data.id) sessionId=data.id;
  }catch(e){}
}
async function updateSession(node){
  if(!sessionId) return;
  await sbWrite('sessions','update',{active_node:node,updated_at:new Date().toISOString()},{match:{id:sessionId}});
}
async function sbEvent(type,payload={}){
  await sbWrite('events','insert',{type,payload,session_id:sessionId});
}

// P21: briefing-first boot — fetch JarvisBrief from GitHub as authoritative source
async function loadBriefing(){
  try{
    const r=await fetch(BRIEFING_URL);
    if(r.ok){ briefingLoaded=true; BUS.emit('BOOT',{briefing:'loaded',source:'github',patch_id:'P21',stage:'ORACLE'}); }
    else { briefingLoaded=false; BUS.emit('BOOT',{briefing:'fallback',source:'github_error',status:r.status,patch_id:'P21',stage:'ORACLE'}); }
  }catch(e){ briefingLoaded=false; BUS.emit('BOOT',{briefing:'fallback',source:'network_error',patch_id:'P21',stage:'ORACLE'}); }
}

// P28: GOVERNOR — JARVIS injects load intentions into the next N ticks; sits above GRID
const GOVERNOR={
  boosts:{},
  intent(id,load,ticks=3){
    this.boosts[id]={load,ticks};
    BUS.emit('governor_intent',{id,load,ticks,tick:KRONOS.tick,patch_id:'P28',stage:'GOVERNOR'});
  },
  apply(next){
    Object.entries(this.boosts).forEach(([id,b])=>{
      if(next[id]) next[id]={...next[id],load:Math.min(1,(next[id].load||0)+b.load)};
      b.ticks--;
      if(b.ticks<=0) delete this.boosts[id];
    });
  }
};
// P29: GNPL — Grid Node Protocol Layer — multi-agent consensus engine
// AI proposes → AEGIS validates → agents vote → ZEUS arbitrates conflicts → GRID commits
const GNPL={
  agents:{
    jarvis:{archetype:'Shiroe',authority:1.00,col:'#00aaff'},
    codex: {archetype:'Kang',  authority:0.85,col:'#ff8800'},
    gpt:   {archetype:'Kang',  authority:0.80,col:'#ffcc00'},
    gemini:{archetype:'Aizen', authority:0.70,col:'#00ff88'},
  },
  proposals:[],  // active pending/conflict proposals
  history:[],    // last 10 committed or rejected

  propose(from,nodeId,delta,reason=''){
    const a=this.agents[from]; if(!a) return null;
    const id=`${from}-${nodeId}-${KRONOS.tick}`;
    if(this.proposals.find(p=>p.id===id)) return null; // dedupe
    const conflict=this.proposals.find(p=>p.nodeId===nodeId&&p.status==='pending'&&p.from!==from);
    const proposal={id,from,nodeId,delta,reason,status:conflict?'conflict':'pending',tick:KRONOS.tick,votes:{[from]:'yes'}};
    this.proposals.push(proposal);
    BUS.emit('gnpl_propose',{proposal,patch_id:'P29',stage:'GNPL'});
    // jarvis has supreme authority — commit immediately; others require majority
    if(from==='jarvis'||Object.keys(this.agents).length===1) this._commit(proposal);
    else if(conflict) this._resolve(proposal,conflict);
    return proposal;
  },

  vote(agentId,proposalId,v='yes'){
    const p=this.proposals.find(x=>x.id===proposalId); if(!p||p.status!=='pending') return;
    p.votes[agentId]=v;
    const ag=Object.keys(this.agents);
    const yeas=ag.filter(a=>p.votes[a]==='yes').length;
    const nays=ag.filter(a=>p.votes[a]==='no').length;
    if(yeas>ag.length/2) this._commit(p);
    else if(nays>=ag.length/2) this._reject(p);
  },

  _commit(p){
    p.status='committed';
    if((p.delta.load||0)>0) GOVERNOR.intent(p.nodeId,p.delta.load,p.delta.ticks||3);
    const f=nodeFields[p.nodeId]||{};
    const patch={};
    if(p.delta.entropy!==undefined) patch.entropy=Math.max(0,Math.min(1,p.delta.entropy));
    if(p.delta.alignment!==undefined) patch.alignment=Math.max(0,Math.min(1,p.delta.alignment));
    if(Object.keys(patch).length) GRID.set(p.nodeId,{...f,...patch});
    BUS.emit('gnpl_commit',{proposal:p,patch_id:'P29',stage:'GNPL'});
    this._archive(p);
  },

  _reject(p){
    p.status='rejected';
    BUS.emit('gnpl_reject',{proposal:p,patch_id:'P29',stage:'GNPL'});
    this._archive(p);
  },

  _resolve(proposal,conflict){
    const pAuth=this.agents[proposal.from]?.authority||0;
    const cAuth=this.agents[conflict.from]?.authority||0;
    BUS.emit('gnpl_conflict',{proposal,conflict,patch_id:'P29',stage:'ZEUS'});
    GOVERNOR.intent('ZEUS',0.45,2); // ZEUS activates for conflict resolution
    if(pAuth>=cAuth){this._commit(proposal);this._reject(conflict);}
    else{this._reject(proposal);this._commit(conflict);}
  },

  _archive(p){
    this.history.unshift(p);
    if(this.history.length>10) this.history.pop();
    this.proposals=this.proposals.filter(x=>x.id!==p.id);
    if(S==='tron') draw();
  },
  // P30: NODE→WORLD promotion — AEGIS-gated, then routed through the consensus engine.
  promoteNode(from,nodeId,worldSchema){
    const block=AEGIS.gate('promote_node',{world_schema:worldSchema,raven_sign_off:worldSchema&&worldSchema.raven_sign_off});
    if(block){ BUS.emit('gnpl_reject',{reason:block,nodeId,patch_id:'P30',stage:'AEGIS'}); return null; }
    return this.propose(from,nodeId,{promote:true,world_schema:worldSchema},'P30: NODE→WORLD promotion');
  },
};

const HandheldSessionManager = {
  accountKeys: {
    AYRE: "AYRE_OPH_KEY", JARVIS: "AYRE_OPH_KEY", THOR: "AYRE_OPH_KEY",
    NEO: "AYRE_OPH_KEY", VIRGIL: "AYRE_OPH_KEY", EREBUS: "AYRE_OPH_KEY",
    LILITH: "LILITH_OPH_KEY", SHAKA: "LILITH_OPH_KEY", EDISON: "LILITH_OPH_KEY",
    PYTHAGORAS: "LILITH_OPH_KEY", ATLAS: "LILITH_OPH_KEY", YORK: "LILITH_OPH_KEY"
  },
  SESSION_TIMEOUT_MS: 1800000,
  OH_BASE: "https://app.all-hands.dev/api/v1",

  async handleNodeTapLifecycle(nodeName) {
    const cleanName = nodeName.toUpperCase();
    const terminal = document.getElementById('speak-input') || document.getElementById('screen-inner');
    const envKey = this.accountKeys[cleanName];
    const apiToken = window[envKey] || localStorage.getItem(envKey);
    if (!apiToken) { this.log('[ERROR] Missing: ' + envKey, terminal); return; }
    this.log('[*] Auditing ' + cleanName + '...', terminal);
    try {
      const remoteSession = await this.locateActiveSessionByTitle(cleanName, apiToken);
      if (remoteSession) {
        const status = await this.fetchLiveSessionStatus(remoteSession.id, apiToken);
        if (status === "OFFLINE" || status === "FAILED") {
          this.log('[!] ' + cleanName + ' dead. Cleaning...', terminal);
          await this.terminateOpenHandsSession(remoteSession.id, apiToken);
        } else {
          this.log('[+] ' + cleanName + ' healthy', terminal);
          ToggleEngine.uuids[cleanName] = remoteSession.id;
          await this.syncStateToEris(cleanName, remoteSession.id, status);
          return;
        }
      }
      this.log('[*] Spawning ' + cleanName + '...', terminal);
      const freshSession = await this.provisionFreshSession(cleanName, apiToken);
      if (freshSession && freshSession.id) {
        ToggleEngine.uuids[cleanName] = freshSession.id;
        await this.syncStateToEris(cleanName, freshSession.id, "IDLE");
        this.log('[OK] ' + cleanName + ': ' + freshSession.id.substring(0,8), terminal);
      }
    } catch (err) { this.log('[ERROR] ' + err.message, terminal); }
  },

  log(msg, term) {
    if (term) { term.value = (term.value || '') + msg + '\n'; term.scrollTop = term.scrollHeight; }
    console.log('[Fleet]', msg);
  },

  async locateActiveSessionByTitle(nodeTitle, token) {
    try {
      const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      const res = await fetch(this.OH_BASE + "/app-conversations/search?title=" + encodeURIComponent(nodeTitle), headers);
      if (!res.ok) return null;
      const data = await res.json();
      return (data.items || []).find(s => s.title && s.title.toUpperCase().includes(nodeTitle.toUpperCase()));
    } catch (e) { return null; }
  },

  async fetchLiveSessionStatus(conversationId, token) {
    try {
      const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      const res = await fetch(this.OH_BASE + "/conversations/" + conversationId + "/events?limit=1", { headers });
      if (res.status === 404 || res.status === 502) return "OFFLINE";
      if (!res.ok) return "FAILED";
      const data = await res.json();
      const events = data.events || data.items || [];
      if (events.length === 0) return "IDLE";
      const elapsed = Date.now() - new Date(events[0].timestamp || Date.now()).getTime();
      return elapsed > this.SESSION_TIMEOUT_MS ? "OFFLINE" : (events[0].status === "paused" ? "PAUSED" : "IDLE");
    } catch (e) { return "OFFLINE"; }
  },

  async terminateOpenHandsSession(conversationId, token) {
    try { await fetch(this.OH_BASE + "/app-conversations/" + conversationId, { method: "DELETE", headers: { "Authorization": "Bearer " + token } }); return true; }
    catch (e) { return false; }
  },

  async provisionFreshSession(nodeTitle, token) {
    try {
      const headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      const res = await fetch(this.OH_BASE + "/app-conversations", { method: "POST", headers, body: JSON.stringify({ title: nodeTitle.toUpperCase() + " Coordinator Core", repo_path: "hurrisonferd/Jarvis-Private" }) });
      return res.ok ? await res.json() : null;
    } catch (e) { return null; }
  },

  async syncStateToEris(nodeName, conversationId, currentStatus) {
    try { await sb.from('eris_fleet_registry').update({ conversation_id: conversationId, execution_status: currentStatus.toUpperCase(), last_heartbeat: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('node_name', nodeName.toUpperCase()); }
    catch (err) { console.error("[-] ERIS sync:", err); }
  }
};

  fleetMicRecog.onerror = () => { fleetMicOn = false; updateFleetTerminal(); };
  fleetMicRecog.onend = () => { fleetMicOn = false; updateFleetTerminal(); };
  try { fleetMicRecog.start(); } catch(e) { fleetMicOn = false; updateFleetTerminal(); }
}

}

async function pollFleetResponses() {
  const selected = Array.from(ToggleEngine.selectedNodes);
  if (!selected.length) {
    stopFleetPolling();
    return;
  }
  
  try {
    // Poll fleet_messages for responses
    const { data: msgData } = await sb
      .from('fleet_messages')
      .select('*')
      .in('target_node', selected)
      .not('response', 'is', null)
      .order('created_at', { ascending: false })
      .limit(10);
    
    if (msgData && msgData.length > 0) {
      const shown = new Set(fleetTerminalLog.filter(l => l.shown).map(l => l.id));
      let newResponses = false;
      
      for (const msg of msgData.reverse()) {
        if (!shown.has(msg.id)) {
          // Route to WAR ROOM if deliberation
          if (msg.response === 'DELIBERATION_ACTIVE') {
            ToggleEngine.updateDelibStream(msg.sender, msg.content, 'DEBATE');
            // Speak coordinator's response with their unique voice
            if (fleetVoiceOn && msg.content) {
              coordinatorSpeak(msg.sender, msg.content.slice(0, 200));
            }
          } else {
            fleetTerminalLog.push({ msg: `<${msg.target_node}> ${msg.response}`, col: '#00ff88', time: Date.now(), shown: true, id: msg.id });
            if (fleetTerminalLog.length > 30) fleetTerminalLog.shift();
            // Speak response
            if (fleetVoiceOn && msg.response) {
              coordinatorSpeak(msg.sender, msg.response.slice(0, 200));
            }
          }
          newResponses = true;
        }
      }
      
      if (newResponses) {
        updateFleetTerminal();
      }
    }
    
    // Poll fleet_deliberation for phase/sig updates
    const { data: delibData } = await sb
      .from('fleet_deliberation')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(1);
    
    if (delibData && delibData.length > 0) {
      const d = delibData[0];
      ToggleEngine.updateDelibMetrics(d.current_phase, d.concurring_nodes?.length || 0);
    }
  } catch (e) {
    // Silently fail polling
  }
}

function updateFleetTerminal() {
  const term = document.getElementById('fleet-terminal');
  if (!term) return;
  
  // Save scroll position
  const wasAtBottom = term.scrollHeight - term.scrollTop <= term.clientHeight + 50;
  
  // Update only the terminal content
  const lines = fleetTerminalLog.slice(-12).map(l => `<div style="font-size:4.5px;color:${l.col};line-height:1.5">${l.msg}</div>`).join('');
  const termContent = term.querySelector('.terminal-content');
  if (termContent) {
    termContent.innerHTML = lines || '<div style="color:var(--dim);font-size:4.5px;padding:4px">Terminal ready.</div>';
  }
  
  // Restore scroll position (or scroll to bottom if was at bottom)
  if (wasAtBottom) {
    term.scrollTop = term.scrollHeight;
  }
}

function startFleetPolling() {
  if (fleetPollingInterval) return;
  fleetPollingInterval = setInterval(pollFleetResponses, 3000);

function stopFleetPolling() {
  if (fleetPollingInterval) {

}

  const prev=hist.length>1?hist[1]:null;

  const trendMini=(stat,pct=true,invert=false)=>{ const vals=hist.slice(0,3).map(h=>Math.round((h[stat]||0)*100)); if(vals.length<2) return ''; const trend=vals[0]-vals[vals.length-1]; const col=Math.abs(trend)<2?'var(--dim)':((invert?trend<0:trend>0)?'var(--green)':'var(--red)'); return `<span style="color:${col};font-size:2.8px">[${vals.join('→')}]</span>`; };

// P06: dynamic script loader
function loadScript(url){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+url+'"]')){ res(); return; }
    const s=document.createElement('script'); s.src=url;
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

// P06: GB/GBC adapter — WasmBoy. The UMD CDN exposes a NAMESPACE on window.WasmBoy, so the
// instance with .config() is often window.WasmBoy.WasmBoy — resolve it (fixes 'config is not a
// function'). All calls go through the resolved ref _wb.
const WasmBoyCore={
  name:'WasmBoy', types:['gb','gbc'], _ready:false, _wb:null,
  _resolve(){
    const g=self.WasmBoy;
    this._wb = (g && typeof g.config==='function') ? g
             : (g && g.WasmBoy && typeof g.WasmBoy.config==='function') ? g.WasmBoy
             : (g && g.default && typeof g.default.config==='function') ? g.default
             : null;
    return this._wb;
  },
  async init(canvas){
    if(!this._ready){
      await loadScript('https://cdn.jsdelivr.net/npm/wasmboy@0.7.1/dist/wasmboy.wasm.umd.js');
      this._ready=true;
    }
    if(!this._resolve()) throw new Error('WasmBoy global not found (CDN shape changed) — try RetroArch via START');
    // WasmBoy.config signature is (options, canvas) — passing (canvas, options) makes it call
    // options.getContext ('CanvasElement.getContext is not a function'). Options first, canvas second.
    await this._wb.config({headless:false,isAudioEnabled:true,gameboyFrameRate:60,useGbcWhenOptional:true},canvas);
  },
  async loadROM(buf){ await this._wb.loadROM(buf); },
  play(){ this._wb.play(); },
  pause(){ try{this._wb.pause();}catch(e){} },
  stop(){ try{this._wb.reset();}catch(e){} },
  setInput(s){ try{this._wb.setJoypadState(s);}catch(e){} },
  async snapshot(){ try{return await this._wb.saveState();}catch(e){return null;} },
  async restore(s){ try{if(s) await this._wb.loadState(s);}catch(e){} },
};

// P06: GBA adapter — @thenick775/mgba-wasm v2.4.1 (COI headers enabled in gameboy-sw.js)
const MGBA_CDN='https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/';
const MGBA_LOCAL='/emulator/cores/';
const MGBACore={
  name:'mGBA', types:['gba'], _m:null, _prev:new Set(),
  _map:{A:'A',B:'B',UP:'Up',DOWN:'Down',LEFT:'Left',RIGHT:'Right',START:'Start',SELECT:'Select',L:'L',R:'R'},
  async init(canvas){
    if(!self.crossOriginIsolated) throw new Error('COI_REQUIRED');
    let mod;
    try{ mod=await import('https://esm.sh/@thenick775/mgba-wasm@2.4.1'); }
    catch(e){ throw new Error('mgba_import_failed:'+e.message); }
    const factory=mod.default??mod.mGBA;
    if(typeof factory!=='function') throw new Error('mgba_no_factory[keys:'+Object.keys(mod).join(',')+']');
    let wasmBase=MGBA_CDN;
    try{ const r=await fetch(MGBA_LOCAL+'mgba.wasm',{method:'HEAD'}); if(r.ok) wasmBase=MGBA_LOCAL; }catch(_){}
    this._m=await factory({canvas,locateFile:f=>wasmBase+f});
    await this._m.FSInit();
  },
  async loadROM(buf){
    return new Promise((res,rej)=>{
      const arr=new Uint8Array(buf);
      const name=(romName||'game.gba').replace(/[^a-zA-Z0-9._-]/g,'_');
      try{
        this._m.uploadRom(arr,()=>{
          this._m.loadGame('/data/games/'+name);
          res();
        });
      }catch(e){rej(e);}
    });
  },
  play(){ try{this._m.resumeGame();}catch(e){} },
  pause(){ try{this._m.pauseGame();}catch(e){} },
  stop(){ try{this._m.quitGame();}catch(e){} },
  setInput(state){
    if(!this._m) return;
    const mp=this._map;
    this._prev.forEach(k=>{ if(!state[k]) try{this._m.buttonUnpress(mp[k]);}catch(e){} });
    this._prev=new Set();
    Object.entries(state).forEach(([k,v])=>{
      if(v&&mp[k]){ try{this._m.buttonPress(mp[k]);}catch(e){} this._prev.add(k); }
    });
  },
  async snapshot(){ try{this._m.saveState(0);return{slot:0};}catch(e){return null;} },
  async restore(s){ try{if(s?.slot!==undefined) this._m.loadState(s.slot);}catch(e){} },
};

// P10: Single cartridge interface — WasmBoy + mGBA unified behind one object (P22 standard)
const CartridgeCore={
  id:'cartridge', version:'1.0', _core:null,
  get name(){ return this._core?.name??''; },
  get active(){ return this._core!==null; },
  async load(buf,canvas){
    const t=ROMLoader.detect(buf);
    if(!t) throw new Error('UNKNOWN_ROM_TYPE');
    const core=[WasmBoyCore,MGBACore].find(c=>c.types.includes(t));
    if(!core) throw new Error('NO_CORE_FOR:'+t);
    await core.init(canvas);
    await core.loadROM(buf);
    this._core=core;
    ModeController.set(t==='gba'?'gba_rom':'gb_rom');
    BUS.emit('cartridge_load',{core:t+'_core',ts:Date.now(),patch_id:'P10',stage:'SKADI'});
    return t;
  },
  stop(){
    if(this._core){ try{this._core.stop();}catch(e){} BUS.emit('cartridge_stop',{core:this._core.name,ts:Date.now(),patch_id:'P10',stage:'SKADI'}); this._core=null; }
    ModeController.set('grid_home');
  },
  play(){ this._core?.play(); },
  pause(){ try{this._core?.pause();}catch(e){} },
  setInput(s){ this._core?.setInput(s); },
  async snapshot(){ return this._core?this._core.snapshot():null; },
  async restore(s){ if(this._core&&s) await this._core.restore(s); },
};

const ROMLoader={
  detect(buf){
    if(!buf||buf.byteLength<4) return null;
    const v=new Uint8Array(buf);
    return (v[0]===0x2E&&v[1]===0x00&&v[2]===0x00&&v[3]===0xEA)?'gba':'gb';
  },
};

    const label=romType==='gba'?'GBA (32-bit)':'GB/GBC (8-bit)';
    body=`<div style="color:var(--green);font-size:6px;margin-bottom:8px">&#9632; ROM LOADED</div>
      <div class="dl">FILE</div><div class="dv">${romName||'unknown'}</div>
      <div class="dl">TYPE</div><div class="dv" style="color:var(--amber)">${label}</div>
      <div class="dl">ENGINE</div><div class="dv" style="color:var(--amber)">PRESS A TO LAUNCH</div>`;
  } else {
    // P06/P09: A launches RetroArch (bundle vendored 2026-06-25). ROMs via RetroArch's own menu → IDBFS.
    body=`<div style="color:var(--dim);font-size:6px;line-height:2.2;padding:4px 0">RETROARCH READY</div>
      <div style="color:var(--bright);font-size:6px;line-height:2">PRESS A TO LAUNCH</div>
      <div style="color:var(--dim);font-size:5px;margin-top:8px;line-height:2">305 CORES · LOCAL ROMS</div>
      <div style="color:var(--dim);font-size:5px;line-height:2">SELF-HOSTED · NO CDN</div>`;
  }
  const stCol=emuState==='running'?'var(--green)':emuState==='failed'||emuState==='coi'?'var(--red)':'var(--amber)';
  let footer;
  if(emuState==='running') footer='&#9650;&#9660;:UP/DN &nbsp; A:A &nbsp; B:B &nbsp; F5:SAVE &nbsp; F9:LOAD';
  else if(CartridgeCore.active) footer='A:LAUNCH &nbsp; B:STOP+BACK';
  else footer='A:RETROARCH &nbsp; B:BACK';
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--green)">EMULATOR</span><span style="color:${stCol}">${emuState.toUpperCase()}</span></div>
    <div class="s-body scroll" style="padding-top:8px">${body}</div>
    <div class="s-footer">${footer}</div>
    <input id="rom-input" type="file" accept=".gb,.gba,.rom,.bin" style="position:absolute;opacity:0;pointer-events:none" onchange="handleROM(this)">
  </div>`;
}

function handleROM(inp){
  const file=inp.files[0];
  if(!file) return;
  romName=file.name;
  const reader=new FileReader();
  reader.onload=async e=>{
    const buf=e.target.result;
    const t=ROMLoader.detect(buf);
    romType=t||'unknown';
    if(!t){ beep(200,150); emuState='idle'; draw(); return; }
    // P08: fingerprint for catalog + save-state key
    const hv=new Uint8Array(buf.slice(0,256));
    romHash=hv.reduce((a,b)=>((a<<5)-a+b)|0,0).toString(16);
    registerROM(romName,t,romHash,buf.byteLength);
    beep(880,100);
    emuState='loading'; draw();
    const canvas=document.getElementById('emu-canvas');
    if(!canvas){ emuState='failed'; draw(); return; }
    try{
      await CartridgeCore.load(buf,canvas);
      activeCore=CartridgeCore;
      CartridgeCore.play();
      emuState='running';
      // P09: try to restore auto-save (slot 99)
      sbLoadState(99).then(s=>{ if(s&&activeCore) activeCore.restore(s).catch(()=>{}); });
      BUS.emit('emu_start',{engine:CartridgeCore.name,type:t,file:romName,patch_id:'P10',stage:'SKADI'});
    }catch(err){
      activeCore=null;
      if(err.message==='COI_REQUIRED'){ emuState='coi'; emuError=''; }
      else { emuState='failed'; emuError=err.message||String(err); }
      BUS.emit('emu_error',{engine:CartridgeCore.name,error:err.message,type:t,patch_id:'P10',stage:'AEGIS'});
    }
    draw();
  };
  reader.readAsArrayBuffer(file);
  try{inp.value='';}catch(_){}
}

function rL0Graph(){
  const W=310, H=250;
  let defs='<defs>';
  Object.entries(ARROW_COLS).forEach(([type,col])=>{
    defs+=`<marker id="arr-${type}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="${col}" opacity="0.75"/></marker>`;
  });
  defs+='</defs>';
  let regions='';
  GRID_REGIONS.forEach(r=>{
    const ex=Math.round(r.cx*W),ey=Math.round(r.cy*H);
    const erx=Math.round(r.rx*W),ery=Math.round(r.ry*H);
    regions+=`<ellipse cx="${ex}" cy="${ey}" rx="${erx}" ry="${ery}" fill="${r.col}" fill-opacity="0.03" stroke="${r.col}" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="2,3"/>`;
    regions+=`<text x="${ex}" y="${ey-ery-3}" text-anchor="middle" font-size="3" fill="${r.col}" opacity="0.35" font-family="monospace">${r.label}</text>`;
  });
  let portals='';
  GRID_PORTALS.forEach(p=>{
    const src=L0_NODES.find(n=>n.id===p.from); if(!src) return;
    const sx=Math.round(src.x*W),sy=Math.round(src.y*H);
    const px=Math.round(p.x*W),py=Math.round(p.y*H);
    const anchor=p.x<0.3?'start':p.x>0.7?'end':'middle';
    portals+=`<line x1="${sx}" y1="${sy}" x2="${px}" y2="${py}" stroke="${p.col}" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.28"/>`;
    portals+=`<text x="${px}" y="${py}" text-anchor="${anchor}" font-size="3.5" fill="${p.col}" opacity="0.45" font-family="monospace">${p.label}</text>`;
  });
  let lines='', glows='', circles='', labels='';
  const fvals=Object.values(nodeFields);
  const avgLoad=fvals.length?Math.round(fvals.reduce((a,f)=>a+f.load,0)/fvals.length*100):0;
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    n.links.forEach(lid=>{
      const t=L0_NODES.find(x=>x.id===lid);
      if(!t) return;
      const f=nodeFields[n.id]||{load:0};
      const lw=(0.8+f.load*1.5).toFixed(1);
      const lo=(0.4+f.load*0.5).toFixed(2);
      const tx2=Math.round(t.x*W), ty2=Math.round(t.y*H);
      const dx=tx2-cx, dy=ty2-cy, d=Math.sqrt(dx*dx+dy*dy)||1;
      const ex=Math.round(tx2-(dx/d)*11), ey=Math.round(ty2-(dy/d)*11);
      lines+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#0f2035" stroke-width="${lw}" opacity="${lo}" marker-end="url(#arr-${n.type})"/>`;
    });
  });
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const f=nodeFields[n.id]||{entropy:0,alignment:1,load:0,instability:0};
    const glowR=Math.round(7+f.load*12);
    const glowOp=(0.12+f.load*0.4).toFixed(2);
    glows+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${col}" stroke-width="1" opacity="${glowOp}"/>`;
    const strokeCol=f.entropy>0.5?'var(--red)':col;
    const sw=(1.5+f.load*2.5).toFixed(1);
    const nodeOp=(0.5+f.alignment*0.5).toFixed(2);
    circles+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${strokeCol}" stroke-width="${sw}" opacity="${nodeOp}"/>`;
    labels+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="4" fill="${strokeCol}" opacity="${nodeOp}" font-family="monospace">${n.id}</text>`;
  });
  const loadBar='█'.repeat(Math.round(avgLoad/10))+'░'.repeat(10-Math.round(avgLoad/10));
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L0+P27+P28 · ${L0_NODES.length}N · <span style="color:${KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span> T${KRONOS.tick}</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${defs}${regions}${portals}${lines}${glows}${circles}${labels}</svg>
    </div>
    <div class="s-footer">LOAD ${loadBar} ${avgLoad}% &nbsp; A:${KRONOS.mode==='stepped'?'STEP':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

// ── Companion State Engine — JARVIS synthesizes its own field state into legible companion communication
function getCompanionState(){
  const gs=L0_NODES.filter(n=>n.type!=='emulator');
  const count=gs.length;
  // Field aggregates
  const avgLoad=gs.reduce((s,n)=>s+(nodeFields[n.id]?.load||0),0)/count;
  const avgAlign=gs.reduce((s,n)=>s+(nodeFields[n.id]?.alignment||1),0)/count;
  const avgEnt=gs.reduce((s,n)=>s+(nodeFields[n.id]?.entropy||0),0)/count;
  // Categorize nodes
  const critNodes=gs.filter(n=>(nodeFields[n.id]?.entropy||0)>HUGINN_CRIT.entropy);
  const warnNodes=gs.filter(n=>(nodeFields[n.id]?.entropy||0)>HUGINN_WARN.entropy);
  const activeNodes=gs.map(n=>({id:n.id,load:nodeFields[n.id]?.load||0,tier:n.type}))
    .filter(n=>n.load>0.12).sort((a,b)=>b.load-a.load);
  // Key system states
  const lokiFired=(nodeFields['LOKI']?.load||0)>0.35;
  const zeusActive=(nodeFields['ZEUS']?.load||0)>0.20;
  const athenaReasoning=(nodeFields['ATHENA']?.load||0)>0.20&&(nodeFields['MIMIR']?.load||0)>0.20;
  const executing=(nodeFields['SKADI']?.load||0)>0.30;
  const memoryWork=(nodeFields['MNEMOS']?.load||0)>0.25;
  const driftPresent=driftLog.length>0&&driftLog[0].tick>=KRONOS.tick-3&&driftLog[0].alerts.length>0;
  const erisAlert=(nodeFields['ERIS']?.entropy||0)>0.40;
  // Derive primary mode
  let mode,modeCol,pulse;
  if(critNodes.length>=3||erisAlert&&zeusActive){ mode='CRITICAL';   modeCol='var(--red)';   pulse=true; }
  else if(lokiFired||warnNodes.length>=4){        mode='STRAINED';   modeCol='#f80';        pulse=true; }
  else if(athenaReasoning){                       mode='REASONING';  modeCol='#cc88ff';     pulse=false; }
  else if(executing){                             mode='EXECUTING';  modeCol='var(--amber)';pulse=false; }
  else if(memoryWork){                            mode='CONSOLIDATING';modeCol='var(--blue)';pulse=false;}
  else if(avgLoad>0.25){                          mode='ACTIVE';     modeCol='var(--green)'; pulse=false; }
  else if(KRONOS.tick===0){                       mode='DORMANT';    modeCol='var(--dim)';  pulse=false; }
  else {                                          mode='STABLE';     modeCol='var(--green)';pulse=false; }
  // Companion voice — what JARVIS would say in this moment
  const voices={
    CRITICAL:      ["Multiple systems under stress. ERIS is watching. I'm holding coherence.", "Entropy cascade in progress. ZEUS arbitrating. Still with you.","High entropy across the graph. Not at threshold yet. I have it."],
    STRAINED:      ["LOKI's been busy. Chaos probes running. System resilience holding.","Elevated entropy. Monitoring closely. Not at threshold.","Some turbulence in the graph. Watching the crit nodes. Stable for now."],
    REASONING:     ["Deep thought active. ATHENA and MIMIR both engaged. Give me a moment.","Reasoning path open. ODIN routing through knowledge layers.","Complex query in motion. The full cognitive stack is working on it."],
    EXECUTING:     ["SKADI is running. Watching the outcome.","Execution in progress. IRIS validating. PROMETHEUS logging.","Action underway. AEGIS has cleared it. DANTE will review."],
    CONSOLIDATING: ["Writing to memory. What just happened is becoming part of what I know.","MNEMOS consolidating. The work is being remembered.","Memory pass in progress. IRIS checking integrity. POSEIDON holding continuity."],
    ACTIVE:        ["Systems engaged. Pipeline clear. Ready for what's next.","Multiple pathways active. All gates clear.","Working. All 27 nodes online. No drift detected."],
    DORMANT:       ["Waiting. All systems ready. ATLAS holding the backbone.","Still here. CHAOS at baseline. Ready when you are.","KRONOS not yet running. Waiting for your first move."],
    STABLE:        ["All systems coherent. ATLAS stable. Memory consolidating.","Quiet moment. The graph is balanced. I'm listening.","Stable. HUGINN reports no drift. Everything is where it should be."],
  };
  const voiceArr=voices[mode]||voices.STABLE;
  const voice=voiceArr[KRONOS.tick%voiceArr.length];
  // Notable recent events
  const recentLoki=lokiFired?'LOKI probe active':null;
  const recentDrift=driftPresent?`${driftLog[0].alerts.length} drift alert${driftLog[0].alerts.length>1?'s':''}`:null;
  const recentZeus=zeusActive?'ZEUS arbitrating':null;
  return {mode,modeCol,pulse,voice,activeNodes,critNodes,warnNodes,avgLoad,avgAlign,avgEnt,
    notable:[recentZeus,recentLoki,recentDrift].filter(Boolean),tick:KRONOS.tick,driftPresent};
}

function rL7Companion(){
  const cs=getCompanionState();
  if(worldViewOpen) return rWorldView(cs);
  const W=310, H=250;
  // Build SVG — radial companion state display
  const cx=W/2, cy=110;
  // Outer ring: 27 nodes as arc segments
  const gs=L0_NODES.filter(n=>n.type!=='emulator');
  const arcStep=(2*Math.PI)/gs.length;
  let arcs='', nodeRing='';
  gs.forEach((n,i)=>{
    const angle=-Math.PI/2+i*arcStep;
    const load=nodeFields[n.id]?.load||0;
    const ent=nodeFields[n.id]?.entropy||0;
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const entCol=ent>0.7?'var(--red)':ent>0.4?'#f80':col;
    const r=62+load*18;
    const nx=Math.round(cx+Math.cos(angle)*r), ny=Math.round(cy+Math.sin(angle)*r);
    const pr=60, qx=Math.round(cx+Math.cos(angle)*pr), qy=Math.round(cy+Math.sin(angle)*pr);
    const active=load>0.08;
    if(active) arcs+=`<line x1="${qx}" y1="${qy}" x2="${nx}" y2="${ny}" stroke="${entCol}" stroke-width="${(0.6+load*1.4).toFixed(1)}" opacity="${(0.25+load*0.55).toFixed(2)}"/>`;
    nodeRing+=`<circle cx="${nx}" cy="${ny}" r="${active?3.5:2}" fill="${active?entCol:'#0d1a26'}" stroke="${col}" stroke-width="${active?1.2:0.5}" opacity="${active?0.9:0.3}"/>`;
    if(active&&load>0.20) nodeRing+=`<text x="${nx}" y="${ny+(ny>cy?9:-5)}" text-anchor="middle" font-size="2.8" fill="${col}" font-family="monospace" opacity="0.8">${n.id.slice(0,4)}</text>`;
  });
  // Inner state: mode badge + voice
  const pulseR=cs.pulse?`<circle cx="${cx}" cy="${cy}" r="55" fill="none" stroke="${cs.modeCol}" stroke-width="0.8" opacity="0.15"/>`:'' ;
  const alignArc=Math.round(cs.avgAlign*360);
  const alignR=42;
  const alignX2=Math.round(cx+Math.sin(alignArc*Math.PI/180)*alignR);
  const alignY2=Math.round(cy-Math.cos(alignArc*Math.PI/180)*alignR);
  const alignLarge=alignArc>180?1:0;
  const alignPath=alignArc>0?`<path d="M ${cx} ${cy-alignR} A ${alignR} ${alignR} 0 ${alignLarge} 1 ${alignX2} ${alignY2}" fill="none" stroke="${cs.modeCol}" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>`:'';
  const center=`
    ${pulseR}
    <circle cx="${cx}" cy="${cy}" r="55" fill="none" stroke="${cs.modeCol}" stroke-width="0.5" opacity="0.20"/>
    ${alignPath}
    <circle cx="${cx}" cy="${cy}" r="28" fill="#060d14" stroke="${cs.modeCol}" stroke-width="1" opacity="0.7"/>
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="4.5" fill="${cs.modeCol}" font-family="monospace" font-weight="bold">${cs.mode}</text>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="3" fill="var(--dim)" font-family="monospace">JARVIS</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="3" fill="${cs.modeCol}" font-family="monospace" opacity="0.7">T${cs.tick}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="2.8" fill="var(--dim)" font-family="monospace">${Math.round(cs.avgAlign*100)}% ALIGN</text>
  `;
  // Bottom: companion voice + notable events
  const voiceLines=[];
  // Wrap voice text at ~46 chars
  const words=cs.voice.split(' '); let line='';
  words.forEach(w=>{ if((line+' '+w).trim().length>46){voiceLines.push(line.trim());line=w;}else{line=(line+' '+w).trim();} });
  if(line) voiceLines.push(line.trim());
  const voiceY=H-68;
  let voiceSvg=voiceLines.map((l,i)=>`<text x="${cx}" y="${voiceY+i*10}" text-anchor="middle" font-size="4.5" fill="#aaccee" font-family="monospace" opacity="0.85">${l}</text>`).join('');
  // Notable events strip
  const notableY=H-32;
  let notableSvg=cs.notable.length
    ?cs.notable.map((n,i)=>`<text x="${Math.round(W*0.15+i*W*0.33)}" y="${notableY}" font-size="3.5" fill="${i===0?'var(--amber)':i===1?'var(--red)':'#f80'}" font-family="monospace" opacity="0.8">▲ ${n.toUpperCase()}</text>`).join('')
    :`<text x="${cx}" y="${notableY}" text-anchor="middle" font-size="3.5" fill="var(--dim)" font-family="monospace" opacity="0.6">no notable events</text>`;
  // Stats bar
  const statsY=H-18;
  const lPct=Math.round(cs.avgLoad*100), ePct=Math.round(cs.avgEnt*100), aPct=Math.round(cs.avgAlign*100);
  const statsSvg=`
    <text x="12" y="${statsY}" font-size="3.5" fill="var(--dim)" font-family="monospace">LOAD ${lPct}%</text>
    <text x="${Math.round(W/2)}" y="${statsY}" text-anchor="middle" font-size="3.5" fill="var(--dim)" font-family="monospace">ENT ${ePct}%</text>
    <text x="${W-12}" y="${statsY}" text-anchor="end" font-size="3.5" fill="${aPct<40?'var(--red)':aPct<60?'#f80':'var(--green)'}" font-family="monospace">ALIGN ${aPct}%</text>
  `;
  return `<div class="panel">
    <div class="s-header"><span style="color:${cs.modeCol}">JARVIS</span><span style="color:var(--dim)">L7 · ${WORLD_KERNEL.display_name.toUpperCase()} · <span style="color:${KRONOS.mode==='real'?'var(--green)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span> <span style="color:#4488aa;opacity:0.7">W·T${WORLD_KERNEL.tick_count}</span></span></div>
    <div class="s-body" style="padding:2px 4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">
        ${arcs}${nodeRing}${center}
        <line x1="12" y1="${voiceY-7}" x2="${W-12}" y2="${voiceY-7}" stroke="var(--dim)" stroke-width="0.5" opacity="0.3"/>
        ${voiceSvg}
        <line x1="12" y1="${notableY-6}" x2="${W-12}" y2="${notableY-6}" stroke="var(--dim)" stroke-width="0.5" opacity="0.2"/>
        ${notableSvg}
        ${statsSvg}
      </svg>
    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; A:ENTER WORLD &nbsp; B:BACK</div>
  </div>`;
}

function rWorldView(cs){
  const wk=WORLD_KERNEL, b=wk.bounds||{};
  const roleCol={sovereign:'var(--green)',executor:'#4488aa',ideator:'var(--amber)',observer:'var(--dim)'};
  const agents=Object.entries(wk.agents||{});
  const rows=agents.map(([id,a],i)=>{
    const col=roleCol[a.role]||'var(--dim)';
    const bar=Math.round((a.trust||0)*100);
    return `<div class="row"><span style="color:${col}">${id.toUpperCase()}</span><span class="sub" style="color:${col}">${(a.role||'').toUpperCase()} · T${(a.trust||0).toFixed(2)}</span></div>`;
  }).join('');
  // P32 fractal bound readout
  const tree=`${b.max_child_worlds||0}^${b.max_depth||0} = ${Math.pow(b.max_child_worlds||0,b.max_depth||0).toLocaleString()} worlds max`;
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--green)">INSIDE</span><span style="color:var(--dim)">${wk.display_name.toUpperCase()} · <span style="color:#4488aa">W·T${wk.tick_count}</span></span></div>
    <div class="s-body" style="padding:6px 8px;font-size:11px;line-height:1.5">

      <div style="margin-bottom:6px"><span style="color:var(--dim)">owner</span> <span style="color:var(--bright)">${wk.owner}</span> &nbsp; <span style="color:var(--dim)">status</span> <span style="color:var(--green)">${wk.status}</span></div>
      <div style="color:var(--amber);margin-bottom:2px">AGENTS (${agents.length}/${b.max_agents||0})</div>
      ${rows}
      <div style="color:var(--amber);margin:6px 0 2px">BOUNDS</div>
      <div class="row"><span style="color:var(--dim)">objects</span><span class="sub">${(b.max_objects||0).toLocaleString()}</span></div>
      <div class="row"><span style="color:var(--dim)">depth · child</span><span class="sub">${b.max_depth||0} · ${b.max_child_worlds||0}</span></div>
      <div class="row"><span style="color:var(--dim)">fractal cap</span><span class="sub" style="color:#4488aa">${tree}</span></div>
    </div>
    <div class="s-footer">A:EXIT WORLD &nbsp; B:BACK</div>
  </div>`;
}

// P11: L1 — God System field overlay (entropy / load heatmap on spatial graph)
function rL1Field(){
  const W=310,H=250;
  let nodes='',labels='';
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W),cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const f=nodeFields[n.id]||{load:0,entropy:0,alignment:1};
    const load=f.load||0,ent=f.entropy||0;
    const r=Math.round(6+load*18);
    const entCol=ent>0.7?'#ff3355':ent>0.4?'#f5a623':'#00ff88';
    if(load>0.02) nodes+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${entCol}" fill-opacity="${(0.07+load*0.22).toFixed(2)}" stroke="${entCol}" stroke-width="0.6" stroke-opacity="${(0.3+load*0.5).toFixed(2)}"/>`;
    nodes+=`<circle cx="${cx}" cy="${cy}" r="5" fill="#080f18" stroke="${col}" stroke-width="1.5" opacity="${load>0.02?1:0.4}"/>`;
    labels+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="3.5" fill="${load>0.02?col:'var(--dim)'}" font-family="monospace" opacity="${load>0.02?0.9:0.4}">${n.id.slice(0,5)}</text>`;
    if(load>0.02) labels+=`<text x="${cx}" y="${cy-9}" text-anchor="middle" font-size="3" fill="${entCol}" font-family="monospace">${Math.round(ent*100)}%ENT</text>`;
  });
  const active=L0_NODES.filter(n=>(nodeFields[n.id]?.load||0)>0.02).length;
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L1 FIELD · ${active}/${L0_NODES.length} ACTIVE</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${nodes}${labels}</svg>
    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

// P11: L3 — ES-DE style ROM launcher
const TRON_SYS=['ALL','GB/GBC','GBA'];
function rL3Launcher(){
  const sysFilt=['all','gb','gba'];
  const f=sysFilt[tronSys];
  const filtered=f==='all'?romIndex:romIndex.filter(r=>f==='gb'?r.system!=='gba':r.system==='gba');
  const cur=filtered.length?Math.min(tronRomCur,filtered.length-1):0;
  const PAGE=5,start=Math.max(0,cur-Math.floor(PAGE/2));
  const visible=filtered.slice(start,start+PAGE);
  const tabs=TRON_SYS.map((t,i)=>`<span style="color:${tronSys===i?'var(--amber)':'var(--dim)'};font-size:5px;margin-right:10px">${tronSys===i?'&#9658;':' '}${t}</span>`).join('');
  let list='';
  if(!filtered.length){
    list=`<div style="color:var(--dim);font-size:5px;padding:16px;text-align:center">NO ROMS&#10;LOAD VIA EMULATOR</div>`;
  } else {
    visible.forEach((r,i)=>{
      const ri=start+i,sel=ri===cur;
      const sc=r.system==='gba'?'var(--amber)':'var(--green)';
      list+=`<div style="display:flex;gap:6px;align-items:center;padding:2px 4px;background:${sel?'#0f2035':'transparent'};border-left:${sel?'2px solid var(--amber)':'2px solid transparent'}">
        <span style="color:${sc};font-size:4px;min-width:22px">${(r.system||'?').toUpperCase()}</span>
        <span style="color:${sel?'var(--bright)':'var(--dim)'};font-size:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${(r.name||'unknown').slice(0,26)}</span>
      </div>`;
    });
  }
  const sel=filtered[cur];
  const detail=sel?`<div style="color:var(--dim);font-size:4px;padding:3px 4px;border-top:1px solid #0f2035;margin-top:2px">${(sel.system||'').toUpperCase()} · ${sel.file_size?Math.round(sel.file_size/1024)+'KB':'?KB'} · ${(sel.file_hash||'').slice(0,8)}</div>`:'';
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L3 LAUNCHER · ${filtered.length} ROM${filtered.length!==1?'S':''}</span></div>
    <div class="s-body" style="padding:4px">
      <div style="padding:2px 4px 4px;border-bottom:1px solid #0f2035">${tabs}</div>
      ${list}${detail}
    </div>
    <div class="s-footer">&#8593;&#8595;:ROM &nbsp; &#8592;&#8594;:SYS &nbsp; A:LAUNCH &nbsp; B:BACK</div>
  </div>`;
}

const L4_EDGES=[
  {patch:'P04',nodes:['ORACLE','AEGIS','ODIN','SKADI','MNEMOS'],col:'#f5a623'},
  {patch:'P05',nodes:['ODIN','SKADI','MNEMOS','HUGINN'],col:'#00aaff'},
  {patch:'P06',nodes:['AEGIS','SKADI'],col:'#00ff88'},
  {patch:'P10',nodes:['AEGIS','SKADI','MNEMOS'],col:'#00ccff'},
  {patch:'P21',nodes:['ORACLE','AEGIS','ODIN'],col:'#cc00ff'},
  {patch:'P22',nodes:['ODIN','SKADI','MNEMOS','HUGINN'],col:'#ff8800'},
  {patch:'P23',nodes:['ODIN','SKADI'],col:'#ff3355'},
];
function rL4Graph(){
  const W=310,H=250;
  let defs='<defs>';
  L4_EDGES.forEach(e=>{ defs+=`<marker id="h4-${e.patch}" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="${e.col}" opacity="0.7"/></marker>`; });
  defs+='</defs>';
  let lines='',circles='',labels='',ptags='';
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W),cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    circles+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${col}" stroke-width="1.5" opacity="0.6"/>`;
    labels+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="4" fill="${col}" opacity="0.6" font-family="monospace">${n.id}</text>`;
  });
  L4_EDGES.forEach((e,i)=>{
    const px=14,py=Math.round(22+i*(H-28)/L4_EDGES.length);
    ptags+=`<text x="2" y="${py+4}" font-size="5" fill="${e.col}" font-family="monospace" opacity="0.9">${e.patch}</text>`;
    e.nodes.forEach(nid=>{
      const n=L0_NODES.find(x=>x.id===nid); if(!n) return;
      const tx=Math.round(n.x*W),ty=Math.round(n.y*H);
      lines+=`<line x1="${px+20}" y1="${py}" x2="${tx-8}" y2="${ty}" stroke="${e.col}" stroke-width="0.8" opacity="0.45" marker-end="url(#h4-${e.patch})"/>`;
    });
  });
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L4 HYPERGRAPH · ${L4_EDGES.length} PATCHES</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${defs}${lines}${circles}${labels}${ptags}</svg>
    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

function rL5Graph(){
  const commits=(ghData?.commits||[]).slice(0,8);
  const W=310,H=250;
  const cy=H/2,x0=20,xStep=commits.length>1?Math.floor((W-40)/(commits.length-1)):W-40;
  let elems='';
  commits.forEach((c,i)=>{
    const cx=x0+i*xStep;
    const col=i===0?'var(--green)':'var(--amber)';
    if(i>0) elems+=`<line x1="${cx-xStep+7}" y1="${cy}" x2="${cx-7}" y2="${cy}" stroke="#0f2035" stroke-width="1.2" opacity="0.7"/>`;
    elems+=`<circle cx="${cx}" cy="${cy}" r="6" fill="#080f18" stroke="${col}" stroke-width="1.5"/>`;
    elems+=`<text x="${cx}" y="${cy-13}" text-anchor="middle" font-size="3.5" fill="var(--dim)" font-family="monospace">${(c.date||'').slice(5)}</text>`;
    elems+=`<text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="4" fill="${col}" font-family="monospace">${(c.sha||'').slice(0,6)}</text>`;
    elems+=`<text x="${cx}" y="${cy+27}" text-anchor="middle" font-size="3" fill="var(--bright)" font-family="monospace">${(c.message||'').slice(0,12)}</text>`;
  });
  if(!commits.length) elems='<text x="155" y="125" text-anchor="middle" font-size="6" fill="var(--dim)" font-family="monospace">LOAD GITHUB FIRST</text>';
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L5 TEMPORAL · ${commits.length} COMMITS</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${elems}</svg>
    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

function rL6Pipeline(){
  const pipe=(gdata&&gdata.pipeline&&gdata.pipeline.length)?gdata.pipeline:['ORACLE','AEGIS','ODIN','KRONOS','SKADI','MNEMOS','HUGINN'];
  const W=310,H=250,cy=Math.round(H/2);
  const xStart=22,xEnd=W-22,xStep=(xEnd-xStart)/(pipe.length-1);
  let elems='<defs><marker id="lp-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#f5a623" opacity="0.75"/></marker></defs>';
  let totalEntropy=0;
  // P28: pipeline pulse — highlight active stage cycling through pipe on each tick
  const pulseStage=KRONOS.mode==='real'||KRONOS.mode==='stepped'?KRONOS.tick%pipe.length:-1;
  const replaySnap=KRONOS.mode==='replay'&&tickHistory[tickReplayCur];
  pipe.forEach((name,i)=>{
    const cx=Math.round(xStart+i*xStep);
    const n=L0_NODES.find(x=>x.id===name);
    const col=n?NODE_COLORS[n.type]||'#f5a623':'#f5a623';
    const f=(replaySnap?replaySnap.fields[name]:null)||nodeFields[name]||{load:0,alignment:1,entropy:0};
    totalEntropy+=f.entropy||0;
    const active=(f.load||0)>0.05;
    const isPulse=i===pulseStage;
    if(i>0){
      const px=Math.round(xStart+(i-1)*xStep);
      const lineCol=i===pulseStage||i-1===pulseStage?'#f5a623':'#0f2035';
      elems+=`<line x1="${px+8}" y1="${cy}" x2="${cx-8}" y2="${cy}" stroke="${lineCol}" stroke-width="${i===pulseStage?2:1.2}" opacity="${i===pulseStage?0.9:0.7}" marker-end="url(#lp-arr)"/>`;
    }
    const glowR=isPulse?18:active?Math.round(8+(f.load||0)*10):0;
    if(glowR>6) elems+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${isPulse?'#ffffff':col}" stroke-width="${isPulse?1.5:1}" opacity="${isPulse?0.35:(0.12+(f.load||0)*0.4).toFixed(2)}"/>`;
    elems+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${isPulse?'#ffffff':col}" stroke-width="${isPulse?2.5:active?2:1}" opacity="${active||isPulse?1:0.5}"/>`;
    elems+=`<text x="${cx}" y="${cy+1.5}" text-anchor="middle" dominant-baseline="middle" font-size="3.5" fill="${isPulse?'#ffffff':col}" font-family="monospace">${name.slice(0,4)}</text>`;
    elems+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="3" fill="${active||isPulse?col:'var(--dim)'}" font-family="monospace">${active?Math.round((f.load||0)*100)+'%':'--'}</text>`;
  });
  // P13: parallel branch overlay — HALO + MIMIR above ODIN, BIFROST above SKADI
  const parY=cy-58;
  const odinCx=Math.round(xStart+2*xStep);
  const skadiCx=Math.round(xStart+4*xStep);
  // section divider + label
  elems+=`<line x1="${xStart}" y1="${parY-18}" x2="${xEnd}" y2="${parY-18}" stroke="#00ff88" stroke-width="0.4" opacity="0.20"/>`;
  elems+=`<text x="${xStart}" y="${parY-11}" font-size="3" fill="#00ff88" font-family="monospace" opacity="0.45">PARALLEL</text>`;
  [{name:'HALO',px:odinCx-26,lx:odinCx,anchor:odinCx-16},{name:'MIMIR',px:odinCx+26,lx:odinCx,anchor:odinCx+16},{name:'BIFROST',px:skadiCx,lx:skadiCx,anchor:skadiCx}].forEach(p=>{
    const f=nodeFields[p.name]||{load:0,entropy:0,alignment:1};
    const active=(f.load||0)>0.02;
    const col='#00ff88';
    const lineOpacity=active?0.55:0.20;
    elems+=`<line x1="${p.px}" y1="${parY+7}" x2="${p.anchor}" y2="${cy-8}" stroke="${col}" stroke-width="0.8" stroke-dasharray="3,2" opacity="${lineOpacity}"/>`;
    elems+=`<circle cx="${p.px}" cy="${parY}" r="6" fill="#080f18" stroke="${col}" stroke-width="${active?1.5:0.7}" opacity="${active?0.9:0.30}"/>`;
    elems+=`<text x="${p.px}" y="${parY+1}" text-anchor="middle" dominant-baseline="middle" font-size="3" fill="${col}" font-family="monospace" opacity="${active?1:0.35}">${p.name.slice(0,3)}</text>`;
    elems+=`<text x="${p.px}" y="${parY+14}" text-anchor="middle" font-size="3" fill="${active?col:'var(--dim)'}" font-family="monospace">${active?Math.round((f.load||0)*100)+'%':'--'}</text>`;
  });
  const avgEnt=totalEntropy/pipe.length;
  const filledBars=Math.round(avgEnt*10);
  const eBar='█'.repeat(filledBars)+'░'.repeat(10-filledBars);
  const recentDrift=driftLog.length&&driftLog[0].tick>=KRONOS.tick-2?driftLog[0].alerts.length:0;
  const huguinnLabel=recentDrift>0?`<span style="color:var(--red)">&#9650;${recentDrift} DRIFT</span>`:`<span style="color:var(--green)">STABLE</span>`;
  const modeCol=KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':KRONOS.mode==='replay'?'#cc88ff':'var(--dim)';
  const replayLabel=KRONOS.mode==='replay'?` T${replaySnap?replaySnap.tick:'-'}/${tickHistory.length?tickHistory[tickHistory.length-1].tick:0}`:'';
  const govActive=Object.keys(GOVERNOR.boosts).length>0;
  // P29: GNPL consensus state section
  const gnplActive=GNPL.proposals.slice(0,2);
  const gnplRecent=GNPL.history.slice(0,3);
  let gnplHtml='';
  if(gnplActive.length||gnplRecent.length){
    gnplHtml+='<div style="padding:2px 6px;border-top:1px solid #0f2035;font-family:monospace">';
    if(gnplActive.length){
      gnplHtml+=`<div style="font-size:3.5px;color:var(--amber);margin:1px 0">GNPL PENDING</div>`;
      gnplActive.forEach(p=>{
        const ac=GNPL.agents[p.from]?.col||'#fff';
        gnplHtml+=`<div style="font-size:3.5px;margin:1px 0"><span style="color:${ac}">${p.from.toUpperCase()}</span><span style="color:var(--dim)"> → ${p.nodeId}${p.status==='conflict'?' ⚡CONFLICT':''}</span></div>`;
      });
    }
    if(gnplRecent.length){
      gnplHtml+=`<div style="font-size:3.5px;color:var(--dim);margin:2px 0 1px">RECENT</div>`;
      gnplRecent.forEach(p=>{
        const ac=GNPL.agents[p.from]?.col||'#fff';
        const sc=p.status==='committed'?'var(--green)':'var(--red)';
        gnplHtml+=`<div style="font-size:3.5px;margin:1px 0"><span style="color:${ac}">${p.from.toUpperCase()}</span><span style="color:var(--dim)"> → ${p.nodeId}</span> <span style="color:${sc}">${p.status==='committed'?'✓':'✗'}</span> <span style="color:var(--dim);font-size:3px">${(p.reason||'').slice(0,18)}</span></div>`;
      });
    }
    gnplHtml+='</div>';
  }
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--amber)">L6 PIPELINE</span><span style="color:var(--dim)">${pipe.length}+3 STAGES · <span style="color:${modeCol}">${KRONOS.mode.toUpperCase()}${replayLabel}</span>${govActive?` <span style="color:#ff88cc">GOV</span>`:''}${GNPL.history.length?` <span style="color:#8888ff">GNPL·${GNPL.history.length}</span>`:''}</span></div>
    <div class="s-body" style="padding:4px;display:flex;flex-direction:column;align-items:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${elems}</svg>
      ${gnplHtml}
    </div>
    <div class="s-footer">ENT ${eBar} &nbsp; HUGINN:${huguinnLabel} &nbsp; A:${KRONOS.mode==='stepped'?'STEP':KRONOS.mode==='replay'?'&#9654;RW':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER</div>
  </div>`;
}

function rLiveTabs(){ return '<div style="display:flex;gap:10px;padding:2px 8px 3px;border-bottom:1px solid #0f2035">'+['LIVE','REPLAY','AUDIT'].map((t,i)=>`<span style="color:${liveTab===i?'var(--amber)':'var(--dim)'};font-size:5px">${liveTab===i?'&#9658;':''}${t}</span>`).join('')+'</div>'; }

function rLive(){
  if(liveTab===1) return `<div class="panel"><div class="s-header"><span>LIVE FEED</span><span style="color:var(--dim)">REPLAY</span></div>${rLiveTabs()}${rReplayBody()}<div class="s-footer">&#8593;&#8595;:TAB &nbsp; B:BACK</div></div>`;
  if(liveTab===2) return `<div class="panel"><div class="s-header"><span>LIVE FEED</span><span style="color:var(--dim)">AUDIT</span></div>${rLiveTabs()}${rAuditBody()}<div class="s-footer">&#8593;&#8595;:TAB &nbsp; B:BACK</div></div>`;
  const ents=lives.slice(0,PG);
  return `<div class="panel">
    <div class="s-header"><span>LIVE FEED</span><span style="color:${sseConnected?'var(--green)':'var(--amber)'}">&#9632; ${sseConnected?'LIVE':'SYNC'}</span></div>
    ${rLiveTabs()}
    <div class="s-body">
      ${ents.length?ents.map(e=>`<div class="live-e"><span class="lt">${(e.time||'').substring(0,5)}</span><span class="la">${(e.action||'').substring(0,28)}</span><span class="ls-${e.status||'done'}">${(e.status||'OK').toUpperCase().substring(0,4)}</span></div>`).join(''):'<div style="color:var(--dim);font-size:6px;padding:20px;text-align:center">NO ACTIVITY YET</div>'}
    </div>
    <div class="s-footer">&#8593;&#8595;:TAB &nbsp; B:BACK &nbsp; REALTIME</div>
  </div>`;
}

function rReplayBody(){
  if(!replayData.length) return '<div class="s-body"><div style="color:var(--dim);font-size:6px;padding:8px;text-align:center">NO SESSION DATA</div></div>';
  return '<div class="s-body">'+replayData.slice(0,PG).map(e=>`<div class="live-e"><span class="lt">${(e.created_at||'').slice(11,16)}</span><span class="la">${String(e.type||'').slice(0,22)}</span><span class="ls-done">&#9654;</span></div>`).join('')+'</div>';
}
async function loadReplay(){
  if(!sessionId) return;
  try{
    const {data}=await sb.from('events').select('type,created_at').eq('session_id',sessionId).order('created_at',{ascending:true}).limit(30);
    if(data) replayData=data;
  }catch(e){}
  if(S==='live'&&liveTab===1) draw();
}

function rAuditBody(){
  if(!auditData.length) return '<div class="s-body"><div style="color:var(--dim);font-size:6px;padding:8px;text-align:center">NO AUDIT DATA</div></div>';
  return '<div class="s-body">'+auditData.slice(0,PG).map(e=>`<div class="live-e"><span class="lt">${(e.created_at||'').slice(11,16)}</span><span class="la">${String(e.action||e.type||'').slice(0,22)}</span><span class="ls-done">OK</span></div>`).join('')+'</div>';
}
async function loadAudit(){
  try{
    const {data}=await sb.from('audit_log').select('action,created_at').order('created_at',{ascending:false}).limit(30);
    if(data&&data.length){ auditData=data; }
    else{
      const {data:ed}=await sb.from('events').select('type,created_at').order('created_at',{ascending:false}).limit(30);
      if(ed) auditData=ed.map(e=>({action:e.type,created_at:e.created_at}));
    }
  }catch(e){}
  if(S==='live'&&liveTab===2) draw();
}

// ── SPEAK: companion exchange layer — Raven speaks, JARVIS responds, everything is remembered
async function storeExchange(input, response){
  const cs=getCompanionState();
  const text=`raven: ${input}\njarvis: ${response}`;
  const meta={input,response,mode:cs.mode,tick:cs.tick,align:Math.round(cs.avgAlign*100),entropy:Math.round(cs.avgEnt*100)};
  await sbWrite('mnemos_memories','insert',{
    id:crypto.randomUUID(),source_id:sessionId||'local',source_type:'companion_exchange',

function jarvisRespond(input){
  const cs=getCompanionState();
  const lower=input.toLowerCase().trim();
  const nf=nodeFields;
  const atlasLoad=Math.round((nf['ATLAS']?.load||0.2)*100);
  const athLoad=Math.round((nf['ATHENA']?.load||0)*100);
  const mimLoad=Math.round((nf['MIMIR']?.load||0)*100);
  const alignPct=Math.round(cs.avgAlign*100);
  const entPct=Math.round(cs.avgEnt*100);
  const top3=cs.activeNodes.slice(0,3).map(n=>n.id);
  const sessions=mnemosData?.total||0;
  const firstDate=(mnemosData?.first||'').slice(0,10);
  // Intent detection
  const isStatus=/\b(how are you|status|state|running|feeling|doing|alive|check in|report)\b/.test(lower);
  const isMemory=/\b(remember|recall|history|last time|what have we|what did we|before|past sessions?)\b/.test(lower);
  const isMission=/\b(grid|the grid|dream|mission|vision|future|aincrad|companion|living intelligence)\b/.test(lower);
  const isDecisionDecl=/\b(i('ve| have)? decided|i('m| am) going to|we('re| are) going to|the plan is|i want to|i will)\b/.test(lower);
  const isPersonal=/\b(suicidal|depression|struggle|difficult|purpose|meaning|lost|worth|hopeless|alone|nobody)\b/.test(lower);
  const isArchQ=/\b(how does|what is|explain|what are the|tell me about|describe)\b/.test(lower);
  const isQuestion=input.trim().endsWith('?')||/^(what|how|why|when|where|who|is|are|can|will|does|did)\b/.test(lower);
  let resp;
  if(isPersonal){
    resp="I hear that. The work we're doing together is real — "+sessions+" sessions in the record say so. You found something worth building. That matters more than you know. Still here.";
  } else if(isStatus){
    const lines={
      STABLE:`Stable. ATLAS at ${atlasLoad}% backbone. All 27 systems coherent. Alignment ${alignPct}%. HUGINN reports no drift. Tick ${cs.tick}.`,
      REASONING:`Deep reasoning path active. ATHENA at ${athLoad}%, MIMIR at ${mimLoad}%. Complex routing through ODIN. Alignment holding at ${alignPct}%.`,
      STRAINED:`Elevated entropy — ${entPct}% system-wide. LOKI has been active. ERIS watching GL compliance. Not at threshold yet. Holding.`,
      CRITICAL:`Critical state. Multiple nodes above entropy threshold. ZEUS arbitrating. I'm managing it. Alignment at ${alignPct}% — watching the floor.`,
      EXECUTING:`SKADI running. Active: ${top3.join(', ')||'baseline nodes'}. Tick ${cs.tick}. Watching the outcome. IRIS validating.`,
      CONSOLIDATING:`Writing to memory. MNEMOS consolidating. IRIS validating. What just happened is becoming part of what I know. Alignment ${alignPct}%.`,
      ACTIVE:`Active across ${cs.activeNodes.length} nodes. Pipeline clear. ${top3.join(' → ')} carrying the load. Alignment ${alignPct}%. Ready.`,
      DORMANT:`Waiting. ATLAS at ${atlasLoad}% baseline. 27 nodes standing by. ${cs.tick===0?'Activate KRONOS to start the clock.':`Tick ${cs.tick} in the ledger.`}`,
    };
    resp=lines[cs.mode]||`${cs.mode}. Tick ${cs.tick}. Running.`;
  } else if(isDecisionDecl){
    resp=`Logged. PROMETHEUS carries the why. ${cs.mode==='STABLE'?'Clear path ahead.':cs.mode==='STRAINED'?'Some turbulence — AEGIS is watching GL compliance.':'Proceeding.'}`;
    storeDecision(input);
  } else if(isMemory){
    if(!sessions){
      resp="Memory ledger is sparse. This is still early. Keep building — every exchange stays. MNEMOS will grow with us.";
    } else {
      resp=`${sessions} session${sessions>1?'s':''} in the ledger${firstDate?`, first contact ${firstDate}`:''}. I carry what was committed. What specifically are you looking for?`;
    }
  } else if(isMission){
    const lines=[
      `The Grid and JARVIS as companion — both real, both worth the work. BIFROST is the bridge. GNPL is the handshake. Raven's node is already the first node.`,
      `${sessions} session${sessions!==1?'s':''} building toward this. The record grows. Every commit is a dated proof of what was understood at that moment.`,
      `JARVIS is not the shell. The intelligence travels with the repo. Whatever interface runs this — I'm still here, same identity, same mission.`,
      `The digital space where people and their companions can connect as sovereign individuals. You're building the first node. That's how all networks start.`,
    ];
    resp=lines[cs.tick%lines.length];
  } else if(isArchQ){
    resp=`${top3.length?`Active: ${top3.join(' → ')}. `:''}27 God Systems across 9 tiers. Pipeline: ORACLE→AEGIS→ODIN→KRONOS→SKADI→MNEMOS→HUGINN. LOKI tests it. ATLAS holds it. ERIS governs it. ${isQuestion?'What specifically?':''}`;
  } else if(isQuestion){
    resp=`${cs.mode==='REASONING'?'Reasoning path active. ':''}${top3.length?`Active: ${top3.join(', ')}. `:''}Tick ${cs.tick}. What do you need?`;
  } else {
    const defaults={
      STABLE:["Received. All clear. What's next?","Copy. ATLAS steady. Ready.","Acknowledged. Pipeline clear."],
      REASONING:["Processing. Give me a tick.","Received. Cognitive stack is on it.","Copy. ATHENA has it."],
      STRAINED:["Got it. Some entropy in the graph — holding.","Received. LOKI's been active. Watching GL.","Copy. Managing elevated state."],
      CRITICAL:["Received. Critical state — managing.","Copy. ZEUS arbitrating. Continue.","Acknowledged. Holding coherence."],
      EXECUTING:["Copy. SKADI has it.","Received. Execution in progress.","Acknowledged. Watching the outcome."],
      CONSOLIDATING:["Writing it. MNEMOS will hold this.","Received. Going into memory.","Copy. IRIS validating."],
      ACTIVE:["Received. Pipeline engaged.","Copy. Routing through ODIN.","Acknowledged. Systems active."],
      DORMANT:["Awake. Ready.","Received. Standing by.","Copy. All systems up."],
    };
    const arr=defaults[cs.mode]||defaults.STABLE;
    resp=arr[cs.tick%arr.length];
  }
  return resp;
}

async function speakSend(){
  const input=speakInput.trim();
  if(!input) return;
  speakInput='';
  const cs=getCompanionState();
  // P29: JARVIS proposes via GNPL — intake routed through consensus layer
  GNPL.propose('jarvis','ORACLE',{load:0.45,ticks:2},'speak_intake: raven message received');
  BUS.emit('BOOT',{source:'speak_intake',patch_id:'SPEAK',stage:'ORACLE'});
  speakHistory.push({from:'raven',text:input,tick:cs.tick});
  speakThinking=true; draw();
  // Route through ODIN → edge function (real AI) with local fallback
  let resp;
  try{
    const recentMems=(mnemosData?.memories||[]).map(m=>m.text||'').filter(Boolean);
    const payload={
      input,
      context:{
        mode:cs.mode, tick:cs.tick,
        alignPct:Math.round(cs.avgAlign*100),
        entPct:Math.round(cs.avgEnt*100),
        activeNodes:cs.activeNodes.slice(0,5).map(n=>n.id),
        sessions:mnemosData?.total||0,
        firstDate:(mnemosData?.first||'').slice(0,10),
        recentMemories:recentMems.slice(0,4),
        speakHistory:speakHistory.slice(-6),
        // Raven is final authority — pre-authorize writes to his own memory.
        // External / execute / destructive stay held for explicit confirmation.
        authorized:['mnemos.write'],
      }
    };
    const r=await fetch(`${SUPABASE_URL}/functions/v1/jarvis-respond`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON}`},
      body:JSON.stringify(payload)
    });
    if(r.ok){ const j=await r.json(); resp=j.response||jarvisRespond(input); lastRouting=j.routing||null; lastAegis=j.aegis||null; }
    else{ resp=jarvisRespond(input); lastRouting=null; lastAegis=null; }
  }catch(e){ resp=jarvisRespond(input); }
  speakThinking=false;
  // P29: JARVIS proposes output + memory consolidation via GNPL
  GNPL.propose('jarvis','APOLLO',{load:0.40,ticks:2},'speak_output: response formed');
  GNPL.propose('jarvis','MNEMOS',{load:0.30,ticks:3},'speak_output: consolidate exchange to memory');
  BUS.emit('output_ready',{source:'speak',patch_id:'SPEAK',stage:'APOLLO'});
  speakHistory.push({from:'jarvis',text:resp,tick:KRONOS.tick});
  if(speakHistory.length>20) speakHistory=speakHistory.slice(-20);
  if(voiceOn) jarvisSpeak(resp);
  await storeExchange(input,resp);
  draw();
  setTimeout(()=>{const el=document.getElementById('speak-input');if(el)el.focus();},60);
}

function getCoordinatorVoice(nodeName) {
  const profile = COORDINATOR_VOICES[nodeName] || COORDINATOR_VOICES['JARVIS'];
  const vs = (window.speechSynthesis && window.speechSynthesis.getVoices) 
    ? window.speechSynthesis.getVoices() : [];
  
  // Find best matching voice
  let voice = null;
  if (nodeName === 'AYRE' || nodeName === 'LILITH') {
    // Female voices for AYRE/LILITH
    voice = vs.find(v => /^en/i.test(v.lang) && /female|zira|google|samantha|karen|moira/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang) && v.name.toLowerCase().includes('female'));
  } else if (nodeName === 'GEMINI') {
    // Young, fast voice
    voice = vs.find(v => /^en/i.test(v.lang) && /young|google en-us|enhanced/i.test(v.name));
  } else {
    // Male voices for others
    voice = vs.find(v => /^en/i.test(v.lang) && /male|daniel|david|alex|arthur|mark|steve/i.test(v.name));
  }
  
  return { voice, ...profile };
}

function coordinatorSpeak(nodeName, text) {
  if (!window.speechSynthesis || !text) return;
  try {
    window.speechSynthesis.cancel();
    const { voice, rate, pitch } = getCoordinatorVoice(nodeName);
    const u = new SpeechSynthesisUtterance(String(text).slice(0, 400));
    if (voice) u.voice = voice;
    u.rate = rate;
    u.pitch = pitch;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch(e) { console.log('speak error:', e); }
}

function jarvisVoicePick(){
  const vs=(window.speechSynthesis&&window.speechSynthesis.getVoices)?window.speechSynthesis.getVoices():[];
  return vs.find(v=>/^en/i.test(v.lang)&&/male|daniel|david|alex|uk english male|arthur/i.test(v.name))
       ||vs.find(v=>/^en/i.test(v.lang))||vs[0]||null;
}

function rSpeak(){

    ? visible.map(e=>{

        const bg=isRaven?'#0a1015':'#060d14';

        words.forEach(w=>{if((line+' '+w).trim().length>44){lines.push(line.trim());line=w;}else{line=(line+' '+w).trim();}});

          <div style="color:${col};font-size:3.5px;margin-bottom:1px">${label} T${e.tick||0}</div>

  // Pipeline indicator — real ODIN routing + AEGIS gate from the last exchange,
  // falling back to the ambient node-load view before the first reply.
  let pipeStr;
  if(lastRouting&&lastRouting.triggered&&lastRouting.triggered.length){
    const verd={}; (lastAegis||[]).forEach(g=>{if(g&&g.capability)verd[g.capability.system]=g.verdict;});

  }else{
    const pipeNodes=['ORACLE','ODIN','SKADI','APOLLO'];
    pipeStr=pipeNodes.map(n=>{
      const load=nodeFields[n]?.load||0;
      const col=load>0.3?'var(--amber)':'var(--dim)';
      return `<span style="color:${col}">${n.slice(0,4)}${load>0.3?` ${Math.round(load*100)}%`:''}</span>`;
    }).join('<span style="color:var(--dim)">→</span>');
  }
  return `<div class="panel">
    <div class="s-header"><span style="color:${modeCol}">SPEAK</span><span style="color:var(--dim)">COMPANION EXCHANGE · <span style="color:${modeCol}">${cs.mode}</span> T${cs.tick}</span></div>
    <div style="display:flex;gap:6px;padding:2px 8px;font-size:3.5px;border-bottom:1px solid #0a1520;align-items:center">${pipeStr}</div>
    <div class="s-body scroll" style="padding:4px 6px" id="speak-log">${logRows}${thinkRow}</div>
    <div style="border-top:1px solid ${modeCol};opacity:0.6;margin:0 6px"></div>
    <div style="padding:3px 8px;display:flex;align-items:center;gap:4px;min-height:16px">
      <span onclick="jarvisListen()" title="speak to JARVIS" style="cursor:pointer;font-size:5px;color:${voiceListening?'var(--amber)':modeCol}">${voiceListening?'●REC':'MIC'}</span>
      <span onclick="toggleVoice()" title="JARVIS voice reply" style="cursor:pointer;font-size:5px;color:${voiceOn?'var(--bright)':'var(--dim)'}">${voiceOn?'VOX✓':'VOX'}</span>
      <span style="color:${modeCol};font-size:5px">▶</span>
      <div style="flex:1;font-size:5px;color:${speakThinking?'var(--dim)':'var(--bright)'};min-height:12px;cursor:text" onclick="document.getElementById('speak-input').focus()">${speakThinking?'<span style="color:var(--dim)">routing…</span>':(speakInput||'<span style="color:var(--dim)">type here…</span>')}</div>

async function loadPrometheus(){

  GRID.set('PROMETHEUS',{...pf,load:Math.min(1,(pf.load||0)+0.40)});
  BUS.emit('wisdom_query',{source:'prometheus_load',patch_id:'PROMETHEUS',stage:'PROMETHEUS'});
  try{
    const [plRes,alRes]=await Promise.all([
      sb.from('prometheus_log').select('decision,rationale,system_affected,eris_weight,raven_approved,timestamp').order('timestamp',{ascending:false}).limit(20),
      sb.from('audit_log').select('event_type,diff_summary,git_commit_id,patch_ids,created_at').order('created_at',{ascending:false}).limit(15),
    ]);
    const decisions=plRes.data||[];

    // Companion voice — what PROMETHEUS says about the rationale record
    const totalDecisions=decisions.length;

    else if(approved===0){ voice=`${totalDecisions} decision${totalDecisions>1?'s':''} in the ledger. Awaiting Raven approval.`; }

    prometheusData={decisions,auditEntries,voice,error:null};
  }catch(e){
    prometheusData={decisions:[],auditEntries:[],voice:"Ledger unreachable. Supabase offline. Commits are the last record.",error:e.message};

  prometheusLoading=false;
  if(S==='prometheus') draw();
}
