<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS Emulator</title>
<script>
(async () => {
  try {
    const response = await fetch('./index.source.html', { cache: 'no-store' });
    if (!response.ok) throw new Error(`source ${response.status}`);
    const source = (await response.text()).replaceAll(
      'https://cdn.jsdelivr.net/npm/@core/supabase',
      'https://cdn.jsdelivr.net/npm/@supabase',
    );
    document.open();
    document.write(source);
    document.close();
  } catch (error) {
    document.body.textContent = `JARVIS Emulator failed to load: ${error}`;
  }
})();
</script>
