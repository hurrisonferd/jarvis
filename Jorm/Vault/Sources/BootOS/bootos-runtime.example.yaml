  - inspect core/JarvisMain/bootmenudsl file by file
  - recover authoritative JU-3 definition
  - recover authoritative BMM-2 definition
  - determine CECIL_OS authority and role

receipt:
  sources_read: []
  files_written: []
  tests_passed: []
  tests_failed: []
  status: pending
