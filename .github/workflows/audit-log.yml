name: Audit Log

# Auto-logs every push to main into Supabase audit_log (Patch 17)
# REQUIRED: Add SUPABASE_SERVICE_KEY as a GitHub repository secret:
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: SUPABASE_SERVICE_KEY
#   Value: your Supabase service_role key (from Project Settings → API)

on:
  push:
    branches: [main]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect commit metadata
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          MSG=$(git log -1 --pretty=%s | head -c 200)
          AUTHOR=$(git log -1 --pretty=%an)
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20 | tr '\n' '|' | sed 's/|$//')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          SAFE_MSG=$(echo "$MSG" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")
          SAFE_FILES=$(echo "$FILES" | python3 -c "import sys,json; raw=sys.stdin.read().strip(); parts=[p for p in raw.split('|') if p]; print(json.dumps(parts))")
          echo "msg_json=$SAFE_MSG" >> $GITHUB_OUTPUT
          echo "files_json=$SAFE_FILES" >> $GITHUB_OUTPUT

      - name: Post to Supabase audit_log
        env:
          SUPABASE_URL: https://oexghfsvhnggddllgvrt.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request

          url = os.environ["SUPABASE_URL"] + "/rest/v1/audit_log"
          key = os.environ.get("SUPABASE_SERVICE_KEY", "")

          if not key:
              print("SUPABASE_SERVICE_KEY not set — skipping audit log")
              exit(0)

          sha    = "${{ steps.meta.outputs.sha }}"
          author = "${{ steps.meta.outputs.author }}"
          msg    = ${{ steps.meta.outputs.msg_json }}
          files  = ${{ steps.meta.outputs.files_json }}

          payload = json.dumps({
              "event_type":    "CHANGE",
              "source_system": "github",
              "git_commit_id": sha,
              "diff_summary":  msg,
              "affected_paths": files,
              "metadata": {"author": author, "repo": "hurrisonferd/jarvis"}
          }).encode()

          req = urllib.request.Request(url, data=payload, method="POST")
          req.add_header("apikey",        key)
          req.add_header("Authorization", "Bearer " + key)
          req.add_header("Content-Type",  "application/json")
          req.add_header("Prefer",        "return=minimal")

          try:
              resp = urllib.request.urlopen(req)
              print(f"Audit logged: {sha[:7]} — {msg[:60]}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"Audit log failed {e.code}: {body}")
              exit(1)
          PYEOF
