name: Audit Log

# SKADI — writes every push to audit/push_log.jsonl in the repo.
# No Supabase required. Git history is the source of truth.

on:
  push:
    branches: [main]

jobs:
  log:
    name: SKADI — Audit Push
    runs-on: ubuntu-latest
    # Don't run on automated pipeline commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Append to push log
        run: |
          python3 << 'PYEOF'
          import json, pathlib, subprocess
          from datetime import datetime, timezone

          def git(cmd):
              try:
                  return subprocess.check_output(cmd, shell=True, text=True,
                                                 stderr=subprocess.DEVNULL).strip()
              except Exception:
                  return ""

          sha    = git("git rev-parse HEAD")
          msg    = git("git log -1 --pretty=%s")[:200]
          author = git("git log -1 --pretty=%an")
          files  = [f for f in git("git diff --name-only HEAD~1 HEAD 2>/dev/null").splitlines() if f][:20]
          ts     = datetime.now(timezone.utc).isoformat()[:19] + "Z"

          entry = {
              "ts": ts, "sha": sha[:7], "sha_full": sha,
              "msg": msg, "author": author, "files": files,
          }

          log_path = pathlib.Path("audit/push_log.jsonl")
          log_path.parent.mkdir(parents=True, exist_ok=True)

          # Read existing, trim to last 199, append new
          existing = []
          if log_path.exists():
              for line in log_path.read_text().splitlines():
                  line = line.strip()
                  if line:
                      try:
                          existing.append(json.loads(line))
                      except Exception:
                          pass
          existing = existing[-199:]
          existing.append(entry)

          log_path.write_text("\n".join(json.dumps(e) for e in existing) + "\n")
          print(f"Audit: {sha[:7]} — {msg[:60]}")
          print(f"  files: {len(files)}  total log: {len(existing)} entries")
          PYEOF

      - name: Commit audit log
        run: |
          git config user.name  "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add audit/push_log.jsonl
          git diff --staged --quiet || git commit -m "chore(audit): push log [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main) || echo "Push skipped"
