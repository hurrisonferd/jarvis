name: JARVIS Integrity

# AEGIS + NEMESIS + MERIDIAN as CI. Validates the JARVIS brain on every change:
#   - edge-function logic (guard.ts, router.ts) unit tests
#   - MCP server boots and serves its route surface (smoke test)
#   - god-system canon is intact (no drift, no renumber)
# Cloud-first: runs entirely on GitHub Actions. No local machine required.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  integrity:
    name: AEGIS — validate the brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (type-strip runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: NEMESIS — edge-function unit tests
        working-directory: supabase/functions/jarvis-respond
        run: |
          node --experimental-strip-types guard.test.ts
          node --experimental-strip-types router.test.ts
          node --experimental-strip-types aegis.test.ts
          node --experimental-strip-types recall.test.ts
          node --experimental-strip-types execute.test.ts
          node --experimental-strip-types ../bifrost/bifrost.test.ts
          node --experimental-strip-types ../jarvis-mcp/council.test.ts
          node --experimental-strip-types ../jarvis-mcp/grid.test.ts
          node --experimental-strip-types ../jarvis-mcp/halo.test.ts
          node --experimental-strip-types ../jarvis-mcp/crypto.test.ts

      - name: Front — inline script parses (const-bug guard)
        run: |
          python3 - <<'PY'
          import re, sys
          html = open('docs/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
          if not scripts:
              print('FAIL: no inline <script>'); sys.exit(1)
          open('/tmp/app.js','w').write(max(scripts, key=len))
          PY
          node --check /tmp/app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AEGIS — MCP server smoke test
        run: |
          pip install --quiet fastapi uvicorn
          python3 scripts/smoke_server.py

      - name: MERIDIAN — god-system canon guard
        run: python3 scripts/check_canon.py

      - name: MNEMOS — decision-capture tests
        run: python3 scripts/test_capture_decisions.py

      - name: MNEMOS — bounded-log tests
        run: python3 scripts/test_mnemos_log.py

      - name: HALO — proactive brief tests
        run: python3 scripts/test_jarvis_brief.py

      - name: MNEMOS — remember-loop tests
        run: python3 scripts/test_companion_remember.py

      - name: MNEMOS — log-system tests
        run: python3 scripts/test_companion_log.py
