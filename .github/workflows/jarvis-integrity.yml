name: JARVIS Integrity

# Diagnostic integrity suite. On pull requests it is advisory and may not block
# Raven-approved merges. On main it remains strict so regressions are still visible
# after integration without turning stale legacy assumptions into a merge gate.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    name: AEGIS — validate the brain
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node (type-strip runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: NEMESIS — edge-function unit tests
        working-directory: core/supabase/functions/jarvis-respond
        run: |
          node --experimental-strip-types guard.test.ts
          node --experimental-strip-types router.test.ts
          node --experimental-strip-types aegis.test.ts
          node --experimental-strip-types recall.test.ts
          node --experimental-strip-types execute.test.ts
          node --experimental-strip-types ../bifrost/bifrost.test.ts
          node --experimental-strip-types ../jarvis-mcp/council.test.ts
          node --experimental-strip-types ../jarvis-mcp/grid.test.ts
          node --experimental-strip-types ../jarvis-mcp/halo.test.ts
          node --experimental-strip-types ../jarvis-mcp/crypto.test.ts
          node --experimental-strip-types ../grid-write/validate.test.ts
          node --experimental-strip-types ../jarvis-dex/jfs.test.ts

      - name: Front — inline script parses
        run: |
          python3 - <<'PY'
          import re, sys
          html = open('docs/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S)
          if not scripts:
              print('FAIL: no inline <script>'); sys.exit(1)
          open('/tmp/app.js','w').write(max(scripts, key=len))
          PY
          node --check /tmp/app.js

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MERIDIAN — god-system canon guard
        run: python3 operations/scripts/check_canon.py

      - name: MNEMOS — decision-capture tests
        run: python3 operations/scripts/test_capture_decisions.py

      - name: MNEMOS — bounded-log tests
        run: python3 operations/scripts/test_mnemos_log.py

      - name: HALO — proactive brief tests
        run: python3 operations/scripts/test_jarvis_brief.py

      - name: MNEMOS — remember-loop tests
        run: python3 operations/scripts/test_companion_remember.py

      - name: MNEMOS — log-system tests
        run: python3 operations/scripts/test_companion_log.py

      - name: PATCH — register writer tests
        run: python3 operations/scripts/test_jarvis_patch.py

      - name: Advisory notice
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: echo "AEGIS diagnostics are advisory on pull requests; Raven retains merge authority."
