name: deploy-edge-functions

# BLACKWALL DEPLOY LAW
# - Source changes deploy only the Edge Functions whose source changed.
# - A workflow-only change deploys zero functions.
# - Platform JWT stays ON by default.
# - Only explicitly reviewed custom-auth/public surfaces may use --no-verify-jwt.
# - Manual dispatch deploys exactly one named function.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-edge-functions.yml"
      - "operations/scripts/check_external_identifiers.py"
      - "core/supabase/functions/**"
      - "core/supabase/migrations/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        default: "jarvis-mcp"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard external dependency identifiers
        run: python3 operations/scripts/check_external_identifiers.py

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate required deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GRID_GPT_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
          ATOM_MCP_TOKEN: ${{ secrets.ATOM_MCP_TOKEN }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN GRID_GPT_TOKEN ATOM_MCP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          if supabase link --project-ref "$REF" --workdir core 2>&1 | grep -q "Already linked"; then
            echo "✓ Project already linked"
          else
            echo "→ Linking project..."
            supabase link --project-ref "$REF" --workdir core 2>&1 || {
              echo "Supabase project link failed"
              exit 1
            }
          fi

      - name: Set shared Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
          GRID_GPT_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
          ATOM_MCP_TOKEN: ${{ secrets.ATOM_MCP_TOKEN }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          supabase secrets set \
            GRID_GPT_TOKEN="$GRID_GPT_TOKEN" \
            ATOM_MCP_TOKEN="$ATOM_MCP_TOKEN" \
            OPENHANDS_API_KEY="$OPENHANDS_API_KEY" \
            --project-ref "$REF"

      - name: Set DEPLOY_SHA secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
          DEPLOY_SHA: ${{ github.sha }}
        run: supabase secrets set DEPLOY_SHA="$DEPLOY_SHA" --project-ref "$REF"

      - name: Apply pending migrations via Management API
        if: ${{ github.event_name == 'workflow_dispatch' || contains(toJson(github.event.commits.*.modified), 'core/supabase/migrations') || contains(toJson(github.event.commits.*.added), 'core/supabase/migrations') }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, json, os, glob
          API = "https://api.supabase.com/v1/projects/oexghfsvhnggddllgvrt/database/queries"
          TOKEN = os.environ.get("SUPABASE_ACCESS_TOKEN", "")

          def api_query(sql):
              payload = json.dumps({"query": sql})
              r = subprocess.run(["curl", "-s", "-X", "POST", API,
                  "-H", "Authorization: Bearer " + TOKEN,
                  "-H", "Content-Type: application/json",
                  "-d", payload], capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except Exception:
                  return r.stdout

          def split_sql(content):
              stmts, buf, in_dollar = [], "", False
              for line in content.split("\n"):
                  stripped = line.rstrip()
                  count = stripped.count("$$")
                  if count == 1:
                      in_dollar = not in_dollar
                  elif count >= 2 and count % 2 == 1:
                      in_dollar = not in_dollar
                  if not in_dollar and stripped.endswith(";"):
                      stmts.append((buf + "\n" + stripped[:-1]).strip())
                      buf = ""
                  else:
                      if buf or stripped:
                          buf += "\n" + line
              if buf.strip():
                  stmts.append(buf.strip())
              return [s for s in stmts if s]

          for f in sorted(glob.glob("core/supabase/migrations/*.sql")):
              name = os.path.basename(f[:-4])
              check = api_query("SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='{}' LIMIT 1".format(name))
              if isinstance(check, list) and len(check) > 0:
                  print(f"✓ {name} already applied")
                  continue
              all_ok = True
              for stmt in split_sql(open(f).read()):
                  if stmt.lstrip().startswith("--"):
                      continue
                  result = api_query(stmt)
                  if isinstance(result, list) and result and isinstance(result[0], dict) and result[0].get("code"):
                      print(f"⚠ {name}: {result[0].get('message', str(result))[:100]}")
                      all_ok = False
              if all_ok:
                  print(f"✓ {name} applied")
          PYEOF

      - name: Resolve deploy targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL_FUNCTION: ${{ inputs.function }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="$MANUAL_FUNCTION"
            if [ ! -d "core/supabase/functions/$NAME" ]; then
              echo "Unknown Edge Function: $NAME"
              exit 1
            fi
            printf '%s\n' "$NAME" > /tmp/deploy-targets.txt
          else
            BASE="$BEFORE"
            if [ -z "$BASE" ] || echo "$BASE" | grep -Eq '^0+$'; then
              BASE="$(git rev-parse HEAD^)"
            fi
            git diff --name-only "$BASE" "$AFTER" \
              | awk -F/ '/^core\/supabase\/functions\/[^/]+\// {print $4}' \
              | sort -u \
              | while read -r NAME; do
                  [ -d "core/supabase/functions/$NAME" ] && printf '%s\n' "$NAME"
                done > /tmp/deploy-targets.txt
          fi
          echo "Deploy targets:"
          cat /tmp/deploy-targets.txt || true
          COUNT=$(grep -c . /tmp/deploy-targets.txt || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Deploy changed Edge Functions with explicit auth policy
        if: ${{ steps.targets.outputs.count != '0' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          set -euo pipefail

          # Custom-auth/public surfaces reviewed by Blackwall. Everything else
          # keeps platform JWT verification ON by default.
          no_jwt() {
            case "$1" in
              jarvis-mcp|jarvis-dex|jarvis-action|coop-broadcast|coop-sse-relay|atom-mcp|musicos-source-upload)
                return 0 ;;
              *)
                return 1 ;;
            esac
          }

          while read -r NAME; do
            [ -n "$NAME" ] || continue
            echo "→ deploying $NAME"
            if no_jwt "$NAME"; then
              supabase functions deploy "$NAME" --project-ref "$REF" --no-verify-jwt --workdir core
            else
              supabase functions deploy "$NAME" --project-ref "$REF" --workdir core
            fi
          done < /tmp/deploy-targets.txt

      - name: Deployment receipt
        run: |
          echo "Edge deploy count: ${{ steps.targets.outputs.count }}"
          if [ -s /tmp/deploy-targets.txt ]; then
            sed 's/^/- /' /tmp/deploy-targets.txt
          else
            echo "- none (workflow/source-only change)"
          fi
