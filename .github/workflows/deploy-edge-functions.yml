name: deploy-edge-functions

# CLEAN PATH: the repo is the single source of truth; merging to main auto-deploys the
# connector. No manual trigger needed (Raven: "I didn't have to set it up last time").
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-edge-functions.yml"
      - "operations/scripts/check_external_identifiers.py"
      - "core/supabase/functions/jarvis-mcp/**"
      - "core/supabase/functions/jarvis-dex/**"
      - "core/supabase/functions/jarvis-jcs/**"
      - "core/supabase/functions/jarvis-action/**"
      - "core/supabase/functions/kronos-fold/**"
      - "core/supabase/functions/grid-write/**"
      - "core/supabase/functions/grid-event/**"
      - "core/supabase/functions/bifrost/**"
      - "core/supabase/functions/coop-broadcast/**"
      - "core/supabase/functions/coop-sse-relay/**"
      - "core/supabase/functions/jarvis-broadcast/**"
      - "core/supabase/functions/jarvis-monitor/**"
      - "core/supabase/functions/jarvis-respond/**"
      - "core/supabase/functions/send-push/**"
      - "core/supabase/functions/mnemos-*/**"
      - "core/supabase/migrations/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        default: "jarvis-mcp"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Guard external dependency identifiers
        run: python3 operations/scripts/check_external_identifiers.py

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate required deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GRID_GPT_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
          ATOM_MCP_TOKEN: ${{ secrets.ATOM_MCP_TOKEN }}
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN GRID_GPT_TOKEN ATOM_MCP_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          PROJECT_REF="$REF"
          if supabase link --project-ref "$PROJECT_REF" --workdir core 2>&1 | grep -q "Already linked"; then
            echo "✓ Project already linked"
          else
            echo "→ Linking project..."
            supabase link --project-ref "$PROJECT_REF" --workdir core 2>&1 || echo "⚠ link failed"
          fi

      - name: Set Supabase Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
          GRID_GPT_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
          ATOM_MCP_TOKEN: ${{ secrets.ATOM_MCP_TOKEN }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          echo "Setting edge function secrets..."
          supabase secrets set \
            GRID_GPT_TOKEN="$GRID_GPT_TOKEN" \
            ATOM_MCP_TOKEN="$ATOM_MCP_TOKEN" \
            OPENHANDS_API_KEY="$OPENHANDS_API_KEY" \
            --project-ref "$REF"

      - name: Deploy JARVIS MCP recovery surface
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.function == 'jarvis-mcp' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: supabase functions deploy jarvis-mcp --project-ref "$REF" --no-verify-jwt --workdir core

      - name: Apply migrations via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, json, os, glob
          API = "https://api.supabase.com/v1/projects/oexghfsvhnggddllgvrt/database/queries"
          TOKEN = os.environ.get("SUPABASE_ACCESS_TOKEN", "")

          def api_query(sql):
              payload = json.dumps({"query": sql})
              r = subprocess.run(["curl", "-s", "-X", "POST", API,
                  "-H", "Authorization: Bearer " + TOKEN,
                  "-H", "Content-Type: application/json",
                  "-d", payload], capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except:
                  return r.stdout

          def split_sql(content):
              """Split SQL on semicolons, but preserve $$..$$ quoted strings (DO blocks, function bodies)."""
              stmts, buf, in_dollar = [], "", False
              for line in content.split("\n"):
                  stripped = line.rstrip()
                  count = stripped.count("$$")
                  if count == 1:
                      in_dollar = not in_dollar
                  elif count >= 2:
                      if count % 2 == 1:
                          in_dollar = not in_dollar
                  if not in_dollar and stripped.endswith(";"):
                      if buf.strip():
                          stmts.append(buf.strip() + "\n" + stripped[:-1])
                      else:
                          stmts.append(stripped[:-1])
                      buf = ""
                  else:
                      if buf or stripped:
                          buf += "\n" + line
              if buf.strip():
                  stmts.append(buf.strip())
              return stmts

          for f in sorted(glob.glob("core/supabase/migrations/*.sql")):
              name = os.path.basename(f[:-4])
              sql_content = open(f).read()
              check = api_query("SELECT 1 FROM supabase_migrations.schema_migrations WHERE version='{}' LIMIT 1".format(name))
              if isinstance(check, list) and len(check) > 0:
                  print(f"✓ {name} already applied")
                  continue
              stmts = split_sql(sql_content)
              all_ok = True
              for stmt in stmts:
                  if not stmt.strip() or stmt.strip().startswith("--"):
                      continue
                  result = api_query(stmt)
                  if isinstance(result, list) and len(result) > 0 and isinstance(result[0], dict) and result[0].get("code"):
                      msg = result[0].get("message", str(result))[:100]
                      print(f"⚠ {name}: {msg}")
                      all_ok = False
              if all_ok:
                  print(f"✓ {name} applied ({len(stmts)} statement(s))")
          PYEOF

      - name: Set DEPLOY_SHA secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          echo "DEPLOY_SHA=$DEPLOY_SHA"
          echo "Setting DEPLOY_SHA secret..."
          supabase secrets set DEPLOY_SHA="$DEPLOY_SHA" --project-ref "$REF"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.function }}" != "jarvis-mcp" ]; then
              supabase functions deploy "${{ inputs.function }}" --project-ref "$REF" --no-verify-jwt --workdir core
            fi
          else
            # Deploy all functions — new ones deploy automatically.
            for fn in core/supabase/functions/*/; do
              NAME=$(basename "$fn")
              if [ "$NAME" = "jarvis-mcp" ]; then
                continue
              fi
              echo "→ deploying $NAME @ $DEPLOY_SHA"
              supabase functions deploy "$NAME" --project-ref "$REF" --no-verify-jwt --workdir core
            done
          fi
