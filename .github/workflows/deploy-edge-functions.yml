name: deploy-edge-functions

# CLEAN PATH (Raven-directed 2026-06-13): the repo becomes the single source of truth for
# the Supabase edge functions, and CI deploys them. Manual-trigger ONLY for now —
# the LIVE jarvis-mcp is antigravity's 32-tool build and is NOT yet reconciled into this
# repo, so auto-deploying the repo's (older) jarvis-mcp would REGRESS the live connector.
# Once the live source is pulled in and reconciled, switch to push-on-main and remove this note.
#
# Requires repo secret: SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…, from
# Supabase Account → Access Tokens — NOT the publishable or service/secret key).

on:
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (e.g. jarvis-mcp, jarvis-dex)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ${{ inputs.function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy "${{ inputs.function }}" \
            --project-ref oexghfsvhnggddllgvrt \
            --no-verify-jwt
