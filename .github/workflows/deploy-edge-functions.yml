name: deploy-edge-functions

# CLEAN PATH: the repo is the single source of truth; merging to main auto-deploys the
# connector. No manual trigger needed (Raven: "I didn't have to set it up last time").
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-edge-functions.yml"
      - "supabase/functions/jarvis-mcp/**"
      - "supabase/functions/jarvis-dex/**"
      - "supabase/functions/jarvis-action/**"
      - "supabase/functions/kronos-fold/**"
      - "supabase/functions/grid-write/**"
      - "supabase/functions/grid-event/**"
      - "supabase/functions/bifrost/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          set -e
          PROJECT_REF="$REF"
          # Fetch connection string via Management API — requires SUPABASE_ACCESS_TOKEN
          # Falls back to DATABASE_URL secret if token unavailable
          # Primary: use Supabase CLI (handles connection internally via project ref + token).
          # supabase/setup-cli@v1 already authenticated via SUPABASE_ACCESS_TOKEN.
          # CLI approach works without DATABASE_URL.
          if supabase link --project-ref "$PROJECT_REF" 2>&1 | grep -q "Already linked"; then
            echo "✓ Project already linked"
          else
            echo "→ Linking project..."
            supabase link --project-ref "$PROJECT_REF" 2>&1 || echo "⚠ link failed"
          fi
          echo "→ Applying migrations via Supabase CLI..."
          # --include-all: push all local migrations to remote, regardless of remote history.
          # Fetch fallback DB config outside the conditional (used if CLI fails).
          DB_CONFIG=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          DB_URL=$(echo "$DB_CONFIG" | jq -r '.connection_info.connection_string // .connection_string // null')
          DB_HOST=$(echo "$DB_CONFIG" | jq -r '.database.host // null')
          if supabase db push --include-all 2>&1; then
            echo "✓ Migrations applied via Supabase CLI"
          else
            echo "⚠ Supabase CLI migration failed — trying raw psql"
            if [ "$DB_URL" != "null" ] && [ -n "$DB_URL" ]; then
              export DATABASE_URL="$DB_URL"
              echo "✓ Using connection string from Management API"
            elif [ "$DB_HOST" != "null" ] && [ -n "$DB_HOST" ]; then
              # Requires DB_PASSWORD env var (set as a repo secret or environment variable)
              export DATABASE_URL="postgresql://postgres:${DB_PASSWORD}@${DB_HOST}:6543/postgres"
              echo "⚠ Constructed DATABASE_URL from host — set DB_PASSWORD secret if this fails"
            fi
            if [ -n "$DATABASE_URL" ]; then
              echo "Connecting to: ${DATABASE_URL%%@*}"
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
              for f in supabase/migrations/*.sql; do
                NAME=$(basename "${f%.sql}")
                EXISTS=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM supabase_migrations.schema_migrations WHERE name='$NAME' LIMIT 1" 2>/dev/null || echo "")
                if [ "$EXISTS" = "1" ]; then
                  echo "✓ $NAME already applied"
                else
                  echo "→ applying $NAME"
                  psql "$DATABASE_URL" -f "$f" 2>&1 && echo "✓ $NAME applied" || echo "⚠ $NAME failed"
                fi
              done
            else
              echo "⚠ DATABASE_URL not available — skipping migrations"
              exit 0
            fi
          fi
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            supabase functions deploy "${{ inputs.function }}" --project-ref "$REF" --no-verify-jwt
          else
            # Deploy all functions — new ones deploy automatically
            for fn in supabase/functions/*/; do
              NAME=$(basename "$fn")
              echo "→ deploying $NAME"
              supabase functions deploy "$NAME" --project-ref "$REF" --no-verify-jwt
            done
          fi
