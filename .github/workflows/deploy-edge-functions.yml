name: deploy-edge-functions

# CLEAN PATH: the repo is the single source of truth; merging to main auto-deploys the
# connector. No manual trigger needed (Raven: "I didn't have to set it up last time").
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-edge-functions.yml"
      - "supabase/functions/jarvis-mcp/**"
      - "supabase/functions/jarvis-dex/**"
      - "supabase/functions/jarvis-action/**"
      - "supabase/functions/kronos-fold/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          set -e
          PROJECT_REF="$REF"
          # Fetch connection string via Management API — requires SUPABASE_ACCESS_TOKEN
          # Falls back to DATABASE_URL secret if token unavailable
          if [ -z "$DATABASE_URL" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Fetching DATABASE_URL via Supabase Management API..."
            DB_CONFIG=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
            DB_URL=$(echo "$DB_CONFIG" | jq -r '.connection_info.connection_string // .connection_info.connection_string // .connection_string // null')
            if [ "$DB_URL" != "null" ] && [ -n "$DB_URL" ]; then
              export DATABASE_URL="$DB_URL"
              echo "✓ DATABASE_URL fetched via Management API"
            else
              echo "⚠ Could not fetch DATABASE_URL — API response:"
              echo "$DB_CONFIG" | jq '.' 2>/dev/null || echo "$DB_CONFIG"
            fi
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠ DATABASE_URL not available — skipping migrations"
            echo "  To enable: add DATABASE_URL as a repo secret, or ensure SUPABASE_ACCESS_TOKEN has read access to /postgres endpoint"
            exit 0
          fi
          echo "Connecting to: ${DATABASE_URL%%@*}"
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          for f in supabase/migrations/*.sql; do
            NAME=$(basename "${f%.sql}")
            EXISTS=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM supabase_migrations.schema_migrations WHERE name='$NAME' LIMIT 1" 2>/dev/null || echo "")
            if [ "$EXISTS" = "1" ]; then
              echo "✓ $NAME already applied"
            else
              echo "→ applying $NAME"
              psql "$DATABASE_URL" -f "$f" 2>&1 && echo "✓ $NAME applied" || echo "⚠ $NAME failed"
            fi
          done
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            supabase functions deploy "${{ inputs.function }}" --project-ref "$REF" --no-verify-jwt
          else
            # Deploy all functions — new ones deploy automatically
            for fn in supabase/functions/*/; do
              NAME=$(basename "$fn")
              echo "→ deploying $NAME"
              supabase functions deploy "$NAME" --project-ref "$REF" --no-verify-jwt
            done
          fi
