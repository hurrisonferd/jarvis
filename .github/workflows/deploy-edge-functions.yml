name: deploy-edge-functions

# CLEAN PATH: the repo is the single source of truth; merging to main auto-deploys the
# connector. No manual trigger needed (Raven: "I didn't have to set it up last time").
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/jarvis-mcp/**"
      - "supabase/functions/jarvis-dex/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            supabase functions deploy "${{ inputs.function }}" --project-ref "$REF" --no-verify-jwt
          else
            supabase functions deploy jarvis-mcp --project-ref "$REF" --no-verify-jwt
            supabase functions deploy jarvis-dex --project-ref "$REF" --no-verify-jwt
          fi
