name: deploy-edge-functions

# CLEAN PATH: the repo is the single source of truth; merging to main auto-deploys the
# connector. No manual trigger needed (Raven: "I didn't have to set it up last time").
# Requires repo secret SUPABASE_ACCESS_TOKEN (a personal access token, sbp_…).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-edge-functions.yml"
      - "supabase/functions/jarvis-mcp/**"
      - "supabase/functions/jarvis-dex/**"
      - "supabase/functions/jarvis-action/**"
      - "supabase/functions/kronos-fold/**"
      - "supabase/functions/grid-write/**"
      - "supabase/functions/grid-event/**"
      - "supabase/functions/bifrost/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      function:
        description: "edge function to deploy (manual override)"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          set -e
          PROJECT_REF="$REF"
          # Primary: Supabase CLI (handles connection internally via token).
          # supabase/setup-cli@v1 installs the CLI binary; SUPABASE_ACCESS_TOKEN
          # (set in this step's env block) provides authentication.
          # CLI reaches the DB via Supabase's internal tunnel — raw psql cannot.
          if supabase link --project-ref "$PROJECT_REF" 2>&1 | grep -q "Already linked"; then
            echo "✓ Project already linked"
          else
            echo "→ Linking project..."
            supabase link --project-ref "$PROJECT_REF" 2>&1 || echo "⚠ link failed"
          fi
          echo "→ Applying migrations via Management API..."
          # Management API POST /v1/projects/{ref}/database/migrations applies SQL by version name.
          # Body: {"query": "<sql>", "name": "<version>"}. Bypasses CLI entirely.
          for f in supabase/migrations/*.sql; do
            NAME=$(basename "${f%.sql}")
            # Check if already applied
            EXISTS=$(curl -s "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations/$NAME" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" | jq -e '.version' >/dev/null 2>&1 && echo "1" || echo "")
            if [ "$EXISTS" = "1" ]; then
              echo "✓ $NAME already applied"
            else
              echo "→ Applying $NAME..."
              PAYLOAD=$(python3 -c "import sys,json; name=sys.argv[1]; sql=open(sys.argv[2]).read(); print(json.dumps({'query': sql, 'name': name}))" "$NAME" "$f")
              RESPONSE=$(curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/migrations" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              if echo "$RESPONSE" | jq -e '.version' >/dev/null 2>&1; then
                echo "✓ $NAME applied"
              else
                echo "⚠ $NAME failed: $(echo "$RESPONSE" | jq -r '.message // .error // .' | head -c 100)"
              fi
            fi
          done
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: oexghfsvhnggddllgvrt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            supabase functions deploy "${{ inputs.function }}" --project-ref "$REF" --no-verify-jwt
          else
            # Deploy all functions — new ones deploy automatically
            for fn in supabase/functions/*/; do
              NAME=$(basename "$fn")
              echo "→ deploying $NAME"
              supabase functions deploy "$NAME" --project-ref "$REF" --no-verify-jwt
            done
          fi
