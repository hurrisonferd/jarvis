name: apply-supabase-repair-on-pr

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ startsWith(github.head_ref, 'jarvis-write-') && !contains(github.event.pull_request.title, '[repair-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python3 operations/scripts/repair_supabase_identifiers.py
      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "JARVIS Repair"
          git config user.email "jarvis-repair@users.noreply.github.com"
          git add -A
          git commit -m "repair(supabase): restore external identifiers [repair-applied]"
          git push origin "HEAD:${{ github.head_ref }}"
