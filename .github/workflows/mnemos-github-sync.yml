name: MNEMOS GitHub Sync

# Stores GitHub activity in MNEMOS — issues, PRs, commits feed the memory layer.
# REQUIRED: SUPABASE_SERVICE_KEY in repo Settings → Secrets → Actions

on:
  issues:
    types: [opened, closed, labeled, reopened]
  pull_request:
    types: [opened, closed]
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync event to MNEMOS
        env:
          SUPABASE_URL: https://oexghfsvhnggddllgvrt.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_SERVICE_KEY not set — skipping MNEMOS sync"
            exit 0
          fi

          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error

          url  = os.environ["SUPABASE_URL"] + "/functions/v1/mnemos-store"
          key  = os.environ["SUPABASE_SERVICE_KEY"]
          ev   = os.environ.get("EVENT_NAME", "")
          act  = os.environ.get("EVENT_ACTION", "")

          text = None
          source_type = "github_event"
          tags = ["development"]
          metadata = {"event": ev, "action": act, "repo": "hurrisonferd/jarvis"}

          if ev == "issues":
            num   = os.environ.get("ISSUE_NUMBER", "?")
            title = os.environ.get("ISSUE_TITLE", "").strip()
            body  = (os.environ.get("ISSUE_BODY") or "").strip()[:300]
            if act == "opened":
              text = f"[ISSUE #{num} OPENED] {title}" + (f"\n{body}" if body else "")
              source_type = "github_issue"
              tags = ["development", "projects"]
            elif act == "closed":
              text = f"[ISSUE #{num} CLOSED] {title}"
              source_type = "github_issue"
              tags = ["development", "projects"]
            elif act == "labeled":
              label = os.environ.get("GITHUB_EVENT_LABEL_NAME", "")
              text = f"[ISSUE #{num} LABELED] {title}"
              source_type = "github_issue"
              tags = ["development"]
            elif act == "reopened":
              text = f"[ISSUE #{num} REOPENED] {title}"
              source_type = "github_issue"
              tags = ["development"]
            metadata["issue_number"] = num
            metadata["issue_title"] = title

          elif ev == "pull_request":
            num    = os.environ.get("PR_NUMBER", "?")
            title  = os.environ.get("PR_TITLE", "").strip()
            merged = os.environ.get("PR_MERGED", "false") == "true"
            body   = (os.environ.get("PR_BODY") or "").strip()[:200]
            if act == "opened":
              text = f"[PR #{num} OPENED] {title}" + (f"\n{body}" if body else "")
              source_type = "github_pr"
              tags = ["development"]
            elif act == "closed" and merged:
              text = f"[PR #{num} MERGED] {title}" + (f"\n{body}" if body else "")
              source_type = "github_pr"
              tags = ["development", "architecture"]
            elif act == "closed" and not merged:
              text = f"[PR #{num} CLOSED (not merged)] {title}"
              source_type = "github_pr"
              tags = ["development"]
            metadata["pr_number"] = num
            metadata["pr_title"] = title
            metadata["merged"] = merged

          elif ev == "push":
            sha    = os.environ.get("COMMIT_SHA", "")[:7]
            msg    = os.environ.get("COMMIT_MSG", "").strip().split("\n")[0][:120]
            author = os.environ.get("COMMIT_AUTHOR", "").strip()
            if msg and sha:
              text = f"[COMMIT {sha}] {msg} (by {author})"
              source_type = "github_commit"
              tags = ["development"]
            metadata["sha"] = sha
            metadata["author"] = author

          if not text:
            print(f"No memory to store for {ev}.{act}")
            exit(0)

          payload = json.dumps({
            "source_type": source_type,
            "text": text[:2000],
            "entropy": 0.04,
            "platform": "github_actions",
            "metadata": metadata,
            "tags": tags,
          }).encode()

          req = urllib.request.Request(url, data=payload, method="POST")
          req.add_header("Authorization", "Bearer " + key)
          req.add_header("Content-Type", "application/json")

          try:
            resp = urllib.request.urlopen(req)
            data = json.loads(resp.read())
            print(f"MNEMOS stored: {text[:80]}")
            print(f"  id={data.get('id')} tags={data.get('tags')}")
          except urllib.error.HTTPError as e:
            print(f"MNEMOS store failed {e.code}: {e.read().decode()}")
            exit(1)
          PYEOF
