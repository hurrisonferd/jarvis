name: MNEMOS GitHub Event Sync

# MNEMOS — records GitHub issues and PRs to mnemos/memories/events.jsonl.
# No Supabase required. Push events are handled by jarvis-pipeline.yml.

on:
  issues:
    types: [opened, closed, labeled, reopened]
  pull_request:
    types: [opened, closed]

jobs:
  sync:
    name: MNEMOS — Record Event
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write event to memory
        env:
          EVENT_NAME:   ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
          ISSUE_BODY:   ${{ github.event.issue.body }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          PR_TITLE:     ${{ github.event.pull_request.title }}
          PR_MERGED:    ${{ github.event.pull_request.merged }}
          PR_BODY:      ${{ github.event.pull_request.body }}
        run: |
          python3 << 'PYEOF'
          import json, os, pathlib
          from datetime import datetime, timezone

          ev  = os.environ.get("EVENT_NAME", "")
          act = os.environ.get("EVENT_ACTION", "")
          ts  = datetime.now(timezone.utc).isoformat()[:19] + "Z"

          text = None
          tags = ["development"]

          if ev == "issues":
              num   = os.environ.get("ISSUE_NUMBER", "?")
              title = os.environ.get("ISSUE_TITLE", "").strip()
              body  = (os.environ.get("ISSUE_BODY") or "").strip()[:200]
              text  = f"[ISSUE #{num} {act.upper()}] {title}"
              if body and act == "opened":
                  text += f"\n{body}"
              tags  = ["development", "projects"]

          elif ev == "pull_request":
              num    = os.environ.get("PR_NUMBER", "?")
              title  = os.environ.get("PR_TITLE", "").strip()
              merged = os.environ.get("PR_MERGED", "false") == "true"
              body   = (os.environ.get("PR_BODY") or "").strip()[:200]
              if act == "closed" and merged:
                  text = f"[PR #{num} MERGED] {title}"
              elif act == "closed":
                  text = f"[PR #{num} CLOSED] {title}"
              else:
                  text = f"[PR #{num} {act.upper()}] {title}"
              if body and act == "opened":
                  text += f"\n{body}"
              tags = ["development", "architecture" if merged else "development"]

          if not text:
              print(f"No event to record for {ev}.{act}")
              exit(0)

          entry = {
              "ts": ts, "event": ev, "action": act,
              "text": text[:500], "tags": tags,
              "source_type": f"github_{ev}",
          }

          path = pathlib.Path("mnemos/memories/events.jsonl")
          path.parent.mkdir(parents=True, exist_ok=True)

          existing = []
          if path.exists():
              for line in path.read_text().splitlines():
                  line = line.strip()
                  if line:
                      try:
                          existing.append(json.loads(line))
                      except Exception:
                          pass
          existing = existing[-99:]
          existing.append(entry)

          path.write_text("\n".join(json.dumps(e) for e in existing) + "\n")
          print(f"MNEMOS: {text[:80]}")
          PYEOF

      - name: Commit event log
        run: |
          git config user.name  "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add mnemos/memories/events.jsonl
          git diff --staged --quiet || git commit -m "chore(mnemos): github event [${{ github.event_name }}.${{ github.event.action }}] [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main) || echo "Push skipped"
