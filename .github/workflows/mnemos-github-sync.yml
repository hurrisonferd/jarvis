name: MNEMOS GitHub Event Sync

# Issue events may be written to the bounded Git memory log.
# Pull-request events are advisory only: they never commit or push to main, avoiding
# branch races, recursive workflow churn, and PR blockage from memory bookkeeping.

on:
  issues:
    types: [opened, closed, labeled, reopened]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: MNEMOS — Record Event
    runs-on: ubuntu-latest
    steps:
      - name: PR bookkeeping is non-blocking
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "PR #${{ github.event.pull_request.number }} ${{ github.event.action }}"
          echo "MNEMOS will not write or push Git memory from pull-request events."

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'issues' }}

      - name: Write issue event to memory
        if: ${{ github.event_name == 'issues' }}
        env:
          EVENT_NAME:   ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
          ISSUE_BODY:   ${{ github.event.issue.body }}
        run: |
          python3 << 'PYEOF'
          import os, sys
          from datetime import datetime, timezone

          act = os.environ.get("EVENT_ACTION", "")
          num = os.environ.get("ISSUE_NUMBER", "?")
          title = os.environ.get("ISSUE_TITLE", "").strip()
          body = (os.environ.get("ISSUE_BODY") or "").strip()[:200]
          ts = datetime.now(timezone.utc).isoformat()[:19] + "Z"

          text = f"[ISSUE #{num} {act.upper()}] {title}"
          if body and act == "opened":
              text += f"\n{body}"

          entry = {
              "ts": ts,
              "event": "issues",
              "action": act,
              "text": text[:500],
              "tags": ["development", "projects"],
              "source_type": "github_issues",
          }

          sys.path.insert(0, "scripts")
          from mnemos_log import append_bounded
          result = append_bounded(
              "memory/mnemos/memories/events.jsonl",
              entry,
              source="github_events",
              max_entries=200,
              max_bytes=65536,
          )
          print(f"MNEMOS: {text[:80]}")
          if result["rotated"]:
              print(f"rotated -> {result['archive']}")
          PYEOF

      - name: Commit issue event log
        if: ${{ github.event_name == 'issues' }}
        run: |
          git config user.name "ATOM"
          git config user.email "atom@grid.local"
          git add memory/mnemos/memories/events.jsonl
          [ -f memory/mnemos/memories/summaries.jsonl ] && git add memory/mnemos/memories/summaries.jsonl || true
          [ -d memory/mnemos/memories/archive ] && git add memory/mnemos/memories/archive || true
          git diff --staged --quiet || git commit -m "chore(mnemos): issue event [${{ github.event.action }}] [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main) || echo "Issue-memory push skipped"
