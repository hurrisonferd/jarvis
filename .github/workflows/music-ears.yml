name: "JARVIS — MusicOS Ears"

on:
  repository_dispatch:
    types: [music-ears]
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct HTTPS audio URL or public GitHub file URL"
        required: false
        type: string
      track_name:
        description: "Optional stable name for a URL-fed track"
        required: false
        type: string
      force:
        description: "Re-analyze repository tracks even when their hashes match"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: music-ears
  cancel-in-progress: false

jobs:
  ears:
    name: JARVIS — hear MusicOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v4

      - name: Checkout private MusicOS source
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        uses: actions/checkout@v4
        with:
          repository: hurrisonferd/Jarvis-Private
          token: ${{ secrets.JARVIS_PRIVATE_TOKEN }}
          path: private-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet librosa numpy soundfile audioread matplotlib

      - name: Hear repository library
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python3 operations/scripts/music_ears.py \
            --audio-dir private-source/MusicOS/songs/audio \
            --output-root JarvisSide/Media \
            --source-root private-source/MusicOS/songs \
            "${args[@]}"

      - name: Hear HTTPS source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url != '' }}
        env:
          EARS_SOURCE_URL: ${{ inputs.source_url }}
          EARS_TRACK_NAME: ${{ inputs.track_name }}
        run: |
          args=(--source-url "$EARS_SOURCE_URL" --output-root JarvisSide/Media)
          if [[ -n "$EARS_TRACK_NAME" ]]; then args+=(--track-name "$EARS_TRACK_NAME"); fi
          python3 operations/scripts/music_ears.py "${args[@]}"

      - name: Commit feature receipts
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add JarvisSide/Media/AUDIO-FEATURES.json \
                  JarvisSide/Media/MEDIA-MANIFEST.md \
                  JarvisSide/Media/spectrograms/
          if git diff --staged --quiet; then
            echo "no feature changes"
          else
            git commit -m "feat(ears): update durable audio feature receipts [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      - name: Mirror repository spectrograms
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        run: |
          cd private-source
          git config user.name "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add MusicOS/songs/spectrograms/
          if git diff --staged --quiet; then
            echo "no private spectrogram changes"
          else
            git commit -m "feat(ears): refresh MusicOS spectrograms [skip ci]"
            git push origin main
          fi
