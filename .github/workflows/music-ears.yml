name: "JARVIS — MusicOS Ears"

# MusicOS ears. Clones Jarvis-Private/MusicOS/songs/audio/, runs librosa on every track,
# writes spectrograms + AUDIO-FEATURES.json + MEDIA-MANIFEST.md to JarvisSide/Media/.
# Dispatches from Jarvis-Private on audio push, or manually via workflow_dispatch.
# The companion hears the bones; the soul is Raven's.
on:
  # Dispatches from Jarvis-Private when audio lands (see Jarvis-Private/.github/workflows/)
  repository_dispatch:
    types: [music-ears]
  # Manual backfill / re-analysis
  workflow_dispatch:
    inputs:
      audio_dir:
        description: "Override audio source (e.g. MusicOS/songs/audio/)"
        required: false
        default: ""
      force:
        description: "Re-analyze all tracks (ignore cache)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: music-ears
  cancel-in-progress: false

jobs:
  ears:
    name: JARVIS — hear MusicOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v4

      - name: Clone MusicOS audio
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/hurrisonferd/Jarvis-Private.git /tmp/Jarvis-Private
          AUDIO_DIR="/tmp/Jarvis-Private/MusicOS/songs/audio"
          if [ -n "${{ inputs.audio_dir }}" ]; then
            AUDIO_DIR="${{ inputs.audio_dir }}"
          fi
          echo "AUDIO_DIR=$AUDIO_DIR" >> $GITHUB_OUTPUT
          echo "TRACK_COUNT=$(ls "$AUDIO_DIR"/*.mp3 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet librosa numpy soundfile audioread matplotlib

      - name: Run ears
        env:
          JARVIS_PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          AUDIO_DIR=$(git -C /tmp/Jarvis-Private config --get remote.origin.url 2>/dev/null \
            && echo "/tmp/Jarvis-Private/MusicOS/songs/audio" \
            || echo "${{ inputs.audio_dir || '/tmp/Jarvis-Private/MusicOS/songs/audio' }}")

          # If workflow_dispatch with audio_dir override
          if [ -n "${{ inputs.audio_dir }}" ]; then
            python3 scripts/music_ears.py --audio-dir "${{ inputs.audio_dir }}"
          else
            python3 scripts/music_ears.py --audio-dir /tmp/Jarvis-Private/MusicOS/songs/audio
          fi

      - name: Report
        run: |
          echo "Spectrograms: $(ls JarvisSide/Media/spectrograms/*.png 2>/dev/null | wc -l)"
          echo "Tracks in features: $(python3 -c "import json; d=json.load(open('JarvisSide/Media/AUDIO-FEATURES.json')); print(len(d.get('tracks',{})))" 2>/dev/null || echo 0)"

      - name: Commit & push
        run: |
          git config user.name  "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add JarvisSide/Media/AUDIO-FEATURES.json \
                  JarvisSide/Media/MEDIA-MANIFEST.md \
                  JarvisSide/Media/spectrograms/
          if git diff --staged --quiet; then
            echo "no changes — all tracks cached"
          else
            git commit -m "feat(music_ears): MusicOS audio features + spectrograms [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
