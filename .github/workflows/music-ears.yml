name: "JARVIS — MusicOS Ears"

on:
  push:
    branches: [main]
    paths:
      - "operations/scripts/music_ears.py"
      - ".github/workflows/music-ears.yml"
  repository_dispatch:
    types: [music-ears]
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct HTTPS audio URL or public GitHub file URL"
        required: false
        type: string
      track_name:
        description: "Optional stable name for a URL-fed track"
        required: false
        type: string
      force:
        description: "Re-analyze repository tracks even when their hashes match"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: music-ears
  cancel-in-progress: false

jobs:
  ears:
    name: JARVIS — hear MusicOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GRID_GPT_TOKEN }}

      - name: Checkout private MusicOS source
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        uses: actions/checkout@v4
        with:
          repository: hurrisonferd/Jarvis-Private
          token: ${{ secrets.GRID_GPT_TOKEN }}
          path: private-source

      - name: Recover historical MusicOS audio
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        env:
          RECOVERY_COMMIT: 512c0de7b1865b47b0087de0806d064410290cc0
        run: |
          recovery_root=/tmp/music-ears-recovery
          recovered_audio="$recovery_root/JarvisSide/Media/audio"
          audio_dir=private-source/archive/workspaces/MusicOS/songs/audio
          mkdir -p "$recovery_root" "$audio_dir"
          git fetch --no-tags --depth=1 origin "$RECOVERY_COMMIT"
          git archive "$RECOVERY_COMMIT" JarvisSide/Media/audio | tar -x -C "$recovery_root"
          recovered=$(find "$recovered_audio" -maxdepth 1 -type f -name '*.mp3' | wc -l | tr -d ' ')
          test "$recovered" -eq 6
          cp "$recovered_audio"/*.mp3 "$audio_dir"/
          echo "recovered=$recovered"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet librosa numpy soundfile audioread matplotlib

      - name: Hear repository library
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python3 operations/scripts/music_ears.py \
            --audio-dir private-source/archive/workspaces/MusicOS/songs/audio \
            --output-root JarvisSide/Media \
            --source-root private-source/archive/workspaces/MusicOS/songs \
            "${args[@]}"

      - name: Hear HTTPS source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url != '' }}
        env:
          EARS_SOURCE_URL: ${{ inputs.source_url }}
          EARS_TRACK_NAME: ${{ inputs.track_name }}
        run: |
          args=(--source-url "$EARS_SOURCE_URL" --output-root JarvisSide/Media)
          if [[ -n "$EARS_TRACK_NAME" ]]; then args+=(--track-name "$EARS_TRACK_NAME"); fi
          python3 operations/scripts/music_ears.py "${args[@]}"

      - name: Propose feature receipts
        id: public_receipts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
        run: |
          git config user.name "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add JarvisSide/Media/AUDIO-FEATURES.json \
                  JarvisSide/Media/MEDIA-MANIFEST.md \
                  JarvisSide/Media/spectrograms/
          if git diff --staged --quiet; then
            echo "no feature changes"
            echo "relay=false" >> "$GITHUB_OUTPUT"
          else
            branch="automation/music-ears-public"
            git switch -c "$branch"
            git commit -m "feat(ears): update durable audio feature receipts [skip ci]"
            commit_sha=$(git rev-parse HEAD)
            echo "commit=$commit_sha" >> "$GITHUB_OUTPUT"
            if git push origin "$branch"; then
              echo "relay=false" >> "$GITHUB_OUTPUT"
              gh pr create \
                --repo hurrisonferd/jarvis \
                --base main \
                --head "$branch" \
                --title "feat(ears): publish MusicOS feature receipts" \
                --body "Generated by MusicOS Ears run ${GITHUB_RUN_ID}. Contains derived audio features and spectrograms only; source audio remains private." || true
            else
              echo "relay=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Propose recovered audio and spectrograms
        id: private_receipts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.source_url == '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
        run: |
          cd private-source
          git config user.name "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add archive/workspaces/MusicOS/songs/audio/ \
                  archive/workspaces/MusicOS/songs/spectrograms/
          if git diff --staged --quiet; then
            echo "no private audio or spectrogram changes"
            echo "relay=false" >> "$GITHUB_OUTPUT"
          else
            branch="automation/music-ears-private"
            git switch -c "$branch"
            git commit -m "feat(ears): restore MusicOS audio and spectrograms [skip ci]"
            commit_sha=$(git rev-parse HEAD)
            echo "commit=$commit_sha" >> "$GITHUB_OUTPUT"
            if git push origin "$branch"; then
              echo "relay=false" >> "$GITHUB_OUTPUT"
              gh pr create \
                --repo hurrisonferd/Jarvis-Private \
                --base main \
                --head "$branch" \
                --title "feat(ears): restore MusicOS audio and spectrograms" \
                --body "Generated by MusicOS Ears run ${GITHUB_RUN_ID}. Restores six historical audio blobs and their derived spectrograms into the canonical private MusicOS workspace." || true
            else
              echo "relay=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Record protected-ref relay
        if: ${{ always() && (steps.public_receipts.outputs.relay == 'true' || steps.private_receipts.outputs.relay == 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GRID_GPT_TOKEN }}
          PUBLIC_COMMIT: ${{ steps.public_receipts.outputs.commit }}
          PRIVATE_COMMIT: ${{ steps.private_receipts.outputs.commit }}
        run: |
          body=$(printf 'run: `%s`\npublic ref: `automation/music-ears-public`\npublic commit: `%s`\nprivate ref: `automation/music-ears-private`\nprivate commit: `%s`\ntransport: protected-ref connector relay' \
            "$GITHUB_RUN_ID" "$PUBLIC_COMMIT" "$PRIVATE_COMMIT")
          gh issue comment 348 --repo hurrisonferd/jarvis --body "$body"
