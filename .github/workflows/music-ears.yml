name: "JARVIS — MusicOS Ears"

# MusicOS ears. Dispatches from Jarvis-Private when audio lands; runs librosa analysis
# on MusicOS/songs/audio/, writes spectrograms + AUDIO-FEATURES.json + MEDIA-MANIFEST.md
# to this repo. The companion hears the bones; the soul is Raven's.
on:
  # Dispatches from Jarvis-Private when audio lands
  repository_dispatch:
    types: [music-ears]
  # Manual backfill / re-analysis
  workflow_dispatch:
    inputs:
      force:
        description: "Re-analyze all tracks (ignore cache)"
        required: false
        default: "false"
        type: boolean

# JARVIS_PRIVATE_TOKEN: GitHub PAT with repo scope. Stored as a repo secret.
# Required so this workflow (in JARVIS repo) can clone Jarvis-Private for audio source.
# Create at: https://github.com/settings/tokens  →  repo scope
permissions:
  contents: write

concurrency:
  group: music-ears
  cancel-in-progress: false

jobs:
  ears:
    name: JARVIS — hear MusicOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v4

      - name: Clone MusicOS audio from Jarvis-Private
        env:
          JARVIS_PRIVATE_TOKEN: ${{ secrets.JARVIS_PRIVATE_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${JARVIS_PRIVATE_TOKEN}@github.com/hurrisonferd/Jarvis-Private.git /tmp/Jarvis-Private
          echo "tracks=$(ls /tmp/Jarvis-Private/MusicOS/songs/audio/*.mp3 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet librosa numpy soundfile audioread matplotlib

      - name: Run ears
        run: |
          python3 scripts/music_ears.py --audio-dir /tmp/Jarvis-Private/MusicOS/songs/audio

      - name: Commit & push
        run: |
          git config user.name  "JARVIS"
          git config user.email "jarvis@jarvis.local"
          git add JarvisSide/Media/AUDIO-FEATURES.json \
                  JarvisSide/Media/MEDIA-MANIFEST.md \
                  JarvisSide/Media/spectrograms/
          if git diff --staged --quiet; then
            echo "no changes — all tracks cached"
          else
            git commit -m "feat(music_ears): MusicOS audio features + spectrograms [skip ci]"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi
