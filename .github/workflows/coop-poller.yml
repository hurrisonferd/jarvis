name: COOP-Poller

on:
  schedule:
    - cron: "* * * * *"   # every 1 minute (GitHub Actions minimum)
  workflow_dispatch:          # manual trigger

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run COOP-Poller
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GIT_TOKEN_PRIVATE: ${{ secrets.GIT_TOKEN_PRIVATE }}
        run: python3 operations/scripts/coop-poller.py
