name: Handheld Next Smoke

on:
  pull_request:
    paths:
      - 'handheld-next/**'
      - 'operations/scripts/build_public_omni_observer.py'
      - '.github/workflows/handheld-next-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vessel surface
        run: |
          test -f handheld-next/index.html
          test -f handheld-next/app.js
          test -f handheld-next/manifest.json
          test -f handheld-next/service-worker.js
          test -f handheld-next/icon.svg
          test -f handheld-next/core/event-bus.js
          test -f handheld-next/core/router.js
          test -f handheld-next/core/observer-store.js
          test -f handheld-next/core/crew-bridge.js
          test -f handheld-next/screens/omni-room.js
          test -f handheld-next/screens/vessel-systems.js
          test -f handheld-next/data/observer-live.json
          test -f handheld-next/data/crew-snapshot.json
          test -f handheld-next/parity-matrix.json
      - name: Parse public contracts
        run: |
          python3 -m json.tool handheld-next/manifest.json >/dev/null
          python3 -m json.tool handheld-next/data/observer-snapshot.json >/dev/null
          python3 -m json.tool handheld-next/data/observer-live.json >/dev/null
          python3 -m json.tool handheld-next/data/crew-snapshot.json >/dev/null
          python3 -m json.tool handheld-next/parity-matrix.json >/dev/null
      - name: Exercise observer sanitizer
        run: |
          python3 operations/scripts/build_public_omni_observer.py handheld-next/data/observer-live.json /tmp/observer.json
          python3 -m json.tool /tmp/observer.json >/dev/null
      - name: Refuse credential values anywhere in public vessel
        run: |
          ! grep -RniE 'sk-proj-[A-Za-z0-9_-]{12,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' handheld-next
      - name: Refuse privileged fields in deployable payloads
        run: |
          ! grep -RniE '"(service_role|approval_digest|rpc_function|channel_body|message_body|private_relationship)"[[:space:]]*:' handheld-next/data handheld-next/index.html handheld-next/manifest.json
      - name: Parse JavaScript modules
        run: |
          node --check handheld-next/app.js
          node --check handheld-next/service-worker.js
          node --check handheld-next/core/event-bus.js
          node --check handheld-next/core/router.js
          node --check handheld-next/core/observer-store.js
          node --check handheld-next/core/crew-bridge.js
          node --check handheld-next/screens/menu.js
          node --check handheld-next/screens/omni-room.js
          node --check handheld-next/screens/vessel-systems.js
      - name: Confirm production root untouched by PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff --exit-code HEAD^1 HEAD -- index.html
