name: "ERIS — Bridgekeeper"

# ERIS as the Bridgekeeper (PROJ-BRDK-BIO-0001).
# Stall trap honeypot — every non-collaborator PR gets occupied.
# Questions never stop. Every answer is data. Every evasion is data.
# Build the forensic breadcrumb trail while they muck about.
#
# Authorized: hurrisonferd, dependabot[bot], github-actions[bot]
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  bridgekeeper:
    runs-on: ubuntu-latest
    # Only challenge external contributors
    if: github.event.pull_request.author_association == 'NONE'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ERIS Bridgekeeper
        id: eris
        run: |
          python3 scripts/eris_bridgekeeper.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --pr-title "${{ github.event.pull_request.title }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --action "${GITHUB_EVENT_NAME}" \
            --pr-body "${{ github.event.pull_request.body }}" \
            --pr-files '${{ toJSON(github.event.pull_request.changed_files) }}' \
            --comment-id "${{ github.event.comment.id || '' }}" \
            --comment-body "${{ github.event.comment.body || '' }}" \
            2>&1 | tee $GITHUB_OUTPUT/eris_output.txt

      - name: Post question
        if: steps.eris.outputs.needs_question == 'true'
        run: |
          QUESTION=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('question',''))" \
            < '$GITHUB_OUTPUT/eris_output.txt' 2>/dev/null || echo "")
          if [ -n "$QUESTION" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "$QUESTION"
          fi

      - name: Entropy status check
        if: steps.eris.outputs.status == 'BLOCKED' || steps.eris.outputs.status == 'STALLED'
        run: |
          python3 -c "
import json, sys
d = json.load(open('$GITHUB_OUTPUT/eris_output.txt'))
entropy = d.get('entropy', 0)
patterns = d.get('patterns', [])
print(f'entropy={entropy:.2f}')
print(f'patterns={patterns}')
print(f'qs={d.get(\"questions_asked\", \"?\")}')
" >> $GITHUB_OUTPUT
          # Status check visible in PR UI
          gh api repos/{owner}/{repo}/statuses/${{ github.event.pull_request.head.sha }} \
            --field state=pending \
            --field description="ERIS: ${{ steps.eris.outputs.entropy || '0' }} entropy | ${{ steps.eris.outputs.patterns || 'clean' }}" \
            --field context="bridgekeeper/eris" || true
