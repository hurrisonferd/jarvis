name: yggdrasil-validate

# Enforce the JFS/JNL substrate: grammar + GL12 addressability + JMS mirror consistency.
# Fails the build if any governed object loses its address, location, tags, or index ref,
# or if the seed/registries drift from the entries on disk.

on:
  pull_request:
    paths:
      - 'core/JarvisMain/**'
      - 'JarvisSide/**'
      - '.github/workflows/yggdrasil-validate.yml'
  push:
    branches: [main]
    paths:
      - 'core/JarvisMain/**'
      - 'JarvisSide/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate substrate (grammar + GL12 + status + mirror)
        run: python core/JarvisMain/yggdrasil/tools/validate.py
      - name: Check status-managed files are sorted (JSS/autosort)
        run: python core/JarvisMain/yggdrasil/tools/autosort.py
      - name: Check registries are in sync with entries (no drift)
        run: |
          python core/JarvisMain/yggdrasil/tools/seed.py
          # status --porcelain catches UNTRACKED files too (git diff --quiet missed new JD
          # entries — that's how an entry once landed in the registry but not in git).
          # EXCLUDE lal/PINCH.md: it is a lens REPORT, not a registry — it bakes in wall-clock
          # time + mirror-vs-HEAD commit distance, so it can never be committed "clean" (committing
          # it moves HEAD). Gating on it made this step fail every run, which SKIPPED the mirror job
          # (needs: validate) and silently froze the Supabase mirror. The gate guards the
          # deterministic registries/entries; volatile reports are out of scope.
          DRIFT="$(git status --porcelain core/JarvisMain/yggdrasil/ | grep -v 'lal/PINCH.md' || true)"
          if [ -n "$DRIFT" ]; then
            echo "::error::LAL registries / JD entries are out of sync (incl. untracked). Run 'python core/JarvisMain/yggdrasil/tools/seed.py' and commit."
            echo "$DRIFT"
            exit 1
          fi
          echo "Registries in sync (PINCH.md report excluded — volatile by design)."

  # JMS: every change to canon refreshes the cloud mirror, so the dex READ tier
  # never serves stale truth. Skips cleanly when secrets are absent.
  mirror:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Mirror substrate to Supabase (JMS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python core/JarvisMain/yggdrasil/tools/sync_supabase.py --push
      - name: Re-seed JITM keel pins from the profiles (auto-update; self-gating, no churn)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python operations/scripts/jitm_seed.py
