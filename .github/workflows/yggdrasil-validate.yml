name: yggdrasil-validate

# Enforce the JFS/JNL substrate: grammar + GL12 addressability + JMS mirror consistency.
# Fails the build if any governed object loses its address, location, tags, or index ref,
# or if the seed/registries drift from the entries on disk.

on:
  pull_request:
    paths:
      - 'JarvisMain/**'
      - 'JarvisSide/**'
      - '.github/workflows/yggdrasil-validate.yml'
  push:
    branches: [main]
    paths:
      - 'JarvisMain/**'
      - 'JarvisSide/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate substrate (grammar + GL12 + status + mirror)
        run: python JarvisMain/yggdrasil/tools/validate.py
      - name: Check status-managed files are sorted (JSS/autosort)
        run: python JarvisMain/yggdrasil/tools/autosort.py
      - name: Check registries are in sync with entries (no drift)
        run: |
          python JarvisMain/yggdrasil/tools/seed.py
          if ! git diff --quiet JarvisMain/yggdrasil/; then
            echo "::error::LAL registries / JD entries are out of sync. Run 'python JarvisMain/yggdrasil/tools/seed.py' and commit."
            git --no-pager diff --stat JarvisMain/yggdrasil/
            exit 1
          fi
          echo "Registries in sync."
