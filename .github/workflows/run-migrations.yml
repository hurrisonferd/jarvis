name: Run Database Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'core/supabase/migrations/**'
      - '.github/workflows/run-migrations.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          echo "DATABASE_URL: ${DATABASE_URL:0:20}..."
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret not set"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          for f in core/supabase/migrations/*.sql; do
            NAME=$(basename "${f%.sql}")
            EXISTS=$(psql "$DATABASE_URL" -tAc "SELECT 1 FROM supabase_migrations.schema_migrations WHERE name='$NAME' LIMIT 1" 2>/dev/null)
            if [ "$EXISTS" = "1" ]; then
              echo "✓ $NAME already applied"
            else
              echo "→ applying $NAME"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO supabase_migrations.schema_migrations(name) VALUES ('$NAME') ON CONFLICT DO NOTHING;"
              echo "✓ $NAME applied"
            fi
          done
