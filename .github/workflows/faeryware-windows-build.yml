name: Faeryware Windows Build

on:
  push:
    branches: [main]
    paths:
      - "Faeryware-Windows/**"
      - ".github/workflows/faeryware-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Faeryware-Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install
      - name: Source canary
        run: python Tests/FAERYWARE-DESKTOP-NATIVE-CARRIER-CANARY.py
      - name: Build NSIS installer
        run: npm run windows:installer
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Faeryware-Windows-v0.5
          path: Faeryware-Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
