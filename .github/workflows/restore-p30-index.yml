name: restore-p30-index

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/restore-p30-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if already patched
        id: check
        run: |
          SIZE=$(wc -c < docs/index.html)
          if python3 -c "import sys; html=open('docs/index.html').read(); sys.exit(0 if 'WORLD_KERNEL' in html and len(html)>100000 else 1)"; then
            echo "patched=true" >> $GITHUB_OUTPUT
            echo "Already patched ($SIZE bytes) — skip"
          else
            echo "patched=false" >> $GITHUB_OUTPUT
            echo "Needs patch ($SIZE bytes)"
          fi

      - name: Restore full index.html from commit 8d30dc5
        if: steps.check.outputs.patched == 'false'
        run: |
          git checkout 8d30dc5 -- docs/index.html
          echo "Restored: $(wc -c < docs/index.html) bytes"

      - name: Apply P30 runtime patches
        if: steps.check.outputs.patched == 'false'
        run: |
          echo "" | base64 -d > /tmp/p30_patch.py
          python3 /tmp/p30_patch.py

      - name: Commit and push
        if: steps.check.outputs.patched == 'false'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/index.html
          git commit -m "fix(p30): restore full docs/index.html + P30 runtime [GL7-OK]"
          git push origin main
