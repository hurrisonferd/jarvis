name: MusicOS Public Scaffold Canary

on:
  push:
    branches: [main]
    paths:
      - 'runtime/MusicOSPortable/public/**'
      - '.github/workflows/musicos-public-scaffold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MusicOS public scaffold canaries
        run: python -m unittest runtime/MusicOSPortable/public/tests/test_public_scaffold.py
