name: RavenOS Public Handheld Canary

on:
  push:
    paths:
      - 'index.html'
      - 'ravenos-gameboy.html'
      - 'ravenos-gameboy-v4.js'
      - 'ravenos-pocket-cartridges.json'
      - 'ravenos-pocket-contract.js'
      - 'ravenos-pocket-native-provider.js'
      - 'ravenos-pocket-goblin.js'
      - 'ravenos-haunt.html'
      - 'ravenos-public-haunt.json'
      - 'ravenos-public-contract.js'
      - 'manifest.json'
      - 'scripts/ravenos_gameboy_canary.py'
      - 'scripts/ravenos_pocket_native_provider_canary.js'
      - 'scripts/ravenos_public_contract_canary.js'
      - '.github/workflows/ravenos-gameboy-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ravenos-public-handheld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict public packet, cartridges, native bridge and handheld contracts
        run: python scripts/ravenos_gameboy_canary.py
      - name: Check public packet validator syntax
        run: node --check ravenos-public-contract.js
      - name: Execute shared public validator canary
        run: node scripts/ravenos_public_contract_canary.js
      - name: Check Pocket cartridge validator syntax
        run: node --check ravenos-pocket-contract.js
      - name: Check Pocket native provider syntax
        run: node --check ravenos-pocket-native-provider.js
      - name: Execute Pocket native provider adversarial canary
        run: node scripts/ravenos_pocket_native_provider_canary.js
      - name: Check Pocket Goblin event throat syntax
        run: node --check ravenos-pocket-goblin.js
      - name: Check Pocket v4 runtime syntax
        run: node --check ravenos-gameboy-v4.js
      - name: Extract public haunt inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('ravenos-haunt.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'NO_INLINE_SCRIPT:ravenos-haunt.html'
          Path('/tmp/ravenos-haunt.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
      - name: Check public haunt inline JavaScript syntax
        run: node --check /tmp/ravenos-haunt.js
