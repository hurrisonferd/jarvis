name: JD Semantic Catalog

on:
  pull_request:
    paths:
      - "core/JarvisMain/yggdrasil/jd/**"
      - "core/JarvisMain/yggdrasil/lal/master-index.json"
      - "core/JarvisMain/**"
      - "runtime/**"
      - "docs/**"
      - "templates/**"
      - "Jorm/Vault/Canon/**"
      - ".github/workflows/jd-semantic-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  catalog:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile catalog builder
        run: python -m py_compile core/JarvisMain/yggdrasil/jd/tools/build_semantic_catalog.py

      - name: Materialize semantic catalog
        run: python core/JarvisMain/yggdrasil/jd/tools/build_semantic_catalog.py --write

      - name: Verify deterministic rebuild
        run: python core/JarvisMain/yggdrasil/jd/tools/build_semantic_catalog.py --check

      - name: Validate generated JSON
        run: |
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/JD-CATALOG.json >/dev/null
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/INDEXES.json >/dev/null
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/DISCOVERY-CANDIDATES.json >/dev/null
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/SEMANTIC-AUDIT.json >/dev/null
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/CATEGORY-REGISTRY.json >/dev/null
          python -m json.tool core/JarvisMain/yggdrasil/jd/catalog/RELATIONSHIP-ONTOLOGY.json >/dev/null

      - name: Upload semantic catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: jd-semantic-catalog-${{ github.sha }}
          path: |
            core/JarvisMain/yggdrasil/jd/catalog/JD-CATALOG.json
            core/JarvisMain/yggdrasil/jd/catalog/INDEXES.json
            core/JarvisMain/yggdrasil/jd/catalog/DISCOVERY-CANDIDATES.json
            core/JarvisMain/yggdrasil/jd/catalog/SEMANTIC-AUDIT.json
            core/JarvisMain/yggdrasil/jd/catalog/README.md
          if-no-files-found: error
          retention-days: 30
