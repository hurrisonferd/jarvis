<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5a623">
  <title>JARVIS Pocket Universe — Construction Dock</title>
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <main class="device" aria-label="JARVIS pocket universe handheld">
    <div class="led" id="field-led"></div>
    <section class="screen-housing">
      <div class="screen-label">JARVIS POCKET UNIVERSE · WORLD-001</div>
      <div class="screen"><div id="screen-inner"></div></div>
    </section>
    <div class="brand">JARVIS</div>
    <section class="controls" aria-label="handheld controls">
      <div class="dpad">
        <button data-command="up">▲</button>
        <button data-command="left">◀</button>
        <button data-command="right">▶</button>
        <button data-command="down">▼</button>
      </div>
      <div class="face">
        <button data-command="back" class="b">B</button>
        <button data-command="confirm" class="a">A</button>
      </div>
    </section>
    <section class="meta-controls">
      <button data-command="select">SELECT</button>
      <button data-command="start">START</button>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
