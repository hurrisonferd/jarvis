<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Phaser 4 Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; }
        #game { width: 100%; max-width: 640px; }
        #game canvas { width: 100% !important; height: auto !important; border: 2px solid #ff8800; border-radius: 4px; touch-action: none; }
        @media (hover: none) and (pointer: coarse) {
            body::after {
                content: '↑ Tap top to move up · ↓ Tap bottom to move down';
                position: fixed;
                bottom: 16px;
                left: 50%;
                transform: translateX(-50%);
                color: #ff8800;
                opacity: 0.7;
                font-size: 0.9rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game"></div>
    <script src="game.js"></script>
</body>
</html>
