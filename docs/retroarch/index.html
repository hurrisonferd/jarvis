<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RetroArch — JARVIS</title>
<!-- COI service worker: grants cross-origin isolation (SharedArrayBuffer) on GitHub Pages,
     which RetroArch's threaded WASM needs. First load registers + reloads once. -->
<script src="./coi-serviceworker.js"></script>
<style>
  :root{ --amber:#ffb000; --green:#00ff88; --blue:#39b6ff; --dim:#5a6b7a; --bright:#cfe7ff; --red:#ff4466; }
  html,body{ margin:0; height:100%; background:#05070a; color:var(--bright);
    font-family:"Courier New",monospace; }
  #boot{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:24px; text-align:center; }
  .badge{ letter-spacing:6px; color:var(--green); font-size:13px; }
  .sub{ color:var(--dim); font-size:12px; max-width:560px; line-height:1.7; }
  .ok{ color:var(--green); } .warn{ color:var(--amber); } .err{ color:var(--red); }
  .panel{ border:1px solid #1b2b3a; border-radius:8px; padding:18px 20px; max-width:620px;
    text-align:left; background:#070c12; box-shadow:0 0 30px rgba(0,255,136,.06); }
  .panel h2{ color:var(--amber); font-size:13px; letter-spacing:2px; margin:0 0 10px; }
  .panel code{ color:var(--green); }
  .panel ol{ font-size:12px; line-height:1.9; color:var(--bright); padding-left:18px; margin:8px 0; }
  .panel a{ color:var(--blue); }
  .spin{ display:inline-block; animation:p 1s steps(8) infinite; }
  @keyframes p{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="boot">
  <div class="badge">RETROARCH</div>
  <div id="msg" class="sub"><span class="spin">◓</span> initializing…</div>
</div>
<script>
(async function () {
  var msg = document.getElementById('msg');
  function show(html, cls) { msg.className = 'sub' + (cls ? ' ' + cls : ''); msg.innerHTML = html; }

  // 1) Wait for cross-origin isolation. The COI service worker reloads us once it's ready;
  //    until then crossOriginIsolated is false and we just announce the one-time reload.
  if (!self.crossOriginIsolated) {
    show('<span class="warn">activating security headers…</span><br>' +
         'the frame reloads itself once to enable the emulator. one moment.');
    return;
  }

  // 2) Cross-origin isolated. Check whether the RetroArch web bundle has been vendored.
  var present = false;
  try { var r = await fetch('./player/index.html', { method: 'HEAD', cache: 'no-store' }); present = r.ok; }
  catch (e) { present = false; }

  if (present) {
    // 3) Hand off to the official RetroArch web player (its own UI, cores, save states).
    //    ROMs load through RetroArch's file menu into IDBFS — they stay in this browser only.
    show('<span class="ok">isolated ✓ — launching RetroArch…</span>');
    location.replace('./player/index.html');
    return;
  }

  // 4) Not vendored yet — show the drop-in instructions. This is the only manual step.
  show(
    '<div class="panel">' +
      '<h2>RETROARCH NOT INSTALLED</h2>' +
      'Cross-origin isolation is active (<span class="ok">✓</span>), so the host is ready. ' +
      'The emulator binaries are held locally in the repo — drop them in once:' +
      '<ol>' +
        '<li>Download the <b>RetroArch web player</b> bundle from ' +
          '<a href="https://web.libretro.com/" target="_blank" rel="noopener">web.libretro.com</a> ' +
          '(or a core build from <a href="https://buildbot.libretro.com/web/" target="_blank" rel="noopener">buildbot.libretro.com/web</a>).</li>' +
        '<li>Place its contents in <code>docs/retroarch/player/</code> ' +
          '(so <code>docs/retroarch/player/index.html</code> exists).</li>' +
        '<li>Commit + push. GitHub Pages serves it; this launcher hands off automatically.</li>' +
      '</ol>' +
      'ROMs are never committed — RetroArch loads them through its own menu into the browser\'s ' +
      'local storage (IDBFS). See <code>docs/retroarch/MANIFEST.md</code> for the full checklist.' +
    '</div>'
  );
})();
</script>
</body>
</html>
