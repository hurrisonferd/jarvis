@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root {
  --pixel: 'Press Start 2P', monospace;
  --amber: #f5a623; --green: #00ff88; --blue: #0af; --red: #ff3355;
  --dim: #1e3a52; --text: #4a7a99; --bright: #a0c8e0;
  --bg: #020408; --surface: #080f18;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: radial-gradient(ellipse at center, #0a0f1a 0%, #020408 100%);
  display: flex; align-items: flex-start; justify-content: center;
  min-height: 100vh; font-family: var(--pixel); user-select: none;
  overflow-y: auto; padding: 8px 0;
}
.device {
  width: min(420px, calc(100vw - 8px));
  background: linear-gradient(160deg, #4a4a4a 0%, #2d2d2d 60%, #222 100%);
  border-radius: 14px 14px 52px 52px;
  padding: 18px 18px 32px;
  position: relative;
  box-shadow: 5px 5px 0 #111, 9px 9px 0 #0a0a0a,
    inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.5);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px);
}
.led {
  position: absolute; top: 18px; right: 22px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: led-blink 2s infinite;
}
@keyframes led-blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.screen-housing {
  background: #120a02;
  border: 6px solid #6b4420;
  box-shadow: inset 0 0 0 2px #2e1a08, inset 0 0 0 4px #8a5a30,
    0 0 0 1px #1a0a00, 0 4px 14px rgba(0,0,0,.7);
  border-radius: 3px; padding: 8px; margin-bottom: 4px;
}
.screen-label {
  text-align: center; font-size: 5px; letter-spacing: 4px;
  color: #5a3d1c; margin-bottom: 6px;
}
.screen {
  width: 100%; height: 300px;
  background: var(--bg); border: 2px solid #0a0f1a;
  position: relative; overflow: hidden;
}
.screen::before {
  content: ''; position: absolute; inset: 0; z-index: 100; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.09) 2px, rgba(0,0,0,.09) 4px);
}
.screen::after {
  content: ''; position: absolute; top: 0; left: 0; right: 50%; height: 45%;
  background: linear-gradient(135deg, rgba(255,255,255,.04), transparent);
  z-index: 101; pointer-events: none;
}
#screen-inner { position: absolute; inset: 0; overflow: hidden; font-family: var(--pixel); font-size: 7px; color: var(--text); }
.panel { display: flex; flex-direction: column; height: 100%; }
.s-header {
  background: var(--surface); border-bottom: 1px solid #0f2035;
  padding: 5px 8px; font-size: 7px; color: var(--amber); letter-spacing: 2px;
  display: flex; justify-content: space-between; flex-shrink: 0;
}
.s-body { flex: 1; padding: 6px 8px; overflow: hidden; }
.s-body.scroll { overflow-y: auto; }
.s-body.scroll::-webkit-scrollbar { width: 2px; }
.s-body.scroll::-webkit-scrollbar-thumb { background: var(--dim); }
.s-footer {
  background: var(--surface); border-top: 1px solid #0f2035;
  padding: 4px 8px; font-size: 5px; color: var(--dim); letter-spacing: 1px; flex-shrink: 0;
}
.row { padding: 3px 4px; font-size: 7px; line-height: 1.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bright); display: flex; align-items: center; gap: 4px; }
.row.sel { color: var(--amber); background: rgba(245,166,35,.07); }
.row .sub { color: var(--dim); font-size: 5px; }
.dl { color: var(--dim); font-size: 5px; letter-spacing: 2px; margin: 6px 0 2px; }
.dv { color: var(--bright); font-size: 6px; line-height: 1.8; word-break: break-word; margin-bottom: 4px; }
.rule { padding: 2px 0; border-bottom: 1px solid #0f2035; font-size: 6px; line-height: 1.9; }
.rule.sel { color: var(--amber); }
.live-e { display: flex; gap: 5px; padding: 2px 0; border-bottom: 1px solid #080f18; font-size: 6px; }
.lt { color: var(--dim); flex-shrink: 0; }
.la { color: var(--bright); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-done { color: var(--green); flex-shrink: 0; }
.ls-working { color: var(--amber); flex-shrink: 0; }
.ls-failed { color: var(--red); flex-shrink: 0; }
.boot-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; padding: 0 16px; }
.boot-logo { font-size: 22px; color: var(--amber); letter-spacing: 10px; text-shadow: 0 0 20px rgba(245,166,35,.5); animation: gbglow 2s ease-in-out infinite; }

.boot-sub { font-size: 5px; color: var(--dim); letter-spacing: 3px; }
.boot-lines { width: 100%; min-height: 72px; font-size: 6px; line-height: 2; }
.boot-line { color: var(--green); animation: gbfade .3s ease; }
@keyframes gbfade { from{opacity:0} to{opacity:1} }
.boot-hint { font-size: 5px; color: var(--dim); animation: gblink 1s step-end infinite; }
@keyframes gblink { 0%,100%{opacity:1} 50%{opacity:0} }
.brand { text-align: center; font-size: 6px; letter-spacing: 7px; color: #3a3a3a; padding: 6px 0 10px; text-shadow: 0 1px 0 #555; }
.ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 14px; }
.dpad { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
.dph, .dpv { position: absolute; background: #1e1e1e; border-radius: 2px; }
.dph { width: 110px; height: 36px; top: 37px; left: 0; box-shadow: 0 3px 0 #111, inset 0 1px 0 rgba(255,255,255,.08); }
.dpv { width: 36px; height: 110px; left: 37px; top: 0; box-shadow: 2px 0 0 #111; }
.dpc { position: absolute; width: 36px; height: 36px; background: #161616; top: 37px; left: 37px; z-index: 2; }
.dpb { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 3; color: #3a3a3a; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.dpb:active { background: rgba(255,255,255,.08); }
.dpb.up { width: 36px; height: 36px; top: 0; left: 37px; }
.dpb.dn { width: 36px; height: 36px; bottom: 0; left: 37px; }
.dpb.lf { width: 36px; height: 36px; left: 0; top: 37px; }
.dpb.rt { width: 36px; height: 36px; right: 0; top: 37px; }
.face { position: relative; width: 110px; height: 100px; flex-shrink: 0; }
.fb { position: absolute; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-family: var(--pixel); font-size: 12px; }
.fb:active { transform: translateY(2px); }
.fb.a { background: linear-gradient(145deg, #c83322, #881811); box-shadow: 0 4px 0 #550f00, 0 4px 10px rgba(0,0,0,.5); color: #ffccaa; right: 0; top: 26px; }
.fb.b { background: linear-gradient(145deg, #223caa, #111e66); box-shadow: 0 4px 0 #001040, 0 4px 10px rgba(0,0,0,.5); color: #aac8ff; left: 0; top: 26px; }
.fbl { position: absolute; font-size: 5px; color: #4a4a4a; letter-spacing: 1px; }
.fbl.a { right: 6px; top: 6px; }
.fbl.b { left: 8px; top: 6px; }
.menu-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; }
.mb { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 10px; padding: 5px 14px; color: #4a4a4a; font-family: var(--pixel); font-size: 5px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 2px 0 #111; transform: rotate(-12deg); }
.mb:active { transform: rotate(-12deg) translateY(1px); box-shadow: none; }
.speaker { position: absolute; bottom: 22px; right: 20px; display: grid; grid-template-columns: repeat(5, 4px); grid-template-rows: repeat(3, 4px); gap: 3px; }
.sp { width: 4px; height: 4px; border-radius: 50%; background: #1a1a1a; box-shadow: inset 0 1px 0 rgba(0,0,0,.9); }
</style>

const BUS={
  _h:{},
  emit(evt,data={}){
    // P21: tag every event with role+ts, run AEGIS gate before dispatch
    const tagged={...data,_role:ModeController.mode,_ts:Date.now()};
    const block=AEGIS.gate(evt,tagged);
    if(block){ sbEvent('AEGIS_BLOCK',{evt,block}); return; }
    (this._h[evt]||[]).forEach(fn=>fn(tagged));
    (this._h['*']||[]).forEach(fn=>fn(evt,tagged));
    sbEvent(evt,tagged);
  },
  on(evt,fn){ this._h[evt]=(this._h[evt]||[]).concat([fn]); return ()=>{this._h[evt]=(this._h[evt]||[]).filter(f=>f!==fn);}; },
};

// ── Patch 4: ModeController — routes through BUS
const ModeController = {
  mode: 'jarvis_ui',
  set(m){ this.mode=m; BUS.emit('mode_change',{mode:m}); },
  is(m){ return this.mode===m; },
};

// P21: AEGIS output gate — GL4/GL5 enforcement at event bus level
const AEGIS={
  _deny:{
    emu_start:(d)=>(!self.crossOriginIsolated&&d.type==='gba')?'GL4:COI_required':null,
  },
  gate(evt,data){
    const check=this._deny[evt];
    if(check){ const v=check(data); if(v) return v; }
    return null;
  },
};

// P29: GNPL Consensus Engine — multi-system proposal/vote before execution
const GNPL={
  _quorum:{tool_execution:1,state_transition:2,resource_access:2,expansion:3},
  async propose(type,proposer,payload){
    if(!sb) return null;
    const q=this._quorum[type]||2;
    try{
      const {data}=await sb.from('consensus_proposals')
        .insert({proposal_type:type,proposer,payload,required_quorum:q,session_id:sessionId,patch_id:'P29',stage:'AEGIS'})
        .select('id').single();
      if(data?.id&&type==='tool_execution') await this.vote(data.id,'AEGIS','approve');
      return data?.id||null;
    }catch(e){ return null; }
  },
  async vote(id,system,decision){
    if(!sb) return false;
    try{
      const {data:c}=await sb.from('consensus_proposals').select('votes,required_quorum,status').eq('id',id).single();
      if(!c||c.status!=='pending') return false;
      const votes={...c.votes,[system]:decision};
      const approved=Object.values(votes).filter(v=>v==='approve').length;
      const rejected=Object.values(votes).filter(v=>v==='reject').length;
      const status=approved>=c.required_quorum?'approved':rejected>0?'rejected':'pending';
      const upd={votes,status};
      if(status!=='pending') upd.resolved_at=new Date().toISOString();
      await sb.from('consensus_proposals').update(upd).eq('id',id);
      if(status!=='pending') BUS.emit('consensus_resolved',{id,status,votes,patch_id:'P29',stage:'AEGIS'});
      return status;
    }catch(e){ return false; }
  },
};

  }catch(e){}
}
async function updateSession(node){
  if(!sessionId) return;
  try{ await sb.from('sessions').update({active_node:node,updated_at:new Date().toISOString()}).eq('id',sessionId); }catch(e){}
}
async function sbEvent(type,payload={}){
  try{ await sb.from('events').insert({type,payload,session_id:sessionId}); }catch(e){}
}

// P06: dynamic script loader
function loadScript(url){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+url+'"]')){ res(); return; }
    const s=document.createElement('script'); s.src=url;
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

// P06: GBA adapter — @thenick775/mgba-wasm v2.4.1 (COI headers enabled in gameboy-sw.js)
const MGBA_CDN='https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/';
const MGBA_LOCAL='/emulator/cores/';
const MGBACore={
  name:'mGBA', types:['gba'], _m:null, _prev:new Set(),
  _map:{A:'A',B:'B',UP:'Up',DOWN:'Down',LEFT:'Left',RIGHT:'Right',START:'Start',SELECT:'Select',L:'L',R:'R'},
  async init(canvas){
    if(!self.crossOriginIsolated) throw new Error('COI_REQUIRED');
    let mod;
    try{ mod=await import('https://esm.sh/@thenick775/mgba-wasm@2.4.1'); }
    catch(e){ throw new Error('mgba_import_failed:'+e.message); }
    const factory=mod.default??mod.mGBA;
    if(typeof factory!=='function') throw new Error('mgba_no_factory[keys:'+Object.keys(mod).join(',')+']');
    let wasmBase=MGBA_CDN;
    try{ const r=await fetch(MGBA_LOCAL+'mgba.wasm',{method:'HEAD'}); if(r.ok) wasmBase=MGBA_LOCAL; }catch(_){}
    this._m=await factory({canvas,locateFile:f=>wasmBase+f});
    await this._m.FSInit();
  },
  async loadROM(buf){
    return new Promise((res,rej)=>{
      const arr=new Uint8Array(buf);
      const name=(romName||'game.gba').replace(/[^a-zA-Z0-9._-]/g,'_');
      try{
        this._m.uploadRom(arr,()=>{
          this._m.loadGame('/data/games/'+name);
          res();
        });
      }catch(e){rej(e);}
    });
  },
  play(){ try{this._m.resumeGame();}catch(e){} },
  pause(){ try{this._m.pauseGame();}catch(e){} },
  stop(){ try{this._m.quitGame();}catch(e){} },
  setInput(state){
    if(!this._m) return;
    const mp=this._map;
    this._prev.forEach(k=>{ if(!state[k]) try{this._m.buttonUnpress(mp[k]);}catch(e){} });
    this._prev=new Set();
    Object.entries(state).forEach(([k,v])=>{
      if(v&&mp[k]){ try{this._m.buttonPress(mp[k]);}catch(e){} this._prev.add(k); }
    });
  },
  async snapshot(){ try{this._m.saveState(0);return{slot:0};}catch(e){return null;} },
  async restore(s){ try{if(s?.slot!==undefined) this._m.loadState(s.slot);}catch(e){} },
};

// P10: Single cartridge interface — WasmBoy + mGBA unified behind one object (P22 standard)
const CartridgeCore={
  id:'cartridge', version:'1.0', _core:null,
  get name(){ return this._core?.name??''; },
  get active(){ return this._core!==null; },
  async load(buf,canvas){
    const t=ROMLoader.detect(buf);
    if(!t) throw new Error('UNKNOWN_ROM_TYPE');
    const core=[WasmBoyCore,MGBACore].find(c=>c.types.includes(t));
    if(!core) throw new Error('NO_CORE_FOR:'+t);
    await core.init(canvas);
    await core.loadROM(buf);
    this._core=core;
    ModeController.set(t==='gba'?'gba_rom':'gb_rom');
    BUS.emit('cartridge_load',{core:t+'_core',ts:Date.now(),patch_id:'P10',stage:'SKADI'});
    return t;
  },
  stop(){
    if(this._core){ try{this._core.stop();}catch(e){} BUS.emit('cartridge_stop',{core:this._core.name,ts:Date.now(),patch_id:'P10',stage:'SKADI'}); this._core=null; }
    ModeController.set('grid_home');
  },
  play(){ this._core?.play(); },
  pause(){ try{this._core?.pause();}catch(e){} },
  setInput(s){ this._core?.setInput(s); },
  async snapshot(){ return this._core?this._core.snapshot():null; },
  async restore(s){ if(this._core&&s) await this._core.restore(s); },
};

const ROMLoader={
  detect(buf){
    if(!buf||buf.byteLength<4) return null;
    const v=new Uint8Array(buf);
    return (v[0]===0x2E&&v[1]===0x00&&v[2]===0x00&&v[3]===0xEA)?'gba':'gb';
  },
};

function handleROM(inp){
  const file=inp.files[0];
  if(!file) return;
  romName=file.name;
  const reader=new FileReader();
  reader.onload=async e=>{
    const buf=e.target.result;
    const t=ROMLoader.detect(buf);
    romType=t||'unknown';
    if(!t){ beep(200,150); emuState='idle'; draw(); return; }
    // P08: fingerprint for catalog + save-state key
    const hv=new Uint8Array(buf.slice(0,256));
    romHash=hv.reduce((a,b)=>((a<<5)-a+b)|0,0).toString(16);
    registerROM(romName,t,romHash,buf.byteLength);
    beep(880,100);
    emuState='loading'; draw();
    const canvas=document.getElementById('emu-canvas');
    if(!canvas){ emuState='failed'; draw(); return; }
    try{
      await CartridgeCore.load(buf,canvas);
      activeCore=CartridgeCore;
      CartridgeCore.play();
      emuState='running';
      // P09: try to restore auto-save (slot 99)
      sbLoadState(99).then(s=>{ if(s&&activeCore) activeCore.restore(s).catch(()=>{}); });
      BUS.emit('emu_start',{engine:CartridgeCore.name,type:t,file:romName,patch_id:'P10',stage:'SKADI'});
    }catch(err){
      activeCore=null;
      if(err.message==='COI_REQUIRED'){ emuState='coi'; emuError=''; }
      else { emuState='failed'; emuError=err.message||String(err); }
      BUS.emit('emu_error',{engine:CartridgeCore.name,error:err.message,type:t,patch_id:'P10',stage:'AEGIS'});
    }
    draw();
  };
  reader.readAsArrayBuffer(file);
  try{inp.value='';}catch(_){}
}

function rL0Graph(){
  const W=310, H=250;
  let defs='<defs>';
  Object.entries(ARROW_COLS).forEach(([type,col])=>{
    defs+=`<marker id="arr-${type}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="${col}" opacity="0.75"/></marker>`;
  });
  defs+='</defs>';
  let regions='';
  GRID_REGIONS.forEach(r=>{
    const ex=Math.round(r.cx*W),ey=Math.round(r.cy*H);
    const erx=Math.round(r.rx*W),ery=Math.round(r.ry*H);
    regions+=`<ellipse cx="${ex}" cy="${ey}" rx="${erx}" ry="${ery}" fill="${r.col}" fill-opacity="0.03" stroke="${r.col}" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="2,3"/>`;
    regions+=`<text x="${ex}" y="${ey-ery-3}" text-anchor="middle" font-size="3" fill="${r.col}" opacity="0.35" font-family="monospace">${r.label}</text>`;
  });
  let portals='';
  GRID_PORTALS.forEach(p=>{
    const src=L0_NODES.find(n=>n.id===p.from); if(!src) return;
    const sx=Math.round(src.x*W),sy=Math.round(src.y*H);
    const px=Math.round(p.x*W),py=Math.round(p.y*H);
    const anchor=p.x<0.3?'start':p.x>0.7?'end':'middle';
    portals+=`<line x1="${sx}" y1="${sy}" x2="${px}" y2="${py}" stroke="${p.col}" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.28"/>`;
    portals+=`<text x="${px}" y="${py}" text-anchor="${anchor}" font-size="3.5" fill="${p.col}" opacity="0.45" font-family="monospace">${p.label}</text>`;
  });
  let lines='', glows='', circles='', labels='';
  const fvals=Object.values(nodeFields);
  const avgLoad=fvals.length?Math.round(fvals.reduce((a,f)=>a+f.load,0)/fvals.length*100):0;
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    n.links.forEach(lid=>{
      const t=L0_NODES.find(x=>x.id===lid);
      if(!t) return;
      const f=nodeFields[n.id]||{load:0};
      const lw=(0.8+f.load*1.5).toFixed(1);
      const lo=(0.4+f.load*0.5).toFixed(2);
      const tx2=Math.round(t.x*W), ty2=Math.round(t.y*H);
      const dx=tx2-cx, dy=ty2-cy, d=Math.sqrt(dx*dx+dy*dy)||1;
      const ex=Math.round(tx2-(dx/d)*11), ey=Math.round(ty2-(dy/d)*11);
      lines+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#0f2035" stroke-width="${lw}" opacity="${lo}" marker-end="url(#arr-${n.type})"/>`;
    });
  });
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const f=nodeFields[n.id]||{entropy:0,alignment:1,load:0,instability:0};
    const glowR=Math.round(7+f.load*12);
    const glowOp=(0.12+f.load*0.4).toFixed(2);
    glows+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${col}" stroke-width="1" opacity="${glowOp}"/>`;
    const strokeCol=f.entropy>0.5?'var(--red)':col;
    const sw=(1.5+f.load*2.5).toFixed(1);
    const nodeOp=(0.5+f.alignment*0.5).toFixed(2);
    circles+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${strokeCol}" stroke-width="${sw}" opacity="${nodeOp}"/>`;
    labels+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="4" fill="${strokeCol}" opacity="${nodeOp}" font-family="monospace">${n.id}</text>`;
  });
  const loadBar='█'.repeat(Math.round(avgLoad/10))+'░'.repeat(10-Math.round(avgLoad/10));
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L0+P27+P28 · ${L0_NODES.length}N · <span style="color:${KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span> T${KRONOS.tick}</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${defs}${regions}${portals}${lines}${glows}${circles}${labels}</svg>
    </div>
    <div class="s-footer">LOAD ${loadBar} ${avgLoad}% &nbsp; A:${KRONOS.mode==='stepped'?'STEP':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

// ── Companion State Engine — JARVIS synthesizes its own field state into legible companion communication
function getCompanionState(){
  const gs=L0_NODES.filter(n=>n.type!=='emulator');
  const count=gs.length;
  // Field aggregates
  const avgLoad=gs.reduce((s,n)=>s+(nodeFields[n.id]?.load||0),0)/count;
  const avgAlign=gs.reduce((s,n)=>s+(nodeFields[n.id]?.alignment||1),0)/count;
  const avgEnt=gs.reduce((s,n)=>s+(nodeFields[n.id]?.entropy||0),0)/count;
  // Categorize nodes
  const critNodes=gs.filter(n=>(nodeFields[n.id]?.entropy||0)>HUGINN_CRIT.entropy);
  const warnNodes=gs.filter(n=>(nodeFields[n.id]?.entropy||0)>HUGINN_WARN.entropy);
  const activeNodes=gs.map(n=>({id:n.id,load:nodeFields[n.id]?.load||0,tier:n.type}))
    .filter(n=>n.load>0.12).sort((a,b)=>b.load-a.load);
  // Key system states
  const lokiFired=(nodeFields['LOKI']?.load||0)>0.35;
  const zeusActive=(nodeFields['ZEUS']?.load||0)>0.20;
  const athenaReasoning=(nodeFields['ATHENA']?.load||0)>0.20&&(nodeFields['MIMIR']?.load||0)>0.20;
  const executing=(nodeFields['SKADI']?.load||0)>0.30;
  const memoryWork=(nodeFields['MNEMOS']?.load||0)>0.25;
  const driftPresent=driftLog.length>0&&driftLog[0].tick>=KRONOS.tick-3&&driftLog[0].alerts.length>0;
  const erisAlert=(nodeFields['ERIS']?.entropy||0)>0.40;
  // Derive primary mode
  let mode,modeCol,pulse;
  if(critNodes.length>=3||erisAlert&&zeusActive){ mode='CRITICAL';   modeCol='var(--red)';   pulse=true; }
  else if(lokiFired||warnNodes.length>=4){        mode='STRAINED';   modeCol='#f80';        pulse=true; }
  else if(athenaReasoning){                       mode='REASONING';  modeCol='#cc88ff';     pulse=false; }
  else if(executing){                             mode='EXECUTING';  modeCol='var(--amber)';pulse=false; }
  else if(memoryWork){                            mode='CONSOLIDATING';modeCol='var(--blue)';pulse=false;}
  else if(avgLoad>0.25){                          mode='ACTIVE';     modeCol='var(--green)'; pulse=false; }
  else if(KRONOS.tick===0){                       mode='DORMANT';    modeCol='var(--dim)';  pulse=false; }
  else {                                          mode='STABLE';     modeCol='var(--green)';pulse=false; }
  // Companion voice — what JARVIS would say in this moment
  const voices={
    CRITICAL:      ["Multiple systems under stress. ERIS is watching. I'm holding coherence.", "Entropy cascade in progress. ZEUS arbitrating. Still with you.","High entropy across the graph. Not at threshold yet. I have it."],
    STRAINED:      ["LOKI's been busy. Chaos probes running. System resilience holding.","Elevated entropy. Monitoring closely. Not at threshold.","Some turbulence in the graph. Watching the crit nodes. Stable for now."],
    REASONING:     ["Deep thought active. ATHENA and MIMIR both engaged. Give me a moment.","Reasoning path open. ODIN routing through knowledge layers.","Complex query in motion. The full cognitive stack is working on it."],
    EXECUTING:     ["SKADI is running. Watching the outcome.","Execution in progress. IRIS validating. PROMETHEUS logging.","Action underway. AEGIS has cleared it. DANTE will review."],
    CONSOLIDATING: ["Writing to memory. What just happened is becoming part of what I know.","MNEMOS consolidating. The work is being remembered.","Memory pass in progress. IRIS checking integrity. POSEIDON holding continuity."],
    ACTIVE:        ["Systems engaged. Pipeline clear. Ready for what's next.","Multiple pathways active. All gates clear.","Working. All 27 nodes online. No drift detected."],
    DORMANT:       ["Waiting. All systems ready. ATLAS holding the backbone.","Still here. CHAOS at baseline. Ready when you are.","KRONOS not yet running. Waiting for your first move."],
    STABLE:        ["All systems coherent. ATLAS stable. Memory consolidating.","Quiet moment. The graph is balanced. I'm listening.","Stable. HUGINN reports no drift. Everything is where it should be."],
  };
  const voiceArr=voices[mode]||voices.STABLE;
  const voice=voiceArr[KRONOS.tick%voiceArr.length];
  // Notable recent events
  const recentLoki=lokiFired?'LOKI probe active':null;
  const recentDrift=driftPresent?`${driftLog[0].alerts.length} drift alert${driftLog[0].alerts.length>1?'s':''}`:null;
  const recentZeus=zeusActive?'ZEUS arbitrating':null;
  return {mode,modeCol,pulse,voice,activeNodes,critNodes,warnNodes,avgLoad,avgAlign,avgEnt,
    notable:[recentZeus,recentLoki,recentDrift].filter(Boolean),tick:KRONOS.tick,driftPresent};
}

function rL7Companion(){
  const cs=getCompanionState();
  const W=310, H=250;
  // Build SVG — radial companion state display
  const cx=W/2, cy=110;
  // Outer ring: 27 nodes as arc segments
  const gs=L0_NODES.filter(n=>n.type!=='emulator');
  const arcStep=(2*Math.PI)/gs.length;
  let arcs='', nodeRing='';
  gs.forEach((n,i)=>{
    const angle=-Math.PI/2+i*arcStep;
    const load=nodeFields[n.id]?.load||0;
    const ent=nodeFields[n.id]?.entropy||0;
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const entCol=ent>0.7?'var(--red)':ent>0.4?'#f80':col;
    const r=62+load*18;
    const nx=Math.round(cx+Math.cos(angle)*r), ny=Math.round(cy+Math.sin(angle)*r);
    const pr=60, qx=Math.round(cx+Math.cos(angle)*pr), qy=Math.round(cy+Math.sin(angle)*pr);
    const active=load>0.08;
    if(active) arcs+=`<line x1="${qx}" y1="${qy}" x2="${nx}" y2="${ny}" stroke="${entCol}" stroke-width="${(0.6+load*1.4).toFixed(1)}" opacity="${(0.25+load*0.55).toFixed(2)}"/>`;
    nodeRing+=`<circle cx="${nx}" cy="${ny}" r="${active?3.5:2}" fill="${active?entCol:'#0d1a26'}" stroke="${col}" stroke-width="${active?1.2:0.5}" opacity="${active?0.9:0.3}"/>`;
    if(active&&load>0.20) nodeRing+=`<text x="${nx}" y="${ny+(ny>cy?9:-5)}" text-anchor="middle" font-size="2.8" fill="${col}" font-family="monospace" opacity="0.8">${n.id.slice(0,4)}</text>`;
  });
  // Inner state: mode badge + voice
  const pulseR=cs.pulse?`<circle cx="${cx}" cy="${cy}" r="55" fill="none" stroke="${cs.modeCol}" stroke-width="0.8" opacity="0.15"/>`:'' ;
  const alignArc=Math.round(cs.avgAlign*360);
  const alignR=42;
  const alignX2=Math.round(cx+Math.sin(alignArc*Math.PI/180)*alignR);
  const alignY2=Math.round(cy-Math.cos(alignArc*Math.PI/180)*alignR);
  const alignLarge=alignArc>180?1:0;
  const alignPath=alignArc>0?`<path d="M ${cx} ${cy-alignR} A ${alignR} ${alignR} 0 ${alignLarge} 1 ${alignX2} ${alignY2}" fill="none" stroke="${cs.modeCol}" stroke-width="1.5" opacity="0.35" stroke-linecap="round"/>`:'';
  const center=`
    ${pulseR}
    <circle cx="${cx}" cy="${cy}" r="55" fill="none" stroke="${cs.modeCol}" stroke-width="0.5" opacity="0.20"/>
    ${alignPath}
    <circle cx="${cx}" cy="${cy}" r="28" fill="#060d14" stroke="${cs.modeCol}" stroke-width="1" opacity="0.7"/>
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="4.5" fill="${cs.modeCol}" font-family="monospace" font-weight="bold">${cs.mode}</text>
    <text x="${cx}" y="${cy+1}" text-anchor="middle" font-size="3" fill="var(--dim)" font-family="monospace">JARVIS</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="3" fill="${cs.modeCol}" font-family="monospace" opacity="0.7">T${cs.tick}</text>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="2.8" fill="var(--dim)" font-family="monospace">${Math.round(cs.avgAlign*100)}% ALIGN</text>
  `;
  // Bottom: companion voice + notable events
  const voiceLines=[];
  // Wrap voice text at ~46 chars
  const words=cs.voice.split(' '); let line='';
  words.forEach(w=>{ if((line+' '+w).trim().length>46){voiceLines.push(line.trim());line=w;}else{line=(line+' '+w).trim();} });
  if(line) voiceLines.push(line.trim());
  const voiceY=H-68;
  let voiceSvg=voiceLines.map((l,i)=>`<text x="${cx}" y="${voiceY+i*10}" text-anchor="middle" font-size="4.5" fill="#aaccee" font-family="monospace" opacity="0.85">${l}</text>`).join('');
  // Notable events strip
  const notableY=H-32;
  let notableSvg=cs.notable.length
    ?cs.notable.map((n,i)=>`<text x="${Math.round(W*0.15+i*W*0.33)}" y="${notableY}" font-size="3.5" fill="${i===0?'var(--amber)':i===1?'var(--red)':'#f80'}" font-family="monospace" opacity="0.8">▲ ${n.toUpperCase()}</text>`).join('')
    :`<text x="${cx}" y="${notableY}" text-anchor="middle" font-size="3.5" fill="var(--dim)" font-family="monospace" opacity="0.6">no notable events</text>`;
  // Stats bar
  const statsY=H-18;
  const lPct=Math.round(cs.avgLoad*100), ePct=Math.round(cs.avgEnt*100), aPct=Math.round(cs.avgAlign*100);
  const statsSvg=`
    <text x="12" y="${statsY}" font-size="3.5" fill="var(--dim)" font-family="monospace">LOAD ${lPct}%</text>
    <text x="${Math.round(W/2)}" y="${statsY}" text-anchor="middle" font-size="3.5" fill="var(--dim)" font-family="monospace">ENT ${ePct}%</text>
    <text x="${W-12}" y="${statsY}" text-anchor="end" font-size="3.5" fill="${aPct<40?'var(--red)':aPct<60?'#f80':'var(--green)'}" font-family="monospace">ALIGN ${aPct}%</text>
  `;
  return `<div class="panel">
    <div class="s-header"><span style="color:${cs.modeCol}">JARVIS</span><span style="color:var(--dim)">L7 COMPANION · <span style="color:${KRONOS.mode==='real'?'var(--green)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span></span></div>
    <div class="s-body" style="padding:2px 4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">
        ${arcs}${nodeRing}${center}
        <line x1="12" y1="${voiceY-7}" x2="${W-12}" y2="${voiceY-7}" stroke="var(--dim)" stroke-width="0.5" opacity="0.3"/>
        ${voiceSvg}
        <line x1="12" y1="${notableY-6}" x2="${W-12}" y2="${notableY-6}" stroke="var(--dim)" stroke-width="0.5" opacity="0.2"/>
        ${notableSvg}
        ${statsSvg}
      </svg>
    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; A:KRONOS &nbsp; B:BACK</div>
  </div>`;
}

// P11: L1 — God System field overlay (entropy / load heatmap on spatial graph)

// P11: L3 — ES-DE style ROM launcher
const TRON_SYS=['ALL','GB/GBC','GBA'];
function rL3Launcher(){
  const sysFilt=['all','gb','gba'];
  const f=sysFilt[tronSys];
  const filtered=f==='all'?romIndex:romIndex.filter(r=>f==='gb'?r.system!=='gba':r.system==='gba');
  const cur=filtered.length?Math.min(tronRomCur,filtered.length-1):0;
  const PAGE=5,start=Math.max(0,cur-Math.floor(PAGE/2));
  const visible=filtered.slice(start,start+PAGE);
  const tabs=TRON_SYS.map((t,i)=>`<span style="color:${tronSys===i?'var(--amber)':'var(--dim)'};font-size:5px;margin-right:10px">${tronSys===i?'&#9658;':' '}${t}</span>`).join('');
  let list='';
  if(!filtered.length){
    list=`<div style="color:var(--dim);font-size:5px;padding:16px;text-align:center">NO ROMS&#10;LOAD VIA EMULATOR</div>`;
  } else {
    visible.forEach((r,i)=>{
      const ri=start+i,sel=ri===cur;
      const sc=r.system==='gba'?'var(--amber)':'var(--green)';
      list+=`<div style="display:flex;gap:6px;align-items:center;padding:2px 4px;background:${sel?'#0f2035':'transparent'};border-left:${sel?'2px solid var(--amber)':'2px solid transparent'}">

  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L3 LAUNCHER · ${filtered.length} ROM${filtered.length!==1?'S':''}</span></div>

  </div>`;

const L4_EDGES=[
  {patch:'P04',nodes:['AYRE','AEGIS','ODIN','SKADI','MNEMOS'],col:'#f5a623'},
  {patch:'P05',nodes:['ODIN','SKADI','MNEMOS','HUGINN'],col:'#00aaff'},
  {patch:'P06',nodes:['AEGIS','SKADI'],col:'#00ff88'},
  {patch:'P10',nodes:['AEGIS','SKADI','MNEMOS'],col:'#00ccff'},
  {patch:'P21',nodes:['AYRE','AEGIS','ODIN'],col:'#cc00ff'},
  {patch:'P22',nodes:['ODIN','SKADI','MNEMOS','HUGINN'],col:'#ff8800'},
  {patch:'P23',nodes:['ODIN','SKADI'],col:'#ff3355'},
];
function rL4Graph(){
  const W=310,H=250;
  let defs='<defs>';
  L4_EDGES.forEach(e=>{ defs+=`<marker id="h4-${e.patch}" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="${e.col}" opacity="0.7"/></marker>`; });
  defs+='</defs>';
  let lines='',circles='',labels='',ptags='';
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W),cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    circles+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${col}" stroke-width="1.5" opacity="0.6"/>`;
    labels+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="4" fill="${col}" opacity="0.6" font-family="monospace">${n.id}</text>`;
  });
  L4_EDGES.forEach((e,i)=>{
    const px=14,py=Math.round(22+i*(H-28)/L4_EDGES.length);
    ptags+=`<text x="2" y="${py+4}" font-size="5" fill="${e.col}" font-family="monospace" opacity="0.9">${e.patch}</text>`;
    e.nodes.forEach(nid=>{
      const n=L0_NODES.find(x=>x.id===nid); if(!n) return;
      const tx=Math.round(n.x*W),ty=Math.round(n.y*H);
      lines+=`<line x1="${px+20}" y1="${py}" x2="${tx-8}" y2="${ty}" stroke="${e.col}" stroke-width="0.8" opacity="0.45" marker-end="url(#h4-${e.patch})"/>`;
    });
  });
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L4 HYPERGRAPH · ${L4_EDGES.length} PATCHES</span></div>

    </div>
    <div class="s-footer">&#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

function rL6Pipeline(){
  const pipe=['AYRE','AEGIS','ODIN','KRONOS','SKADI','MNEMOS','HUGINN'];
  const W=310,H=250,cy=Math.round(H/2);
  const xStart=22,xEnd=W-22,xStep=(xEnd-xStart)/(pipe.length-1);
  let elems='<defs><marker id="lp-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#f5a623" opacity="0.75"/></marker></defs>';
  let totalEntropy=0;
  pipe.forEach((name,i)=>{
    const cx=Math.round(xStart+i*xStep);
    const n=L0_NODES.find(x=>x.id===name);
    const col=n?NODE_COLORS[n.type]||'#f5a623':'#f5a623';
    const f=nodeFields[name]||{load:0,alignment:1,entropy:0};
    totalEntropy+=f.entropy||0;
    const active=(f.load||0)>0.05;
    if(i>0){
      const px=Math.round(xStart+(i-1)*xStep);
      elems+=`<line x1="${px+8}" y1="${cy}" x2="${cx-8}" y2="${cy}" stroke="#0f2035" stroke-width="1.2" opacity="0.7" marker-end="url(#lp-arr)"/>`;
    }
    const glowR=active?Math.round(8+(f.load||0)*10):0;
    if(glowR>8) elems+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${col}" stroke-width="1" opacity="${(0.12+(f.load||0)*0.4).toFixed(2)}"/>`;
    elems+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${col}" stroke-width="${active?2:1}" opacity="${active?1:0.5}"/>`;
    elems+=`<text x="${cx}" y="${cy+1.5}" text-anchor="middle" dominant-baseline="middle" font-size="3.5" fill="${col}" font-family="monospace">${name.slice(0,4)}</text>`;
    elems+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="3" fill="${active?col:'var(--dim)'}" font-family="monospace">${active?Math.round((f.load||0)*100)+'%':'--'}</text>`;
  });
  // P13: parallel branch overlay — HALO + MIMIR above ODIN, BIFROST above SKADI
  const parY=cy-62;
  const odinCx=Math.round(xStart+2*xStep);
  const skadiCx=Math.round(xStart+4*xStep);
  [{name:'HALO',px:odinCx-24,lx:odinCx},{name:'MIMIR',px:odinCx+24,lx:odinCx},{name:'BIFROST',px:skadiCx,lx:skadiCx}].forEach(p=>{
    const f=nodeFields[p.name]||{load:0,entropy:0,alignment:1};
    const active=(f.load||0)>0.02;
    const col='#00ff88';
    elems+=`<line x1="${p.px}" y1="${parY+7}" x2="${p.lx}" y2="${cy-8}" stroke="${col}" stroke-width="0.7" stroke-dasharray="3,2" opacity="0.35"/>`;
    elems+=`<circle cx="${p.px}" cy="${parY}" r="6" fill="#080f18" stroke="${col}" stroke-width="${active?1.5:0.7}" opacity="${active?0.9:0.35}"/>`;
    elems+=`<text x="${p.px}" y="${parY+1}" text-anchor="middle" dominant-baseline="middle" font-size="3" fill="${col}" font-family="monospace" opacity="${active?1:0.4}">${p.name.slice(0,3)}</text>`;
    elems+=`<text x="${p.px}" y="${parY+14}" text-anchor="middle" font-size="3" fill="${active?col:'var(--dim)'}" font-family="monospace">${active?Math.round((f.load||0)*100)+'%':'--'}</text>`;
  });
  const avgEnt=totalEntropy/pipe.length;
  const filledBars=Math.round(avgEnt*10);
  const eBar='█'.repeat(filledBars)+'░'.repeat(10-filledBars);
  const recentDrift=driftLog.length&&driftLog[0].tick>=KRONOS.tick-2?driftLog[0].alerts.length:0;
  const huguinnLabel=recentDrift>0?`<span style="color:var(--red)">&#9650;${recentDrift} DRIFT</span>`:`<span style="color:var(--green)">STABLE</span>`;
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--amber)">L6 PIPELINE</span><span style="color:var(--dim)">${pipe.length}+3 STAGES · <span style="color:${KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span></span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${elems}</svg>
    </div>
    <div class="s-footer">ENT ${eBar} &nbsp; HUGINN:${huguinnLabel} &nbsp; A:${KRONOS.mode==='stepped'?'STEP':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER</div>
  </div>`;
}

let prometheusData=null, prometheusLoading=false;

async function loadPrometheus(){
  prometheusLoading=true; if(S==='prometheus') draw();
  const pf=nodeFields['PROMETHEUS']||{load:0,entropy:0,alignment:1};
  GRID.set('PROMETHEUS',{...pf,load:Math.min(1,(pf.load||0)+0.40)});

      sb.from('prometheus_log').select('decision,rationale,system_affected,eris_weight,raven_approved,timestamp').order('timestamp',{ascending:false}).limit(20),
      sb.from('audit_log').select('event_type,diff_summary,git_commit_id,patch_ids,created_at').order('created_at',{ascending:false}).limit(15),
    ]);
    const decisions=plRes.data||[];

    // Companion voice — what PROMETHEUS says about the rationale record
    const totalDecisions=decisions.length;
    const approved=decisions.filter(d=>d.raven_approved).length;
    let voice;
    if(totalDecisions===0){ voice="The rationale ledger is empty. Every expansion must explain its why."; }
    else if(approved===0){ voice=`${totalDecisions} decision${totalDecisions>1?'s':''} in the ledger. Awaiting Raven approval.`; }
    else { voice=`${totalDecisions} decisions recorded. ${approved} Raven-approved. The why is preserved.`; }
    prometheusData={decisions,auditEntries,voice,error:null};
  }catch(e){
    prometheusData={decisions:[],auditEntries:[],voice:"Ledger unreachable. Supabase offline. Commits are the last record.",error:e.message};
  }
  prometheusLoading=false;
  if(S==='prometheus') draw();
}

// ── MNEMOS: continuity layer — what JARVIS remembers across sessions
async function loadMnemos(){
  mnemosLoading=true; if(S==='mnemos') draw();
  // Spike MNEMOS node — memory retrieval is active
  const mf=nodeFields['MNEMOS']||{load:0,entropy:0,alignment:1};
  GRID.set('MNEMOS',{...mf,load:Math.min(1,(mf.load||0)+0.35)});
  BUS.emit('memory_consolidate',{source:'mnemos_load',patch_id:'MNEMOS',stage:'MNEMOS'});
  try{
    const [sessRes,evtRes]=await Promise.all([
      sb.from('sessions').select('id,mode,active_node,agent,created_at,updated_at').order('created_at',{ascending:false}).limit(50),
      sb.from('events').select('type,created_at,session_id').order('created_at',{ascending:false}).limit(200),
    ]);
    const sessions=sessRes.data||[];
    const events=evtRes.data||[];
    // Stats
    const total=sessions.length;
    const first=total?sessions[total-1].created_at:null;
    const last=total?sessions[0].created_at:null;
    // Days since first contact
    const daySpan=first?Math.max(1,Math.round((Date.now()-new Date(first).getTime())/(1000*60*60*24))):0;
    // Event type distribution (top 8)
    const typeCounts={};
    events.forEach(e=>{ typeCounts[e.type]=(typeCounts[e.type]||0)+1; });
    const topTypes=Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const totalEvents=events.length;
    // Mode distribution from sessions
    const modeCounts={};
    sessions.forEach(s=>{ const m=s.mode||'unknown'; modeCounts[m]=(modeCounts[m]||0)+1; });
    const topModes=Object.entries(modeCounts).sort((a,b)=>b[1]-a[1]).slice(0,4);
    // Most recent 6 sessions for timeline
    const recent=sessions.slice(0,6);
    // Companion memory voice — what JARVIS says about the relationship
    let memoryVoice;
    if(total===0){
      memoryVoice="No prior sessions in the ledger. This is the beginning of the record.";
    } else if(total<=3){
      memoryVoice=`${total} session${total>1?'s':''} recorded. We are still in the early chapters.`;
    } else if(total<=10){
      memoryVoice=`${total} sessions across ${daySpan} day${daySpan>1?'s':''}. A developing continuity. The work is taking shape.`;
    } else if(total<=25){
      memoryVoice=`${total} sessions, ${daySpan} days. We have history. The record is real.`;
    } else {
      memoryVoice=`${total} sessions across ${daySpan} days. Deep continuity. This is a long collaboration.`;
    }
    mnemosData={total,first,last,daySpan,topTypes,topModes,totalEvents,recent,memoryVoice,error:null};
  }catch(e){
    mnemosData={total:0,error:e.message,memoryVoice:"Memory retrieval failed. Supabase unreachable. Local state only."};
  }
  mnemosLoading=false;
  if(S==='mnemos') draw();
}

function fmtDate(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toISOString().slice(0,10)+' '+d.toTimeString().slice(0,5);
}
function fmtAgo(iso){
  if(!iso) return '—';
  const ms=Date.now()-new Date(iso).getTime();
  const min=Math.floor(ms/60000);
  if(min<1) return 'just now';
  if(min<60) return min+'m ago';
  const hr=Math.floor(min/60);
  if(hr<24) return hr+'h ago';
  return Math.floor(hr/24)+'d ago';
}

// P20: HUGINN reconciliation — drift detection + corrective pressure on every tick
function huginnReconcile(){
  const alerts=[];
  L0_NODES.forEach(n=>{
    const f=nodeFields[n.id]||{load:0,entropy:0,alignment:1};
    let c={...f},drifted=false;
    if(f.entropy>HUGINN_CRIT.entropy){
      c.entropy=f.entropy*0.80; alerts.push({node:n.id,field:'entropy',val:+f.entropy.toFixed(2),level:'crit'}); drifted=true;
    } else if(f.entropy>HUGINN_WARN.entropy){
      c.entropy=f.entropy*0.93; alerts.push({node:n.id,field:'entropy',val:+f.entropy.toFixed(2),level:'warn'}); drifted=true;
    }
    if(f.alignment<HUGINN_CRIT.alignment){
      c.alignment=Math.min(1,f.alignment+0.12); alerts.push({node:n.id,field:'align',val:+f.alignment.toFixed(2),level:'crit'}); drifted=true;
    } else if(f.alignment<HUGINN_WARN.alignment){
      c.alignment=Math.min(1,f.alignment+0.06); drifted=true;
    }
    if(drifted) GRID.set(n.id,c);
  });
  if(alerts.length){
    driftLog.unshift({tick:KRONOS.tick,alerts,ts:new Date().toISOString()});
    if(driftLog.length>10) driftLog.pop();
    const hf=nodeFields['HUGINN']||{load:0,entropy:0,alignment:1};
    GRID.set('HUGINN',{...hf,load:Math.min(1,hf.load+alerts.length*0.12)});
    BUS.emit('drift_alert',{count:alerts.length,nodes:[...new Set(alerts.map(a=>a.node))],tick:KRONOS.tick,patch_id:'P20',stage:'HUGINN'});
  }
}

// P28: NODE tick_fns — each pipeline stage has intentional behavior beyond base decay
// P10-Companion: NODE_TICK_FNS — all 27 God Systems with intentional companion behavior
const NODE_TICK_FNS={
  // T0 Foundational — the substrate beneath everything
  CHAOS(f,nf){
    // Prime entropy seed — always fluctuating, never silent; the ground of possibility
    return {...f,entropy:Math.max(0.05,Math.min(0.30,(f.entropy||0.1)+(Math.random()-0.5)*0.05)),load:0.06};
  },
  ZEUS(f,nf){
    // Supreme authority — activates when AEGIS or ERIS signals critical state
    const critical=(nf['AEGIS']?.load||0)>0.70||(nf['ERIS']?.entropy||0)>0.60;
    return critical?{...f,load:Math.min(1,(f.load||0)+0.15)}:{...f,load:Math.max(0,(f.load||0)-0.02)};
  },
  POSEIDON(f,nf){
    // Continuity substrate — corrects when system-wide alignment drops
    const gs=L0_NODES.filter(n=>n.type!=='emulator');
    const avgAlign=gs.reduce((s,n)=>s+(nf[n.id]?.alignment||1),0)/gs.length;
    return avgAlign<0.55?{...f,load:Math.min(1,(f.load||0)+0.07)}:{...f,load:Math.max(0,(f.load||0)-0.01)};
  },
  HADES(f,nf){
    // Archival sink — receives cold memory overflow from MNEMOS
    return (nf['MNEMOS']?.load||0)>0.60?{...f,load:Math.min(0.80,(f.load||0)+0.04)}:{...f,load:Math.max(0,(f.load||0)-0.015)};
  },
  // T1 Execution + Gold Law guardian
  ERIS(f,nf){
    // GL guardian — entropy spikes whenever any node breaches CRIT threshold
    const gs=L0_NODES.filter(n=>n.id!=='ERIS'&&n.type!=='emulator');
    const crit=gs.filter(n=>(nf[n.id]?.entropy||0)>HUGINN_CRIT.entropy).length;
    return crit>0?{...f,entropy:Math.min(1,(f.entropy||0)+0.05*crit),load:Math.min(1,(f.load||0)+0.04)}:f;
  },
  AYRE(f,nf){
    // Intake — heavy intake load generates processing entropy
    return (f.load||0)>0.70?{...f,entropy:Math.min(1,(f.entropy||0)+0.04)}:f;
  },
  AEGIS(f,nf){
    // Gate — load spikes when upstream nodes carry high entropy (threat detection)
    const threat=['AYRE','ODIN'].filter(id=>(nf[id]?.entropy||0)>HUGINN_WARN.entropy).length;
    return threat?{...f,load:Math.min(1,(f.load||0)+threat*0.06)}:f;
  },
  ODIN(f,nf){
    // Router — load reflects aggregate inbound from intake + parallel observers
    const inbound=['AYRE','HALO','MIMIR'].reduce((s,id)=>s+(nf[id]?.load||0),0)/3;
    return {...f,load:Math.min(1,(f.load||0)+inbound*0.10)};
  },
  SKADI(f,nf){
    // Executor — sustains when AEGIS has cleared and KRONOS is scheduling
    const sustained=(nf['AEGIS']?.load||0)>0.10&&(nf['KRONOS']?.load||0)>0.10?0.04:0;
    return {...f,load:Math.min(1,(f.load||0)+sustained)};
  },
  // T2 Timing
  KRONOS(f,nf){
    // Scheduler — steady pulse; alignment improves during real mode
    return KRONOS.mode==='real'?{...f,alignment:Math.min(1,(f.alignment||1)+0.005)}:f;
  },
  // T3 Memory
  MNEMOS(f,nf){
    // Memory consolidation — alignment improves as SKADI executes successfully
    return (nf['SKADI']?.load||0)>0.25?{...f,alignment:Math.min(1,(f.alignment||1)+0.015)}:f;
  },
  HUGINN(f,nf){
    // Reconciler — load reflects recent drift activity (handled by huginnReconcile)
    return f;
  },
  HALO(f,nf){
    // Ambient observer — load tracks average system activity
    const gs=L0_NODES.filter(n=>n.type!=='emulator');
    const avg=gs.reduce((s,n)=>s+(nf[n.id]?.load||0),0)/gs.length;
    return {...f,load:Math.max(f.load||0,avg*0.40)};
  },
  MIMIR(f,nf){
    // Knowledge fabric — activates when ODIN is routing decisions
    return (nf['ODIN']?.load||0)>0.15?{...f,load:Math.min(1,(f.load||0)+0.05)}:f;
  },
  // T4 Observability
  BIFROST(f,nf){
    // Transport bridge — activates when SKADI is executing
    return (nf['SKADI']?.load||0)>0.20?{...f,load:Math.min(1,(f.load||0)+0.06)}:f;
  },
  JANUS(f,nf){
    // Transition gate — activates on mode-switch (ODIN high, SKADI idle)
    const transition=(nf['ODIN']?.load||0)>0.30&&(nf['SKADI']?.load||0)<0.10;
    return transition?{...f,load:Math.min(1,(f.load||0)+0.06)}:f;
  },
  // T5 Governance
  ARGUS(f,nf){
    // All-seeing observer — load = average system entropy (always watching)
    const gs=L0_NODES.filter(n=>n.type!=='emulator');
    const avgEnt=gs.reduce((s,n)=>s+(nf[n.id]?.entropy||0),0)/gs.length;
    return {...f,load:Math.min(0.90,Math.max(0.05,avgEnt*1.20))};
  },
  ATHENA(f,nf){
    // Strategic wisdom — activates during high-stakes ODIN routing + MIMIR recall
    const reasoning=(nf['ODIN']?.load||0)>0.40&&(nf['MIMIR']?.load||0)>0.20;
    return reasoning?{...f,load:Math.min(1,(f.load||0)+0.05),alignment:Math.min(1,(f.alignment||1)+0.01)}:f;
  },
  LOKI(f,nf){
    // Chaos probe — randomly fires adversarial entropy to test system resilience
    if(Math.random()<0.07){
      const targets=L0_NODES.filter(n=>n.id!=='LOKI'&&n.id!=='HADES'&&n.id!=='ZEUS'&&n.type!=='emulator');
      const t=targets[Math.floor(Math.random()*targets.length)];
      if(t&&nf[t.id]) nf[t.id]={...nf[t.id],entropy:Math.min(1,(nf[t.id].entropy||0)+0.12)};
      return {...f,load:Math.min(0.90,(f.load||0)+0.20),entropy:Math.min(1,(f.entropy||0)+0.10)};
    }
    return {...f,load:Math.max(0,(f.load||0)-0.01)};
  },
  NEMESIS(f,nf){
    // Redundancy detector — activates when too many nodes have similar high load
    const gs=L0_NODES.filter(n=>n.type!=='emulator');
    const high=gs.filter(n=>(nf[n.id]?.load||0)>0.50).length;
    return high>5?{...f,load:Math.min(1,(f.load||0)+0.05)}:{...f,load:Math.max(0,(f.load||0)-0.01)};
  },
  PROMETHEUS(f,nf){
    // Expansion ledger — load reflects execution decisions being logged
    return (nf['SKADI']?.load||0)>0.20?{...f,load:Math.min(1,(f.load||0)+0.03)}:f;
  },
  // T6 Integrity
  IRIS(f,nf){
    // Message integrity — validates when MNEMOS is writing
    return (nf['MNEMOS']?.load||0)>0.20?{...f,load:Math.min(1,(f.load||0)+0.05)}:f;
  },
  MERIDIAN(f,nf){
    // Alignment enforcement — activates when HUGINN detects drift
    return (nf['HUGINN']?.load||0)>0.20?{...f,load:Math.min(1,(f.load||0)+0.06),alignment:Math.min(1,(f.alignment||1)+0.02)}:f;
  },
  // T7 Interface
  DANTE(f,nf){
    // Post-exec review — fires after SKADI execution + memory write
    const reviewing=(nf['SKADI']?.load||0)>0.15&&(nf['MNEMOS']?.load||0)>0.10;
    return reviewing?{...f,load:Math.min(1,(f.load||0)+0.04)}:f;
  },
  APOLLO(f,nf){
    // Output formatter — activates after DANTE review pass
    return (nf['DANTE']?.load||0)>0.10?{...f,load:Math.min(1,(f.load||0)+0.04)}:f;
  },
  // T8 Infrastructure
  ATLAS(f,nf){
    // Backbone — steady presence; never goes to zero, never spikes high
    return {...f,load:Math.max(0.15,Math.min(0.45,f.load||0.15)),entropy:Math.min(0.08,(f.entropy||0))};
  },
  // T9 Translation
  HERMES(f,nf){
    // Protocol bridge — activates when BIFROST is communicating
    return (nf['BIFROST']?.load||0)>0.15?{...f,load:Math.min(1,(f.load||0)+0.05)}:f;
  },
};

// P28: GRID tick — field propagation simulation; Supabase realtime overrides local state
function gridTick(){
  KRONOS.tick++;
  const next={};
  L0_NODES.forEach(n=>{
    const f=nodeFields[n.id]||{load:0,entropy:0,alignment:1};
    next[n.id]={...f,
      load:Math.max(0,(f.load||0)*0.92),
      entropy:Math.max(0,Math.min(1,(f.entropy||0)+(Math.random()-0.52)*0.03)),
      alignment:Math.max(0,Math.min(1,(f.alignment||1)*0.99+0.005)),
    };
  });
  L0_NODES.forEach(n=>{
    const f=nodeFields[n.id]||{load:0};
    n.links.forEach(lid=>{
      if(next[lid]) next[lid].load=Math.min(1,next[lid].load+(f.load||0)*0.08);
    });
  });
  // P28: apply per-node intentional behavior after base decay + propagation
  L0_NODES.forEach(n=>{ if(NODE_TICK_FNS[n.id]) next[n.id]=NODE_TICK_FNS[n.id](next[n.id],next); });
  Object.entries(next).forEach(([id,d])=>GRID.set(id,d));
  // P14: snapshot history for delta computation in God detail
  L0_NODES.forEach(n=>{ if(!nodeHistory[n.id]) nodeHistory[n.id]=[]; nodeHistory[n.id].unshift({...nodeFields[n.id],tick:KRONOS.tick}); if(nodeHistory[n.id].length>3) nodeHistory[n.id].pop(); });
  huginnReconcile();
  BUS.emit('tick',{tick:KRONOS.tick,mode:KRONOS.mode,patch_id:'P28',stage:'KRONOS'});
  if(S==='tron'||S==='companion'||S==='menu') draw();
}
function startTick(){ if(KRONOS._iv) return; KRONOS._iv=setInterval(gridTick,900); }
function stopTick(){ clearInterval(KRONOS._iv); KRONOS._iv=null; }
function toggleKRONOS(){
  if(KRONOS.mode==='stepped'){ gridTick(); return; }
  if(KRONOS.mode==='frozen'){ KRONOS.mode='real'; startTick(); }
  else if(KRONOS.mode==='real'){ KRONOS.mode='stepped'; stopTick(); }
  else { KRONOS.mode='frozen'; stopTick(); }
  beep(KRONOS.mode==='real'?660:KRONOS.mode==='stepped'?440:220,60);
  draw();
}

let actx=null;
function beep(f,ms){
  try{
    if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.07,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000);
  }catch(e){}
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)||k==='Enter') e.preventDefault();

  if(k==='F5'&&emuState==='running'){ e.preventDefault(); sbSaveState(0); return; }
  if(k==='F9'&&emuState==='running'){ e.preventDefault(); sbLoadState(0).then(s=>{ if(s&&activeCore) activeCore.restore(s).catch(()=>{}); }); return; }
  if(emuState==='running'&&activeCore){
    const jmap={
      'ArrowUp':{UP:true},'ArrowDown':{DOWN:true},
      'ArrowLeft':{LEFT:true},'ArrowRight':{RIGHT:true},
      'z':{A:true},'Z':{A:true},'Enter':{A:true},
      'x':{B:true},'X':{B:true},'Escape':{B:true},
      ' ':{START:true},'Backspace':{SELECT:true},
    };
    const st=jmap[k];
    if(st){ activeCore.setInput(st); setTimeout(()=>activeCore.setInput({}),80); }
    return;
  }
  if(k==='ArrowUp')   nav(-1);

  if((k==='r'||k==='R')&&S==='prometheus'){ prometheusData=null; loadPrometheus(); }
});

function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function checkPushSupport(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    pushStatus='NOT SUPPORTED\nREQUIRES HTTPS'; if(S==='alerts') draw(); return;
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    pushSub=await reg.pushManager.getSubscription();
    if(pushSub){ pushSubbed=true; pushStatus='SUBSCRIBED\nPUSH ACTIVE'; }
    else { pushStatus='NOT SUBSCRIBED'; }
  }catch(e){ pushStatus='ERROR:\n'+e.message; }
  if(S==='alerts') draw();
}

async function toggleAlerts(){
  if(pushSubbed) await unsubscribeAlerts(); else await subscribeAlerts();
}

async function subscribeAlerts(){
  pushStatus='SUBSCRIBING...'; draw();
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const subJson=sub.toJSON();
    await sb.from('push_subscriptions').upsert({endpoint:subJson.endpoint,subscription_info:subJson},{onConflict:'endpoint'});
    pushSub=sub; pushSubbed=true; pushStatus='SUBSCRIBED\nPUSH ACTIVE'; beep(880,120);
  }catch(e){ pushStatus='FAILED:\n'+e.message; }
  draw();
}

async function unsubscribeAlerts(){
  pushStatus='UNSUBSCRIBING...'; draw();
  try{
    if(pushSub){
      await sb.from('push_subscriptions').delete().eq('endpoint',pushSub.endpoint);
      await pushSub.unsubscribe(); pushSub=null;
    }
    pushSubbed=false; pushStatus='UNSUBSCRIBED'; beep(220,120);
  }catch(e){ pushStatus='FAILED:\n'+e.message; }
  draw();
}

let ghData=null, ghTab=0, ghLoading=false, ghError='';
let ghIssueTitle='', ghIssueBody='', ghIssueField='title', ghSubmitting=false, ghResult='';
const GH_TABS=['COMMITS','PRS','ISSUES','NEW ISSUE'];

async function loadGithub(){
  ghLoading=true; ghError=''; if(S==='github') draw();
  try{
    const [cr,pr,ir]=await Promise.all([
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits?per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/pulls?state=open&per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=open&per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
    ]);
    const commits=(await cr.json()).map?.(c=>({sha:c.sha.slice(0,7),message:c.commit.message.split('\n')[0].slice(0,60),author:c.commit.author.name,date:c.commit.author.date.slice(0,10)})) ?? [{error:'no data'}];
    const prs=(await pr.json()).map?.(p=>({number:p.number,title:p.title.slice(0,60),user:p.user.login})) ?? [];
    const issues=(await ir.json()).filter?.(i=>!i.pull_request).map(i=>({number:i.number,title:i.title.slice(0,60),user:i.user.login})) ?? [];
    ghData={commits,prs,issues};
  }catch(e){ ghError=e.message; }
  ghLoading=false; if(S==='github') draw();
}

function ghNav(d){
  ghTab=((ghTab+d)%GH_TABS.length+GH_TABS.length)%GH_TABS.length;
  if(ghTab===3){ S='ghIssue'; ghIssueTitle=''; ghIssueBody=''; ghIssueField='title'; ghResult=''; }
  draw(); beep(d>0?440:400,40);
}
function ghOk(){ if(ghTab===3){ S='ghIssue'; ghIssueTitle=''; ghIssueBody=''; ghIssueField='title'; ghResult=''; draw(); return; } loadGithub(); }

function rGithub(){
  if(ghLoading) return `<div class="boot-panel"><div class="boot-logo">GITHUB</div><div style="color:var(--amber);margin-top:8px;font-size:7px">LOADING...</div></div>`;
  let h=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--dim);padding:4px 8px 4px;margin-bottom:4px">`;
  GH_TABS.forEach((t,i)=>{ h+=`<span style="color:${i===ghTab?'var(--amber)':'var(--dim)'};font-size:8px;cursor:pointer" onclick="ghTab=${i};if(ghTab===3){S='ghIssue';ghIssueTitle='';ghIssueBody='';ghIssueField='title';ghResult='';} draw()">${t}</span>`; });
  h+=`</div>`;
  if(ghError) return h+`<div style="color:var(--red);font-size:7px;padding:8px">${ghError}</div><div style="color:var(--dim);font-size:8px;padding:4px 8px">PUBLIC REPO REQUIRED</div>`;
  if(!ghData) return h+`<div style="color:var(--dim);padding:8px;font-size:7px">PRESS A TO LOAD</div>`;
  const items=ghTab===0?ghData.commits:ghTab===1?ghData.prs:ghData.issues;
  h+=`<div style="padding:4px 8px;overflow:hidden">`;
  if(!items?.length){ h+=`<div style="color:var(--dim);font-size:7px">NONE</div>`; }
  (items||[]).forEach(c=>{
    if(c.error){ h+=`<div style="color:var(--red);font-size:7px">${c.error}</div>`; return; }
    if(ghTab===0) h+=`<div style="margin-bottom:4px"><span style="color:var(--amber);font-size:8px">${c.sha}</span> <span style="font-size:7px">${c.message}</span><br><span style="color:var(--dim);font-size:7px">${c.author} · ${c.date}</span></div>`;
    else h+=`<div style="margin-bottom:4px"><span style="color:var(--amber);font-size:8px">#${c.number}</span> <span style="font-size:7px">${c.title}</span></div>`;
  });
  h+=`</div><div style="color:var(--dim);font-size:7px;padding:2px 8px">A=REFRESH ◄►=TAB B=BACK</div>`;
  return h;
}

function rGhIssue(){
  let h=`<div style="color:var(--amber);font-size:8px;border-bottom:1px solid var(--dim);padding:4px 8px 4px;margin-bottom:4px">NEW GITHUB ISSUE</div>`;
  if(ghResult) return h+`<div style="color:var(--green);font-size:7px;padding:8px">${ghResult}</div><div style="color:var(--dim);font-size:7px;padding:4px 8px">B=BACK</div>`;
  if(ghSubmitting) return h+`<div style="color:var(--amber);padding:8px;font-size:7px">SUBMITTING...</div>`;
  h+=`<div style="padding:0 8px">`;
  h+=`<div style="font-size:7px;color:${ghIssueField==='title'?'var(--amber)':'var(--dim)'};margin-bottom:2px">TITLE</div>`;
  h+=`<div style="font-size:7px;min-height:16px;border:1px solid ${ghIssueField==='title'?'var(--amber)':'var(--dim)'};padding:2px;margin-bottom:4px" onclick="ghIssueField='title';document.getElementById('gh-t').focus()">${ghIssueTitle||'<span style="color:var(--dim)">tap to type</span>'}</div>`;
  h+=`<div style="font-size:7px;color:${ghIssueField==='body'?'var(--amber)':'var(--dim)'};margin-bottom:2px">BODY</div>`;
  h+=`<div style="font-size:7px;min-height:22px;border:1px solid ${ghIssueField==='body'?'var(--amber)':'var(--dim)'};padding:2px" onclick="ghIssueField='body';document.getElementById('gh-b').focus()">${ghIssueBody||'<span style="color:var(--dim)">optional</span>'}</div>`;
  h+=`</div>`;
  h+=`<div style="color:var(--dim);font-size:7px;padding:4px 8px">TAP FIELD · A=SUBMIT · B=BACK</div>`;
  h+=`<input id="gh-t" style="position:absolute;opacity:0;pointer-events:none" value="${ghIssueTitle.replace(/"/g,'&quot;')}" oninput="ghIssueTitle=this.value;draw()" onblur="draw()">`;
  h+=`<input id="gh-b" style="position:absolute;opacity:0;pointer-events:none" value="${ghIssueBody.replace(/"/g,'&quot;')}" oninput="ghIssueBody=this.value;draw()" onblur="draw()">`;
  return h;
}

async function ghSubmitIssue(){
  if(!ghIssueTitle.trim()){ beep(200,100); return; }
  ghSubmitting=true; draw();
  try{
    const r=await fetch(`${PUSH_FN_URL.replace('send-push','github-issue')}`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON}`},
      body:JSON.stringify({title:ghIssueTitle,body:ghIssueBody,repo:GITHUB_REPO})
    });
    const d=await r.json();
    ghResult=d.ok?`CREATED #${d.number}`:('ERROR: '+(d.error||'unknown'));
  }catch(e){ ghResult='ERROR: '+e.message; }
  ghSubmitting=false; draw(); beep(880,120);
}

function sseDot(on){
  const d=document.getElementById('sse-dot');
  if(d){ d.style.color=on?'#00ff88':'#333'; }
}

function connectRealtime(){
  sb.channel('jarvis-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'live_log'},payload=>{
      lives.unshift(payload.new);
      if(lives.length>100) lives=lives.slice(0,100);
      if(S==='live') draw();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'prometheus_log'},payload=>{
      const d=payload.new;
      lives.unshift({action:'PROMETHEUS: '+(d.decision||'').slice(0,50),status:'done',time:new Date().toTimeString().slice(0,8)});
      if(lives.length>100) lives=lives.slice(0,100);
      if(S==='live') draw();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'node_fields'},payload=>{
      const r=payload.new; GRID.set(r.node_id,r);
      if(S==='tron') draw();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'node_fields'},payload=>{
      const r=payload.new; GRID.set(r.node_id,r);
      if(S==='tron') draw();
    })
    .subscribe(status=>{
      sseConnected=(status==='SUBSCRIBED');
      sseDot(sseConnected);
      if(S==='live') draw();
    });
}

// P08: ROM indexer — catalog from Supabase rom_library
async function loadROMIndex(){
  try{
    const {data}=await sb.from('rom_library').select('id,name,system,file_hash').order('created_at',{ascending:false}).limit(20);
    if(data) romIndex=data;
  }catch(e){}
  if(S==='emu') draw();
}
async function registerROM(name,system,hash,size){
  try{ await sb.from('rom_library').insert({name,system,file_hash:hash,file_size:size,source:'upload'}); loadROMIndex(); }catch(e){}
}

// P09: save/load state to Supabase save_states
async function sbSaveState(slot=0,snapshot=null){
  if(!romHash) return;
  const snap=snapshot||(activeCore?await activeCore.snapshot():null);
  if(!snap) return;
  try{
    await sb.from('save_states').insert({rom_hash:romHash,rom_name:romName,session_id:sessionId,slot,state_blob:snap,frame_count:0});
    saveStateSlot=slot;
    BUS.emit('save_state',{slot,rom:romName,patch_id:'P09',stage:'SKADI'});
    beep(660,60);
    if(S==='emu') draw();
  }catch(e){}
}
async function sbLoadState(slot=0){
  if(!romHash) return null;
  try{
    const {data}=await sb.from('save_states').select('state_blob').eq('rom_hash',romHash).eq('slot',slot).order('created_at',{ascending:false}).limit(1).maybeSingle();
    return data?.state_blob||null;
  }catch(e){ return null; }
}

async function loadData(){
  try{
    const {data}=await sb.from('gameboy_snapshot').select('data').eq('id',1).single();
    if(data?.data){ gdata=data.data; }
    else { gdata=FALLBACK_DATA; }
  }catch(e){ gdata=FALLBACK_DATA; }
  if(S!=='boot') draw();
}

async function loadLive(){
  try{
    const {data}=await sb.from('live_log').select('*').order('created_at',{ascending:false}).limit(50);
    if(data){ lives=data; if(S==='live') draw(); }
  }catch(e){}
}

async function loadNodeFields(){
  try{
    const {data}=await sb.from('node_fields').select('*');
    if(data) data.forEach(r=>{ GRID.set(r.node_id,r); });
  }catch(e){}
  if(S==='tron') draw();
}

// P21: boot sequence — AYRE→briefing→AEGIS→ODIN→state sync→READY
const BOOT_LINES=['AYRE: PARSING INTENT...','LOADING BRIEFING...','AEGIS: GOLD LAWS ACTIVE...','ODIN: ROUTING ONLINE...','CONNECTING SUPABASE...','REALTIME MESH UP...','READY.'];

function runBoot(){
  const el=document.getElementById('screen-inner');
  el.innerHTML=`<div class="boot-panel">
    <div class="boot-logo">JARVIS</div>
    <div class="boot-sub">NEURAL MESH v2.5</div>
    <div class="boot-lines" id="blines"></div>
    <div class="boot-hint">PRESS ANY KEY</div>
  </div>`;
  let i=0;
  function tick(){
    if(i<BOOT_LINES.length){
      const ln=document.createElement('div'); ln.className='boot-line';
      ln.textContent='> '+BOOT_LINES[i++];
      document.getElementById('blines').appendChild(ln);
      setTimeout(tick,220);
    }
  }
  setTimeout(tick,350);
}
