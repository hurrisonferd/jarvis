<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root {
  --pixel: 'Press Start 2P', monospace;
  --amber: #f5a623; --green: #00ff88; --blue: #0af; --red: #ff3355;
  --dim: #1e3a52; --text: #4a7a99; --bright: #a0c8e0;
  --bg: #020408; --surface: #080f18;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: radial-gradient(ellipse at center, #0a0f1a 0%, #020408 100%);
  display: flex; align-items: flex-start; justify-content: center;
  min-height: 100vh; font-family: var(--pixel); user-select: none;
  overflow-y: auto; padding: 8px 0;
}
.device {
  width: min(420px, calc(100vw - 8px));
  background: linear-gradient(160deg, #4a4a4a 0%, #2d2d2d 60%, #222 100%);
  border-radius: 14px 14px 52px 52px;
  padding: 18px 18px 32px;
  position: relative;
  box-shadow: 5px 5px 0 #111, 9px 9px 0 #0a0a0a,
    inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.5);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 4px);
}
.led {
  position: absolute; top: 18px; right: 22px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 8px var(--green);
  animation: led-blink 2s infinite;
}
@keyframes led-blink { 0%,100%{opacity:1} 50%{opacity:.3} }
.screen-housing {
  background: #120a02;
  border: 6px solid #6b4420;
  box-shadow: inset 0 0 0 2px #2e1a08, inset 0 0 0 4px #8a5a30,
    0 0 0 1px #1a0a00, 0 4px 14px rgba(0,0,0,.7);
  border-radius: 3px; padding: 8px; margin-bottom: 4px;
}
.screen-label {
  text-align: center; font-size: 5px; letter-spacing: 4px;
  color: #5a3d1c; margin-bottom: 6px;
}
.screen {
  width: 100%; height: 300px;
  background: var(--bg); border: 2px solid #0a0f1a;
  position: relative; overflow: hidden;
}
.screen::before {
  content: ''; position: absolute; inset: 0; z-index: 100; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.09) 2px, rgba(0,0,0,.09) 4px);
}
.screen::after {
  content: ''; position: absolute; top: 0; left: 0; right: 50%; height: 45%;
  background: linear-gradient(135deg, rgba(255,255,255,.04), transparent);
  z-index: 101; pointer-events: none;
}
#screen-inner { position: absolute; inset: 0; overflow: hidden; font-family: var(--pixel); font-size: 7px; color: var(--text); }
.panel { display: flex; flex-direction: column; height: 100%; }
.s-header {
  background: var(--surface); border-bottom: 1px solid #0f2035;
  padding: 5px 8px; font-size: 7px; color: var(--amber); letter-spacing: 2px;
  display: flex; justify-content: space-between; flex-shrink: 0;
}
.s-body { flex: 1; padding: 6px 8px; overflow: hidden; }
.s-body.scroll { overflow-y: auto; }
.s-body.scroll::-webkit-scrollbar { width: 2px; }
.s-body.scroll::-webkit-scrollbar-thumb { background: var(--dim); }
.s-footer {
  background: var(--surface); border-top: 1px solid #0f2035;
  padding: 4px 8px; font-size: 5px; color: var(--dim); letter-spacing: 1px; flex-shrink: 0;
}
.row { padding: 3px 4px; font-size: 7px; line-height: 1.7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bright); display: flex; align-items: center; gap: 4px; }
.row.sel { color: var(--amber); background: rgba(245,166,35,.07); }
.row .sub { color: var(--dim); font-size: 5px; }
.dl { color: var(--dim); font-size: 5px; letter-spacing: 2px; margin: 6px 0 2px; }
.dv { color: var(--bright); font-size: 6px; line-height: 1.8; word-break: break-word; margin-bottom: 4px; }
.rule { padding: 2px 0; border-bottom: 1px solid #0f2035; font-size: 6px; line-height: 1.9; }
.rule.sel { color: var(--amber); }
.live-e { display: flex; gap: 5px; padding: 2px 0; border-bottom: 1px solid #080f18; font-size: 6px; }
.lt { color: var(--dim); flex-shrink: 0; }
.la { color: var(--bright); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-done { color: var(--green); flex-shrink: 0; }
.ls-working { color: var(--amber); flex-shrink: 0; }
.ls-failed { color: var(--red); flex-shrink: 0; }
.boot-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; padding: 0 16px; }
.boot-logo { font-size: 22px; color: var(--amber); letter-spacing: 10px; text-shadow: 0 0 20px rgba(245,166,35,.5); animation: gbglow 2s ease-in-out infinite; }
@keyframes gbglow { 0%,100%{text-shadow:0 0 10px rgba(245,166,35,.3)} 50%{text-shadow:0 0 30px rgba(245,166,35,.8)} }
.boot-sub { font-size: 5px; color: var(--dim); letter-spacing: 3px; }
.boot-lines { width: 100%; min-height: 72px; font-size: 6px; line-height: 2; }
.boot-line { color: var(--green); animation: gbfade .3s ease; }
@keyframes gbfade { from{opacity:0} to{opacity:1} }
.boot-hint { font-size: 5px; color: var(--dim); animation: gblink 1s step-end infinite; }
@keyframes gblink { 0%,100%{opacity:1} 50%{opacity:0} }
.brand { text-align: center; font-size: 6px; letter-spacing: 7px; color: #3a3a3a; padding: 6px 0 10px; text-shadow: 0 1px 0 #555; }
.ctrl-row { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 14px; }
.dpad { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
.dph, .dpv { position: absolute; background: #1e1e1e; border-radius: 2px; }
.dph { width: 110px; height: 36px; top: 37px; left: 0; box-shadow: 0 3px 0 #111, inset 0 1px 0 rgba(255,255,255,.08); }
.dpv { width: 36px; height: 110px; left: 37px; top: 0; box-shadow: 2px 0 0 #111; }
.dpc { position: absolute; width: 36px; height: 36px; background: #161616; top: 37px; left: 37px; z-index: 2; }
.dpb { position: absolute; background: transparent; border: none; cursor: pointer; z-index: 3; color: #3a3a3a; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.dpb:active { background: rgba(255,255,255,.08); }
.dpb.up { width: 36px; height: 36px; top: 0; left: 37px; }
.dpb.dn { width: 36px; height: 36px; bottom: 0; left: 37px; }
.dpb.lf { width: 36px; height: 36px; left: 0; top: 37px; }
.dpb.rt { width: 36px; height: 36px; right: 0; top: 37px; }
.face { position: relative; width: 110px; height: 100px; flex-shrink: 0; }
.fb { position: absolute; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-family: var(--pixel); font-size: 12px; }
.fb:active { transform: translateY(2px); }
.fb.a { background: linear-gradient(145deg, #c83322, #881811); box-shadow: 0 4px 0 #550f00, 0 4px 10px rgba(0,0,0,.5); color: #ffccaa; right: 0; top: 26px; }
.fb.b { background: linear-gradient(145deg, #223caa, #111e66); box-shadow: 0 4px 0 #001040, 0 4px 10px rgba(0,0,0,.5); color: #aac8ff; left: 0; top: 26px; }
.fbl { position: absolute; font-size: 5px; color: #4a4a4a; letter-spacing: 1px; }
.fbl.a { right: 6px; top: 6px; }
.fbl.b { left: 8px; top: 6px; }
.menu-row { display: flex; justify-content: center; gap: 22px; margin-bottom: 18px; }
.mb { background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 10px; padding: 5px 14px; color: #4a4a4a; font-family: var(--pixel); font-size: 5px; letter-spacing: 1px; cursor: pointer; box-shadow: 0 2px 0 #111; transform: rotate(-12deg); }
.mb:active { transform: rotate(-12deg) translateY(1px); box-shadow: none; }
.speaker { position: absolute; bottom: 22px; right: 20px; display: grid; grid-template-columns: repeat(5, 4px); grid-template-rows: repeat(3, 4px); gap: 3px; }
.sp { width: 4px; height: 4px; border-radius: 50%; background: #1a1a1a; box-shadow: inset 0 1px 0 rgba(0,0,0,.9); }
</style>
</head>
<body>
<div class="device">
  <div class="led"></div>
  <div class="screen-housing">
    <div class="screen-label">JARVIS GRID INTERFACE &nbsp;<span id="sse-dot" style="color:#333">&#9679;</span></div>
    <div class="screen">
      <div id="screen-inner"></div>
      <!-- P06: persistent emulator canvas — sits under scanline overlay (z-index 99 < 100) -->
      <canvas id="emu-canvas" style="position:absolute;inset:0;display:none;image-rendering:pixelated;z-index:99;background:#000;width:100%;height:100%"></canvas>
    </div>
  </div>
  <div class="brand">JARVIS</div>
  <div class="ctrl-row">
    <div class="dpad">
      <div class="dph"></div><div class="dpv"></div><div class="dpc"></div>
      <button class="dpb up" onclick="nav(-1)">&#9650;</button>
      <button class="dpb dn" onclick="nav(1)">&#9660;</button>
      <button class="dpb lf" onclick="emuDir('left')||back()">&#9664;</button>
      <button class="dpb rt" onclick="emuDir('right')||ok()">&#9654;</button>
    </div>
    <div class="face">
      <span class="fbl b">B</span><span class="fbl a">A</span>
      <button class="fb b" onclick="back()">B</button>
      <button class="fb a" onclick="ok()">A</button>
    </div>
  </div>
  <div class="menu-row">
    <button class="mb" onclick="emuBtn('SELECT')||back()">SELECT</button>
    <button class="mb" onclick="start()">START</button>
  </div>
  <div class="speaker" id="spk"></div>
</div>

<script>
// ── config (safe for client-side)
const SUPABASE_URL     = 'https://oexghfsvhnggddllgvrt.supabase.co';
const SUPABASE_ANON    = 'sb_publishable_N1-MFLpXtOXkKh3UQNfclw_ZG0TVqOA';
const VAPID_PUBLIC_KEY = 'BOM33NOZ7DDy-fNYxjIo1Xc3xMfFQY_RodR47qM68tmPU2HBXWVFlALlQiOG8MYxkY2uK1C2euH5KZ3v9JPdZdQ';
const GITHUB_REPO      = 'hurrisonferd/jarvis';
const PUSH_FN_URL      = `${SUPABASE_URL}/functions/v1/send-push`;
const BRIEFING_URL     = 'https://raw.githubusercontent.com/hurrisonferd/jarvis/main/JarvisBrief';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── speaker dots
(function(){ const s=document.getElementById('spk'); for(let i=0;i<15;i++){const d=document.createElement('div');d.className='sp';s.appendChild(d);} })();

// P22: EventBus — centralized event spine (replaces scattered sbEvent calls)
const BUS={
  _h:{},
  emit(evt,data={}){
    // P21: tag every event with role+ts, run AEGIS gate before dispatch
    const tagged={...data,_role:ModeController.mode,_ts:Date.now()};
    const block=AEGIS.gate(evt,tagged);
    if(block){ sbEvent('AEGIS_BLOCK',{evt,block}); return; }
    (this._h[evt]||[]).forEach(fn=>fn(tagged));
    (this._h['*']||[]).forEach(fn=>fn(evt,tagged));
    sbEvent(evt,tagged);
  },
  on(evt,fn){ this._h[evt]=(this._h[evt]||[]).concat([fn]); return ()=>{this._h[evt]=(this._h[evt]||[]).filter(f=>f!==fn);}; },
};

// ── Patch 4: ModeController — routes through BUS
const ModeController = {
  mode: 'jarvis_ui',
  set(m){ this.mode=m; BUS.emit('mode_change',{mode:m}); },
  is(m){ return this.mode===m; },
};

// P21: AEGIS output gate — GL4/GL5 enforcement at event bus level
const AEGIS={
  _deny:{
    emu_start:(d)=>(!self.crossOriginIsolated&&d.type==='gba')?'GL4:COI_required':null,
  },
  gate(evt,data){
    const check=this._deny[evt];
    if(check){ const v=check(data); if(v) return v; }
    return null;
  },
};

// ── Patch 4: neural mesh session
let sessionId = null;
async function startSession(){
  try{
    const {data}=await sb.from('sessions').insert({mode:ModeController.mode,active_node:'BOOT',agent:'jarvis_web',version:'2.5'}).select('id').single();
    if(data) sessionId=data.id;
  }catch(e){}
}
async function updateSession(node){
  if(!sessionId) return;
  try{ await sb.from('sessions').update({active_node:node,updated_at:new Date().toISOString()}).eq('id',sessionId); }catch(e){}
}
async function sbEvent(type,payload={}){
  try{ await sb.from('events').insert({type,payload,session_id:sessionId}); }catch(e){}
}

// P21: briefing-first boot — fetch JarvisBrief from GitHub as authoritative source
async function loadBriefing(){
  try{
    const r=await fetch(BRIEFING_URL);
    if(r.ok){ briefingLoaded=true; BUS.emit('BOOT',{briefing:'loaded',source:'github',patch_id:'P21',stage:'AYRE'}); }
    else { briefingLoaded=false; BUS.emit('BOOT',{briefing:'fallback',source:'github_error',status:r.status,patch_id:'P21',stage:'AYRE'}); }
  }catch(e){ briefingLoaded=false; BUS.emit('BOOT',{briefing:'fallback',source:'network_error',patch_id:'P21',stage:'AYRE'}); }
}

// ── Patch 5 Phase 1: L0 spatial graph
const L0_NODES = [
  {id:'AYRE',   type:'execution', x:0.5, y:0.1, links:['AEGIS']},
  {id:'AEGIS',  type:'execution', x:0.5, y:0.25,links:['ODIN']},
  {id:'ODIN',   type:'execution', x:0.5, y:0.4, links:['KRONOS']},
  {id:'KRONOS', type:'execution', x:0.5, y:0.55,links:['SKADI']},
  {id:'SKADI',  type:'execution', x:0.5, y:0.7, links:['MNEMOS','GAMEBOY']},
  {id:'GAMEBOY',type:'emulator',  subsystem:'gameboy', x:0.2, y:0.7, links:['SKADI']},
  {id:'MNEMOS', type:'memory',    x:0.3, y:0.85,links:['HUGINN']},
  {id:'HUGINN', type:'memory',    x:0.7, y:0.85,links:[]},
  {id:'HALO',   type:'parallel',  x:0.1, y:0.4, links:['ODIN']},
  {id:'MIMIR',  type:'parallel',  x:0.9, y:0.4, links:['ODIN']},
  {id:'BIFROST',type:'parallel',  x:0.1, y:0.6, links:['SKADI']},
  {id:'ERIS',   type:'guardian',  x:0.1, y:0.1, links:[]},
  {id:'PROMETHEUS',type:'governance',x:0.9,y:0.1,links:[]},
  {id:'NEMESIS',type:'integrity', x:0.9, y:0.25,links:[]},
  {id:'DANTE',  type:'post',      x:0.2, y:0.95,links:[]},
  {id:'APOLLO', type:'post',      x:0.5, y:0.97,links:[]},
  {id:'JANUS',  type:'post',      x:0.8, y:0.95,links:[]},
];
const NODE_COLORS={execution:'var(--amber)',memory:'var(--blue)',parallel:'var(--green)',guardian:'var(--red)',governance:'#c0f',integrity:'#f80',post:'var(--dim)',emulator:'#00ff88'};

// ── fallback (Supabase gameboy_snapshot overrides)
const FALLBACK_DATA = {
  pipeline: ['AYRE','AEGIS','ODIN','KRONOS','SKADI','MNEMOS','HUGINN'],
  god_systems: [
    {name:'ERIS',    description:'Gold Law guardian',     domain:'Governance / Entropy'},
    {name:'AYRE',    description:'Intake & parsing',      domain:'Execution — intake interpretation'},
    {name:'AEGIS',   description:'Constraint enforcer',   domain:'Execution — validation gate'},
    {name:'ODIN',    description:'Orchestration router',  domain:'Execution — task routing'},
    {name:'KRONOS',  description:'Scheduler / timing',    domain:'Execution — sequencing'},
    {name:'SKADI',   description:'Execution runtime',     domain:'Execution — tool invocation'},
    {name:'MNEMOS',  description:'Persistent memory',     domain:'Memory — semantic store'},
    {name:'HUGINN',  description:'Session reconciliation',domain:'Memory — cross-session diff'},
    {name:'HALO',    description:'Ambient monitoring',    domain:'Parallel — always-on observer'},
    {name:'MIMIR',   description:'Knowledge fabric',      domain:'Parallel — context access'},
    {name:'BIFROST', description:'Transport bridge',      domain:'Parallel — inter-system relay'},
    {name:'PROMETHEUS',description:'Expansion ledger',   domain:'Governance — rationale log'},
    {name:'NEMESIS', description:'Drift correction',      domain:'Integrity — overlap detection'},
    {name:'DANTE',   description:'Post-exec review',      domain:'Post — analysis pass'},
    {name:'APOLLO',  description:'Output formatting',     domain:'Post — render & deliver'},
    {name:'JANUS',   description:'Transition handler',    domain:'Post — handoff / mode switch'},
    {name:'LOKI',    description:'Chaos probe',           domain:'Test — adversarial injection'},
    {name:'HADES',   description:'Archival sink',         domain:'Archive — cold storage'},
  ],
  gold_law: [
    'GL1: no autonomous self-modification',
    'GL2: no cross-role authority override',
    'GL3: no implicit state persistence',
    'GL4: no unvalidated execution',
    'GL5: no silent state mutation',
    'GL6: deterministic evaluation required',
    'GL7: human final authority (Raven)',
    'GL7 SUPREME: no expansion without simplification',
    'GL8: implementation before expansion',
  ],
  districts: [
    {district:'L0 SPATIAL',  region:'Graph Foundation',   keywords:['nodes','edges','navigation']},
    {district:'L1 CAUSAL',   region:'Causal Graph',       keywords:['cause','effect','lineage']},
    {district:'L2 FIELDS',   region:'State Overlay',      keywords:['entropy','alignment','pressure']},
    {district:'L3 VECTORS',  region:'Direction Layer',    keywords:['routing','autopilot','flow']},
    {district:'L4 HYPERGRAPH',region:'Multi-link Logic',  keywords:['patches','decisions','groups']},
    {district:'L5 TEMPORAL', region:'Time / Versioning',  keywords:['replay','rollback','snapshots']},
    {district:'L6 PIPELINE', region:'Execution Flow',     keywords:['pipeline','stages','entropy']},
  ],
};

// ── state
let S='boot', cur=0, detail=null, gdata=null, lives=[];
let sseConnected=false;
let nodeFields={};
let briefingLoaded=false;
const PG=7;
// P23: GRID state kernel — TRON is read-only projection; all field mutations go through GRID.set()
const GRID={nodes:L0_NODES,get fields(){return nodeFields},set(id,d){nodeFields[id]=d;}};
// P28: KRONOS time controller — real=auto-tick 900ms, stepped=manual, frozen=paused
const KRONOS={mode:'frozen',tick:0,_iv:null};
let tronLayer=0;         // P05/P13: 0=L0 spatial, 4=hypergraph, 5=temporal, 6=pipeline
let liveTab=0;           // P22/P17: 0=live, 1=replay, 2=audit
let replayData=[], auditData=[];

const MENU=[
  {label:'GOD SYSTEMS', state:'god'},
  {label:'GOLD LAW',    state:'gold'},
  {label:'THE GRID',    state:'grid'},
  {label:'TRON',        state:'tron'},
  {label:'LIVE FEED',   state:'live'},
  {label:'ALERTS',      state:'alerts'},
  {label:'GITHUB',      state:'github'},
  {label:'EMULATOR',    state:'emu'},
];

function draw(){
  const ec=document.getElementById('emu-canvas');
  if(ec) ec.style.display=(emuState==='running'&&S==='emu')?'block':'none';
  const el=document.getElementById('screen-inner');
  if(S==='menu')        el.innerHTML=rMenu();
  else if(S==='god')    el.innerHTML=rGodList();
  else if(S==='godD')   el.innerHTML=rGodDetail();
  else if(S==='gold')   el.innerHTML=rGold();
  else if(S==='grid')   el.innerHTML=rGrid();
  else if(S==='tron')   el.innerHTML=rTRON();
  else if(S==='gridD')  el.innerHTML=rGridDetail();
  else if(S==='live')   el.innerHTML=rLive();
  else if(S==='alerts') el.innerHTML=rAlerts();
  else if(S==='github') el.innerHTML=rGithub();
  else if(S==='ghIssue') el.innerHTML=rGhIssue();
  else if(S==='emu')    el.innerHTML=rEmulator();
}

function cursor(i,sel){ return '<span style="color:'+(sel?'var(--amber)':'var(--dim)')+'">'+(sel?'&#9658;':' ')+'</span>'; }

function rMenu(){
  const subs=[
    gdata?gdata.god_systems.length+' NODES':'...',
    gdata?gdata.gold_law.length+' RULES':'...',
    gdata?gdata.districts.length+' DISTRICTS':'...',
    L0_NODES.length+' NODES',
    lives.length+' ENTRIES',
    pushSubbed?'ON':'OFF',
    ghData?'LOADED':'...',
    EmulatorRouter.active?EmulatorRouter.active.toUpperCase():'IDLE',
  ];
  const bCol=briefingLoaded?'var(--green)':'var(--amber)';
  const bLabel=briefingLoaded?'BRIEFED':'FALLBACK';
  return '<div class="panel">\n    <div class="s-header"><span>JARVIS v2.5</span><span><span style="color:'+bCol+'">&#9632;</span> '+bLabel+'</span></div>\n    <div class="s-body" style="padding-top:10px">\n      '+MENU.map((m,i)=>'<div class="row '+(cur===i?'sel':'')+'">'+cursor(i,cur===i)+' '+m.label+' <span class="sub">'+(subs[i]||'')+'</span></div>').join('')+'\n    </div>\n    <div class="s-footer">A:SELECT &nbsp; &#8593;&#8595;:MOVE &nbsp; START:MENU</div>\n  </div>';
}

function rGodList(){
  if(!gdata) return rLoad();
  const sys=gdata.god_systems, pip=gdata.pipeline||[];
  const st=Math.floor(cur/PG)*PG, pg=sys.slice(st,st+PG);
  return '<div class="panel">\n    <div class="s-header"><span>GOD SYSTEMS</span><span>'+(cur+1)+'/'+sys.length+'</span></div>\n    <div class="s-body">\n      '+pg.map((s,i)=>{const idx=st+i,inP=pip.includes(s.name);return '<div class="row '+(cur===idx?'sel':'')+'">'+cursor(idx,cur===idx)+'<span style="color:'+(inP?'var(--green)':'var(--bright)')+'">'+s.name+'</span><span class="sub">'+(s.description||'').substring(0,18)+'</span></div>';}).join('')+'\n    </div>\n    <div class="s-footer">A:VIEW &nbsp; B:BACK &nbsp; &#8593;&#8595;:SCROLL</div>\n  </div>';
}

// L3: hex colors for SVG markers (CSS vars don't resolve inside <marker> defs)
const ARROW_COLS={execution:'#f5a623',memory:'#00aaff',parallel:'#00ff88',guardian:'#ff3355',governance:'#cc00ff',integrity:'#ff8800',post:'#1e3a52'};

// P06: dynamic script loader
function loadScript(url){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+url+'"]')){ res(); return; }
    const s=document.createElement('script'); s.src=url;
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

// P06: GB/GBC adapter — WasmBoy (confirmed CDN)
const WasmBoyCore={
  name:'WasmBoy', types:['gb','gbc'], _ready:false,

      await loadScript('https://cdn.jsdelivr.net/npm/wasmboy@0.7.1/dist/wasmboy.wasm.umd.js');

    await WasmBoy.config(canvas,{headless:false,isAudioEnabled:true,gameboyFrameRate:60,useGbcWhenOptional:true});

  play(){ WasmBoy.play(); },

  async restore(s){ try{if(s) await WasmBoy.loadState(s);}catch(e){} },

// P06: GBA adapter — @thenick775/mgba-wasm v2.4.1 (COI headers enabled in gameboy-sw.js)
const MGBA_CDN='https://cdn.jsdelivr.net/npm/@thenick775/mgba-wasm@2.4.1/dist/';
const MGBA_LOCAL='/emulator/cores/';
const MGBACore={
  name:'mGBA', types:['gba'], _m:null, _prev:new Set(),
  _map:{A:'A',B:'B',UP:'Up',DOWN:'Down',LEFT:'Left',RIGHT:'Right',START:'Start',SELECT:'Select',L:'L',R:'R'},
  async init(canvas){
    if(!self.crossOriginIsolated) throw new Error('COI_REQUIRED');
    let mod;
    try{ mod=await import('https://esm.sh/@thenick775/mgba-wasm@2.4.1'); }
    catch(e){ throw new Error('mgba_import_failed:'+e.message); }
    const factory=mod.default??mod.mGBA;
    if(typeof factory!=='function') throw new Error('mgba_no_factory[keys:'+Object.keys(mod).join(',')+']');
    let wasmBase=MGBA_CDN;
    try{ const r=await fetch(MGBA_LOCAL+'mgba.wasm',{method:'HEAD'}); if(r.ok) wasmBase=MGBA_LOCAL; }catch(_){}
    this._m=await factory({canvas,locateFile:f=>wasmBase+f});
    await this._m.FSInit();
  },
  async loadROM(buf){
    return new Promise((res,rej)=>{
      const arr=new Uint8Array(buf);
      const name=(romName||'game.gba').replace(/[^a-zA-Z0-9._-]/g,'_');
      try{
        this._m.uploadRom(arr,()=>{
          this._m.loadGame('/data/games/'+name);
          res();
        });
      }catch(e){rej(e);}
    });
  },
  play(){ try{this._m.resumeGame();}catch(e){} },
  pause(){ try{this._m.pauseGame();}catch(e){} },
  stop(){ try{this._m.quitGame();}catch(e){} },
  setInput(state){
    if(!this._m) return;
    const mp=this._map;
    this._prev.forEach(k=>{ if(!state[k]) try{this._m.buttonUnpress(mp[k]);}catch(e){} });
    this._prev=new Set();
    Object.entries(state).forEach(([k,v])=>{
      if(v&&mp[k]){ try{this._m.buttonPress(mp[k]);}catch(e){} this._prev.add(k); }
    });
  },
  async snapshot(){ try{this._m.saveState(0);return{slot:0};}catch(e){return null;} },
  async restore(s){ try{if(s?.slot!==undefined) this._m.loadState(s.slot);}catch(e){} },
};

const EmulatorRouter={

};

const ROMLoader={
  detect(buf){
    if(!buf||buf.byteLength<4) return null;
    const v=new Uint8Array(buf);
    return (v[0]===0x2E&&v[1]===0x00&&v[2]===0x00&&v[3]===0xEA)?'gba':'gb';
  },
};

let romName='', romType='', activeCore=null, emuState='idle', emuError='';

function rEmulator(){
  let body='';

    body=`<div style="color:var(--amber);font-size:6px;padding:20px;text-align:center">LOADING ENGINE...</div>

      <div class="dl">ENGINE</div><div class="dv" style="color:var(--amber)">PRESS A TO LAUNCH</div>`;
  } else {
    body=`<div style="color:var(--dim);font-size:6px;line-height:2.2;padding:4px 0">EMULATOR CORE IDLE</div>
      <div style="color:var(--bright);font-size:6px;line-height:2">PRESS A TO LOAD ROM</div>
      <div style="color:var(--dim);font-size:5px;margin-top:8px;line-height:2">ACCEPTS: .gb  .gba  .rom</div>
      <div style="color:var(--dim);font-size:5px;line-height:2">DETECTS TYPE VIA HEADER</div>
      <div style="color:var(--dim);font-size:5px;line-height:2">ARM RESET → GBA &nbsp; else → GB</div>`;
  }
  const stCol=emuState==='running'?'var(--green)':emuState==='failed'||emuState==='coi'?'var(--red)':'var(--amber)';
  let footer;
  if(emuState==='running') footer='&#9650;&#9660;:UP/DN &nbsp; A:A &nbsp; B:B &nbsp; START:START';
  else if(EmulatorRouter.active) footer='A:LAUNCH &nbsp; B:STOP+BACK';
  else footer='A:LOAD ROM &nbsp; B:BACK';
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--green)">EMULATOR</span><span style="color:${stCol}">${emuState.toUpperCase()}</span></div>
    <div class="s-body scroll" style="padding-top:8px">${body}</div>
    <div class="s-footer">${footer}</div>
    <input id="rom-input" type="file" accept=".gb,.gba,.rom,.bin" style="position:absolute;opacity:0;pointer-events:none" onchange="handleROM(this)">
  </div>`;

function handleROM(inp){
  const file=inp.files[0];
  if(!file) return;
  romName=file.name;
  const reader=new FileReader();
  reader.onload=async e=>{
    const buf=e.target.result;
    const t=ROMLoader.detect(buf);
    romType=t||'unknown';
    if(!t){ beep(200,150); emuState='idle'; draw(); return; }
    EmulatorRouter.load(t+'_core');
    beep(880,100);
    emuState='loading'; draw();
    const core=getCore(t);
    if(!core){ emuState='failed'; draw(); return; }
    const canvas=document.getElementById('emu-canvas');
    if(!canvas){ emuState='failed'; draw(); return; }
    try{
      await core.init(canvas);
      await core.loadROM(buf);
      activeCore=core;
      core.play();
      emuState='running';
      BUS.emit('emu_start',{engine:core.name,type:t,file:romName,patch_id:'P06',stage:'SKADI'});
    }catch(err){
      activeCore=null;
      if(err.message==='COI_REQUIRED'){ emuState='coi'; emuError=''; }
      else { emuState='failed'; emuError=err.message||String(err); }
      BUS.emit('emu_error',{engine:core?.name,error:err.message,type:t,patch_id:'P06',stage:'AEGIS'});
    }
    draw();
  };
  reader.readAsArrayBuffer(file);
  inp.value='';
}

function rL0Graph(){
  const W=310, H=250;
  let defs='<defs>';
  Object.entries(ARROW_COLS).forEach(([type,col])=>{
    defs+=`<marker id="arr-${type}" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="${col}" opacity="0.75"/></marker>`;
  });
  defs+='</defs>';
  let regions='';
  GRID_REGIONS.forEach(r=>{
    const ex=Math.round(r.cx*W),ey=Math.round(r.cy*H);
    const erx=Math.round(r.rx*W),ery=Math.round(r.ry*H);
    regions+=`<ellipse cx="${ex}" cy="${ey}" rx="${erx}" ry="${ery}" fill="${r.col}" fill-opacity="0.03" stroke="${r.col}" stroke-width="0.5" stroke-opacity="0.18" stroke-dasharray="2,3"/>`;
    regions+=`<text x="${ex}" y="${ey-ery-3}" text-anchor="middle" font-size="3" fill="${r.col}" opacity="0.35" font-family="monospace">${r.label}</text>`;
  });
  let portals='';
  GRID_PORTALS.forEach(p=>{
    const src=L0_NODES.find(n=>n.id===p.from); if(!src) return;
    const sx=Math.round(src.x*W),sy=Math.round(src.y*H);
    const px=Math.round(p.x*W),py=Math.round(p.y*H);
    const anchor=p.x<0.3?'start':p.x>0.7?'end':'middle';
    portals+=`<line x1="${sx}" y1="${sy}" x2="${px}" y2="${py}" stroke="${p.col}" stroke-width="0.7" stroke-dasharray="3,4" opacity="0.28"/>`;
    portals+=`<text x="${px}" y="${py}" text-anchor="${anchor}" font-size="3.5" fill="${p.col}" opacity="0.45" font-family="monospace">${p.label}</text>`;
  });
  let lines='', glows='', circles='', labels='';
  const fvals=Object.values(nodeFields);
  const avgLoad=fvals.length?Math.round(fvals.reduce((a,f)=>a+f.load,0)/fvals.length*100):0;
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    n.links.forEach(lid=>{
      const t=L0_NODES.find(x=>x.id===lid);
      if(!t) return;
      const f=nodeFields[n.id]||{load:0};
      const lw=(0.8+f.load*1.5).toFixed(1);
      const lo=(0.4+f.load*0.5).toFixed(2);
      const tx2=Math.round(t.x*W), ty2=Math.round(t.y*H);
      const dx=tx2-cx, dy=ty2-cy, d=Math.sqrt(dx*dx+dy*dy)||1;
      const ex=Math.round(tx2-(dx/d)*11), ey=Math.round(ty2-(dy/d)*11);
      lines+=`<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="#0f2035" stroke-width="${lw}" opacity="${lo}" marker-end="url(#arr-${n.type})"/>`;
    });
  });
  L0_NODES.forEach(n=>{
    const cx=Math.round(n.x*W), cy=Math.round(n.y*H);
    const col=NODE_COLORS[n.type]||'var(--dim)';
    const f=nodeFields[n.id]||{entropy:0,alignment:1,load:0,instability:0};
    const glowR=Math.round(7+f.load*12);
    const glowOp=(0.12+f.load*0.4).toFixed(2);
    glows+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${col}" stroke-width="1" opacity="${glowOp}"/>`;
    const strokeCol=f.entropy>0.5?'var(--red)':col;
    const sw=(1.5+f.load*2.5).toFixed(1);
    const nodeOp=(0.5+f.alignment*0.5).toFixed(2);
    circles+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${strokeCol}" stroke-width="${sw}" opacity="${nodeOp}"/>`;
    labels+=`<text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="4" fill="${strokeCol}" opacity="${nodeOp}" font-family="monospace">${n.id}</text>`;
  });
  const loadBar='█'.repeat(Math.round(avgLoad/10))+'░'.repeat(10-Math.round(avgLoad/10));
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--blue)">TRON</span><span style="color:var(--dim)">L0+P27+P28 · ${L0_NODES.length}N · <span style="color:${KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span> T${KRONOS.tick}</span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${defs}${regions}${portals}${lines}${glows}${circles}${labels}</svg>
    </div>
    <div class="s-footer">LOAD ${loadBar} ${avgLoad}% &nbsp; A:${KRONOS.mode==='stepped'?'STEP':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

function rL4Graph(){
  const W=310,H=250;
  let defs='<defs>';
  L4_EDGES.forEach(e=>{ defs+=`<marker id="h4-${e.patch}" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="${e.col}" opacity="0.7"/></marker>`; });
  defs+='</defs>';
  let lines='',circles='',labels='',ptags='';
  L0_NODES.forEach(n=>{

  });
  L4_EDGES.forEach((e,i)=>{

}

function rL5Graph(){
  const commits=(ghData?.commits||[]).slice(0,8);
  const W=310,H=250;
  const cy=H/2,x0=20,xStep=commits.length>1?Math.floor((W-40)/(commits.length-1)):W-40;
  let elems='';
  commits.forEach((c,i)=>{
    const cx=x0+i*xStep;
    const col=i===0?'var(--green)':'var(--amber)';
    if(i>0) elems+=`<line x1="${cx-xStep+7}" y1="${cy}" x2="${cx-7}" y2="${cy}" stroke="#0f2035" stroke-width="1.2" opacity="0.7"/>`;
    elems+=`<circle cx="${cx}" cy="${cy}" r="6" fill="#080f18" stroke="${col}" stroke-width="1.5"/>`;

function rL6Pipeline(){
  const pipe=['AYRE','AEGIS','ODIN','KRONOS','SKADI','MNEMOS','HUGINN'];
  const W=310,H=250,cy=Math.round(H/2);
  const xStart=22,xEnd=W-22,xStep=(xEnd-xStart)/(pipe.length-1);
  let elems='<defs><marker id="lp-arr" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#f5a623" opacity="0.75"/></marker></defs>';
  let totalEntropy=0;
  pipe.forEach((name,i)=>{
    const cx=Math.round(xStart+i*xStep);
    const n=L0_NODES.find(x=>x.id===name);
    const col=n?NODE_COLORS[n.type]||'#f5a623':'#f5a623';
    const f=nodeFields[name]||{load:0,alignment:1,entropy:0};
    totalEntropy+=f.entropy||0;
    const active=(f.load||0)>0.05;
    if(i>0){
      const px=Math.round(xStart+(i-1)*xStep);
      elems+=`<line x1="${px+8}" y1="${cy}" x2="${cx-8}" y2="${cy}" stroke="#0f2035" stroke-width="1.2" opacity="0.7" marker-end="url(#lp-arr)"/>`;
    }
    const glowR=active?Math.round(8+(f.load||0)*10):0;
    if(glowR>8) elems+=`<circle cx="${cx}" cy="${cy}" r="${glowR}" fill="none" stroke="${col}" stroke-width="1" opacity="${(0.12+(f.load||0)*0.4).toFixed(2)}"/>`;
    elems+=`<circle cx="${cx}" cy="${cy}" r="7" fill="#080f18" stroke="${col}" stroke-width="${active?2:1}" opacity="${active?1:0.5}"/>`;
    elems+=`<text x="${cx}" y="${cy+1.5}" text-anchor="middle" dominant-baseline="middle" font-size="3.5" fill="${col}" font-family="monospace">${name.slice(0,4)}</text>`;
    elems+=`<text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="3" fill="${active?col:'var(--dim)'}" font-family="monospace">${active?Math.round((f.load||0)*100)+'%':'--'}</text>`;
  });
  const avgEnt=totalEntropy/pipe.length;
  const filledBars=Math.round(avgEnt*10);
  const eBar='█'.repeat(filledBars)+'░'.repeat(10-filledBars);
  return `<div class="panel">
    <div class="s-header"><span style="color:var(--amber)">L6 PIPELINE</span><span style="color:var(--dim)">${pipe.length} STAGES · <span style="color:${KRONOS.mode==='real'?'var(--green)':KRONOS.mode==='stepped'?'var(--amber)':'var(--dim)'}">${KRONOS.mode.toUpperCase()}</span></span></div>
    <div class="s-body" style="padding:4px;display:flex;align-items:center;justify-content:center">
      <svg width="${W}" height="${H}" style="overflow:visible">${elems}</svg>
    </div>
    <div class="s-footer">ENT ${eBar} &nbsp; A:${KRONOS.mode==='stepped'?'STEP':'KRONOS'} &nbsp; &#8593;&#8595;:LAYER &nbsp; B:BACK</div>
  </div>`;
}

// P28: GRID tick — field propagation simulation; Supabase realtime overrides local state
function gridTick(){
  KRONOS.tick++;
  const next={};
  L0_NODES.forEach(n=>{
    const f=nodeFields[n.id]||{load:0,entropy:0,alignment:1};
    next[n.id]={...f,
      load:Math.max(0,(f.load||0)*0.92),
      entropy:Math.max(0,Math.min(1,(f.entropy||0)+(Math.random()-0.52)*0.03)),
      alignment:Math.max(0,Math.min(1,(f.alignment||1)*0.99+0.005)),
    };
  });
  L0_NODES.forEach(n=>{
    const f=nodeFields[n.id]||{load:0};
    n.links.forEach(lid=>{
      if(next[lid]) next[lid].load=Math.min(1,next[lid].load+(f.load||0)*0.08);
    });
  });
  Object.entries(next).forEach(([id,d])=>GRID.set(id,d));
  BUS.emit('tick',{tick:KRONOS.tick,mode:KRONOS.mode,patch_id:'P28',stage:'KRONOS'});
  if(S==='tron') draw();
}
function startTick(){ if(KRONOS._iv) return; KRONOS._iv=setInterval(gridTick,900); }
function stopTick(){ clearInterval(KRONOS._iv); KRONOS._iv=null; }
function toggleKRONOS(){
  if(KRONOS.mode==='stepped'){ gridTick(); return; }
  if(KRONOS.mode==='frozen'){ KRONOS.mode='real'; startTick(); }
  else if(KRONOS.mode==='real'){ KRONOS.mode='stepped'; stopTick(); }
  else { KRONOS.mode='frozen'; stopTick(); }
  beep(KRONOS.mode==='real'?660:KRONOS.mode==='stepped'?440:220,60);
  draw();
}

let actx=null;
function beep(f,ms){
  try{
    if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.07,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000);
  }catch(e){}
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)||k==='Enter') e.preventDefault();
  if(emuState==='running'&&activeCore){
    const jmap={
      'ArrowUp':{UP:true},'ArrowDown':{DOWN:true},
      'ArrowLeft':{LEFT:true},'ArrowRight':{RIGHT:true},
      'z':{A:true},'Z':{A:true},'Enter':{A:true},
      'x':{B:true},'X':{B:true},'Escape':{B:true},
      ' ':{START:true},'Backspace':{SELECT:true},
    };
    const st=jmap[k];
    if(st){ activeCore.setInput(st); setTimeout(()=>activeCore.setInput({}),80); }
    return;
  }
  if(k==='ArrowUp')   nav(-1);
  if(k==='ArrowDown') nav(1);
  if(k==='ArrowRight'||k==='z'||k==='Z'||k==='Enter') ok();
  if(k==='ArrowLeft' ||k==='x'||k==='X'||k==='Escape') back();
  if(k===' ') start();
});

let pushStatus='CHECKING...', pushSubbed=false, pushSub=null;

function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function checkPushSupport(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    pushStatus='NOT SUPPORTED\nREQUIRES HTTPS'; if(S==='alerts') draw(); return;
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    pushSub=await reg.pushManager.getSubscription();
    if(pushSub){ pushSubbed=true; pushStatus='SUBSCRIBED\nPUSH ACTIVE'; }
    else { pushStatus='NOT SUBSCRIBED'; }
  }catch(e){ pushStatus='ERROR:\n'+e.message; }
  if(S==='alerts') draw();
}

async function toggleAlerts(){
  if(pushSubbed) await unsubscribeAlerts(); else await subscribeAlerts();
}

async function subscribeAlerts(){
  pushStatus='SUBSCRIBING...'; draw();
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const subJson=sub.toJSON();
    await sb.from('push_subscriptions').upsert({endpoint:subJson.endpoint,subscription_info:subJson},{onConflict:'endpoint'});
    pushSub=sub; pushSubbed=true; pushStatus='SUBSCRIBED\nPUSH ACTIVE'; beep(880,120);
  }catch(e){ pushStatus='FAILED:\n'+e.message; }
  draw();
}

async function unsubscribeAlerts(){
  pushStatus='UNSUBSCRIBING...'; draw();
  try{
    if(pushSub){
      await sb.from('push_subscriptions').delete().eq('endpoint',pushSub.endpoint);
      await pushSub.unsubscribe(); pushSub=null;
    }
    pushSubbed=false; pushStatus='UNSUBSCRIBED'; beep(220,120);
  }catch(e){ pushStatus='FAILED:\n'+e.message; }
  draw();
}

let ghData=null, ghTab=0, ghLoading=false, ghError='';
let ghIssueTitle='', ghIssueBody='', ghIssueField='title', ghSubmitting=false, ghResult='';
const GH_TABS=['COMMITS','PRS','ISSUES','NEW ISSUE'];

async function loadGithub(){
  ghLoading=true; ghError=''; if(S==='github') draw();
  try{
    const [cr,pr,ir]=await Promise.all([
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits?per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/pulls?state=open&per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
      fetch(`https://api.github.com/repos/${GITHUB_REPO}/issues?state=open&per_page=5`,{headers:{'Accept':'application/vnd.github+json'}}),
    ]);
    const commits=(await cr.json()).map?.(c=>({sha:c.sha.slice(0,7),message:c.commit.message.split('\n')[0].slice(0,60),author:c.commit.author.name,date:c.commit.author.date.slice(0,10)})) ?? [{error:'no data'}];
    const prs=(await pr.json()).map?.(p=>({number:p.number,title:p.title.slice(0,60),user:p.user.login})) ?? [];
    const issues=(await ir.json()).filter?.(i=>!i.pull_request).map(i=>({number:i.number,title:i.title.slice(0,60),user:i.user.login})) ?? [];
    ghData={commits,prs,issues};
  }catch(e){ ghError=e.message; }
  ghLoading=false; if(S==='github') draw();
}

  ghTab=((ghTab+d)%GH_TABS.length+GH_TABS.length)%GH_TABS.length;

  h+=`</div>`;
  h+=`<div style="color:var(--dim);font-size:7px;padding:4px 8px">TAP FIELD · A=SUBMIT · B=BACK</div>`;
  h+=`<input id="gh-t" style="position:absolute;opacity:0;pointer-events:none" value="${ghIssueTitle.replace(/"/g,'&quot;')}" oninput="ghIssueTitle=this.value;draw()" onblur="draw()">`;
  h+=`<input id="gh-b" style="position:absolute;opacity:0;pointer-events:none" value="${ghIssueBody.replace(/"/g,'&quot;')}" oninput="ghIssueBody=this.value;draw()" onblur="draw()">`;
  return h;
}

async function ghSubmitIssue(){
  if(!ghIssueTitle.trim()){ beep(200,100); return; }
  ghSubmitting=true; draw();
  try{
    const r=await fetch(`${PUSH_FN_URL.replace('send-push','github-issue')}`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${SUPABASE_ANON}`},
      body:JSON.stringify({title:ghIssueTitle,body:ghIssueBody,repo:GITHUB_REPO})
    });
    const d=await r.json();
    ghResult=d.ok?`CREATED #${d.number}`:('ERROR: '+(d.error||'unknown'));
  }catch(e){ ghResult='ERROR: '+e.message; }
  ghSubmitting=false; draw(); beep(880,120);
}

function sseDot(on){
  const d=document.getElementById('sse-dot');
  if(d){ d.style.color=on?'#00ff88':'#333'; }
}

function connectRealtime(){
  sb.channel('jarvis-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'live_log'},payload=>{
      lives.unshift(payload.new);
      if(lives.length>100) lives=lives.slice(0,100);
      if(S==='live') draw();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'prometheus_log'},payload=>{
      const d=payload.new;
      lives.unshift({action:'PROMETHEUS: '+(d.decision||'').slice(0,50),status:'done',time:new Date().toTimeString().slice(0,8)});
      if(lives.length>100) lives=lives.slice(0,100);
      if(S==='live') draw();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'node_fields'},payload=>{
      const r=payload.new; GRID.set(r.node_id,r);
      if(S==='tron') draw();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'node_fields'},payload=>{
      const r=payload.new; GRID.set(r.node_id,r);
      if(S==='tron') draw();
    })
    .subscribe(status=>{
      sseConnected=(status==='SUBSCRIBED');
      sseDot(sseConnected);
      if(S==='live') draw();
    });
}

async function loadData(){
  try{
    const {data}=await sb.from('gameboy_snapshot').select('data').eq('id',1).single();
    if(data?.data){ gdata=data.data; }
    else { gdata=FALLBACK_DATA; }
  }catch(e){ gdata=FALLBACK_DATA; }
  if(S!=='boot') draw();
}

async function loadLive(){
  try{
    const {data}=await sb.from('live_log').select('*').order('created_at',{ascending:false}).limit(50);
    if(data){ lives=data; if(S==='live') draw(); }
  }catch(e){}
}

async function loadNodeFields(){
  try{
    const {data}=await sb.from('node_fields').select('*');
    if(data) data.forEach(r=>{ GRID.set(r.node_id,r); });
  }catch(e){}
  if(S==='tron') draw();
}

// P21: boot sequence — AYRE→briefing→AEGIS→ODIN→state sync→READY
const BOOT_LINES=['AYRE: PARSING INTENT...','LOADING BRIEFING...','AEGIS: GOLD LAWS ACTIVE...','ODIN: ROUTING ONLINE...','CONNECTING SUPABASE...','REALTIME MESH UP...','READY.'];

function runBoot(){
  const el=document.getElementById('screen-inner');
  el.innerHTML=`<div class="boot-panel">
    <div class="boot-logo">JARVIS</div>
    <div class="boot-sub">NEURAL MESH v2.5</div>
    <div class="boot-lines" id="blines"></div>
    <div class="boot-hint">PRESS ANY KEY</div>
  </div>`;
  let i=0;
  function tick(){
    if(i<BOOT_LINES.length){
      const ln=document.createElement('div'); ln.className='boot-line';
      ln.textContent='> '+BOOT_LINES[i++];
      document.getElementById('blines').appendChild(ln);
      setTimeout(tick,220);
    }
  }
  setTimeout(tick,350);
}

loadBriefing();
