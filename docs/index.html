<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Invaders</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-wrapper {
            position: relative;
            width: 480px;
            height: 640px;
            max-width: 100%;
            max-height: 100%;
        }
        
        #gameCanvas {
            display: block;
            background-color: #000;
            border: 2px solid #333;
            border-radius: 4px;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #startButton {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background-color: #00ff00;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        
        #startButton:hover {
            background-color: #33ff33;
            transform: scale(1.05);
        }
        
        #startButton:active {
            transform: scale(0.95);
        }
        
        .controls-hint {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="startScreen">
                <h1 style="color: #fff; margin-bottom: 40px; font-size: 32px;">SPACE INVADERS</h1>
                <button id="startButton">START GAME</button>
                <div class="controls-hint">
                    <p>Desktop: Arrow Keys + SPACE</p>
                    <p>Mobile: Touch to shoot, Swipe to move</p>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="./js/game.js"></script>
  <script>
    // Inline init — const-bug guard
    const JARVIS_INIT = true;
  </script>
</body>
</html>
