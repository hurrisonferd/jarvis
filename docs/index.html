// ── 8-bit beep
let actx=null;
function beep(f,ms){
  try{
    if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.07,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+ms/1000);
    o.start(); o.stop(actx.currentTime+ms/1000);
  }catch(e){}
}

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)||k==='Enter') e.preventDefault();
  if(k==='ArrowUp')   nav(-1);
  if(k==='ArrowDown') nav(1);
  if(k==='ArrowRight'||k==='z'||k==='Z'||k==='Enter') ok();
  if(k==='ArrowLeft' ||k==='x'||k==='X'||k==='Escape') back();
  if(k===' ') start();
});

function urlBase64ToUint8Array(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}

async function saveToSupabase(sub){
  const j = sub.toJSON();
  const res = await fetch(`${SB_URL}/rest/v1/push_subscriptions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SB_ANON,
      'Authorization': `Bearer ${SB_ANON}`,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      endpoint:   j.endpoint,
      p256dh:     j.keys.p256dh,
      auth:       j.keys.auth,
      user_agent: navigator.userAgent.substring(0, 255)
    })
  });
  return res.status < 300 || res.status === 409; // 409 = already exists, ok
}

    btn.textContent = 'NOT SUPPORTED';
    return;
  }

  const reg = await navigator.serviceWorker.register('/jarvis/sw.js');
  await navigator.serviceWorker.ready;

  const existing = await reg.pushManager.getSubscription();
  if(existing){
    setActive('Already subscribed.\nNotifications are armed.', existing);
    return;
  }

  const perm = Notification.permission;
  if(perm === 'denied'){
    ring.textContent = '✗';
    ring.classList.add('error');
    status.textContent = 'Notifications blocked.\nEnable in browser settings.';
    btn.textContent = 'BLOCKED';
    return;
  }

  status.textContent = 'Tap to enable\npush notifications.';
  btn.textContent = 'ENABLE PUSH ALERTS';
  btn.disabled = false;
  btn.onclick = () => subscribe(reg);
}

async function subscribe(reg){
  btn.disabled = true;
  btn.textContent = 'SUBSCRIBING...';
  status.textContent = 'Requesting permission...';
  try{
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64(VAPID_PUBLIC)
    });
    status.textContent = 'Saving to JARVIS...';
    const ok = await saveToSupabase(sub);
    if(ok){
      setActive('Subscription active.\nJARVIS will reach you.', sub);
    } else {
      throw new Error('Supabase save failed');
    }
  } catch(e){
    ring.textContent = '✗';
    ring.classList.add('error');
    status.textContent = 'Failed: ' + (e.message || 'unknown error');
    btn.textContent = 'RETRY';
    btn.disabled = false;
    btn.onclick = () => subscribe(reg);
  }
}

function setActive(msg, sub){
  ring.textContent = '✓';
  ring.classList.add('active');
  status.textContent = msg;
  btn.textContent = 'UNSUBSCRIBE';
  btn.disabled = false;
  btn.classList.add('secondary');
  btn.onclick = () => unsubscribe(sub);
  testBtn.style.display = 'block';
}

async function unsubscribe(sub){
  await sub.unsubscribe();
  await fetch(`${SB_URL}/rest/v1/push_subscriptions?endpoint=eq.${encodeURIComponent(sub.endpoint)}`, {
    method: 'DELETE',
    headers: {'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}`}
  });
  location.reload();
}

async function sendTest(){
  testBtn.textContent = 'SENDING...';
  testBtn.disabled = true;
  // Posts to Supabase live_log table to trigger a push from the JARVIS server
  await fetch(`${SB_URL}/rest/v1/live_log`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SB_ANON,
      'Authorization': `Bearer ${SB_ANON}`,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({action:'TEST: push notification from JARVIS mobile page', status:'done', type:'test'})
  });
  setTimeout(()=>{ testBtn.textContent = 'SEND TEST PUSH'; testBtn.disabled = false; }, 2000);
}

init().catch(e => { status.textContent = 'Error: '+e.message; });
</script>
</body>
</html>
