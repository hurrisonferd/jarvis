<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08050f">
<title>RavenOS Pocket // Cartridge Civilization Handheld</title>
<link rel="stylesheet" href="./ravenos-gameboy-v2.css">
</head>
<body>
<main class="gb" aria-label="RavenOS public cartridge civilization handheld">
  <div class="top-hardware"><div id="led" class="led" aria-label="packet status light"></div></div>
  <section class="housing">
    <div class="label"><span class="machine">RAVENOS POCKET // CARTRIDGE BUS</span><span id="packet" class="packet">BOOT</span></div>
    <div class="screen">
      <div id="ui" tabindex="0" aria-live="polite"></div>
      <div class="scroll-rail" aria-hidden="true"><div id="scrollThumb" class="scroll-thumb"></div></div>
    </div>
  </section>
  <div class="brand">RAVENOS <b>POCKET</b><small>CARTRIDGE CIVILIZATION SHELL // NOT AUTHORITY</small></div>
  <div class="controls">
    <div class="dpad" aria-label="direction pad">
      <div class="h"></div><div class="v"></div><div class="c"></div>
      <button class="d up" aria-label="up" onclick="nav(-1)">▲</button>
      <button class="d down" aria-label="down" onclick="nav(1)">▼</button>
      <button class="d left" aria-label="back" onclick="back()">◀</button>
      <button class="d right" aria-label="open" onclick="ok()">▶</button>
    </div>
    <div class="face">
      <button class="ab a" aria-label="A open" onclick="ok()">A<em>OPEN</em></button>
      <button class="ab b" aria-label="B back" onclick="back()">B<em>BACK</em></button>
    </div>
  </div>
  <div class="smallbuttons"><button onclick="back()">SELECT · BACK</button><button onclick="reloadPacket()">START · SYNC</button></div>
  <div class="speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="engrave">RAVEN FINAL AUTHORITY // PUBLIC EFFECT BUDGET 0</div>
</main>
<script src="./ravenos-public-contract.js"></script>
<script src="./ravenos-pocket-contract.js"></script>
<script src="./ravenos-pocket-goblin.js"></script>
<script src="./ravenos-gameboy-v4.js"></script>
</body>
</html>
