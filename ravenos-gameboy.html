<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>RavenOS GameBoy // FairyOS God Object</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--px:'Press Start 2P',monospace;--bg:#02030a;--screen:#030812;--line:#17283b;--text:#9fc9e6;--dim:#45657e;--raven:#b65cff;--green:#50ff9a;--cyan:#44dcff;--amber:#ffb22e;--red:#ff4e72}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#171029 0,#04050b 50%,#010207 100%);color:var(--text);font-family:var(--px);user-select:none}body{display:flex;justify-content:center;padding:10px 4px 40px}
.gb{width:min(430px,calc(100vw - 8px));position:relative;padding:18px 18px 34px;border-radius:16px 16px 54px 54px;background:linear-gradient(145deg,#585861,#34343e 55%,#202028);box-shadow:7px 8px 0 #0c0c12,12px 14px 24px #000,inset 0 1px rgba(255,255,255,.14)}
.led{position:absolute;right:24px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.housing{padding:10px 10px 12px;background:linear-gradient(145deg,#160d20,#070811);border:5px solid #2b1f37;border-radius:7px 7px 22px 7px;box-shadow:inset 0 0 0 2px #55366f,0 5px 14px #000}
.label{display:flex;justify-content:space-between;padding:0 2px 7px;color:#9b73b8;font-size:5px;letter-spacing:1px}.screen{height:344px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,#0b1422,#02050b 75%);border:2px solid #000}.screen:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.13) 2px,rgba(0,0,0,.13) 4px)}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;font-size:7px;line-height:1.55}.head,.foot{flex:none;background:#050a12;border-color:var(--line);padding:0 8px}.head{height:28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--raven);font-size:6px}.head b{font-size:5px;color:var(--green);font-weight:400}.foot{height:23px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:5px}.body{flex:1;padding:7px 8px;overflow-y:auto}.body::-webkit-scrollbar{width:2px}.body::-webkit-scrollbar-thumb{background:var(--dim)}
.boot{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}.logo{font-size:17px;color:var(--raven);letter-spacing:5px;text-shadow:0 0 16px rgba(182,92,255,.6)}.sub{font-size:5px;color:var(--cyan);letter-spacing:2px}.bootlog{width:92%;font-size:5px;line-height:2;text-align:left;color:var(--green)}
.title{margin:2px 0 6px;color:var(--raven);font-size:6px;letter-spacing:1px}.row{padding:5px 2px;border-bottom:1px solid #0d1b29;font-size:6px}.row span{color:var(--dim)}.good{color:var(--green)}.warn{color:var(--amber)}.cyan{color:var(--cyan)}
.menu{display:flex;flex-direction:column;gap:3px}.item{padding:7px;border:1px solid transparent;background:#040912}.item.sel{border-color:#6a3c89;background:rgba(182,92,255,.11);color:#fff}.item .s{margin-top:4px;color:var(--dim);font-size:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:5px 0 8px}.stat{border:1px solid #15283a;background:#040a11;padding:7px 3px;text-align:center}.stat .n{font-size:10px;color:var(--green)}.stat .k{margin-top:4px;font-size:4px;color:var(--dim);line-height:1.5}
.flow{border-left:1px solid #2a3c51;padding-left:7px;margin:5px 0 8px}.flow div{padding:3px 0}.flow div:not(:last-child):after{content:'  ↓';color:var(--dim)}.cmds,.faegrid,.rooms{display:grid;grid-template-columns:1fr 1fr;gap:4px}.cmd,.room,.fae{border:1px solid #17283a;background:#030810;padding:6px}.cmd{font-size:5px;color:var(--cyan)}.room b{display:block;font-size:5px;color:var(--text);margin-bottom:3px}.room small{font-size:4px;color:var(--dim)}.fae .stamp{font-size:8px;margin-bottom:5px}.fae .power{font-size:4px;color:var(--dim);line-height:1.55}.fae .god{margin-top:4px;font-size:4px;color:var(--green)}
.chain .node{border:1px solid #17283a;background:#040912;padding:6px}.chain .node b{color:var(--cyan);font-weight:400}.arrow{text-align:center;color:var(--dim);padding:2px}.box{margin-top:7px;padding:6px;border:1px solid #3d2631;color:#ba7d92;font-size:4px;line-height:1.8}
.brand{text-align:center;padding:8px 0 12px;font-size:7px;letter-spacing:5px;color:#22242d;text-shadow:0 1px #62626d}.brand b{color:#463153;font-weight:400}.controls{display:flex;justify-content:space-between;align-items:center;padding:0 10px;margin-bottom:14px}.dpad{position:relative;width:112px;height:112px}.h,.v,.c{position:absolute;background:#17171c}.h{width:112px;height:38px;top:37px;border-radius:3px;box-shadow:0 4px #0b0b0e}.v{width:38px;height:112px;left:37px;border-radius:3px}.c{width:38px;height:38px;left:37px;top:37px}.d{position:absolute;border:0;background:transparent;color:#4d4d58;font-size:14px;z-index:3}.up{left:37px;width:38px;height:37px}.down{left:37px;bottom:0;width:38px;height:37px}.left{top:37px;width:37px;height:38px}.right{top:37px;right:0;width:37px;height:38px}.face{position:relative;width:116px;height:106px}.ab{position:absolute;width:50px;height:50px;border-radius:50%;border:0;color:#ddd;font:12px var(--px)}.a{right:0;top:21px;background:#8d2856;box-shadow:0 4px #421228}.b{left:0;top:40px;background:#3d356f;box-shadow:0 4px #18132f}.smallbuttons{display:flex;justify-content:center;gap:26px}.smallbuttons button{border:1px solid #31313a;background:#1b1b21;color:#666;border-radius:10px;padding:5px 13px;font:5px var(--px);transform:rotate(-10deg)}.engrave{text-align:center;color:#24242d;font-size:5px;letter-spacing:2px;margin-top:10px}
</style>
</head>
<body>
<div class="gb">
 <div id="led" class="led"></div>
 <div class="housing"><div class="label"><span>RAVENOS GRID // FAIRYOS</span><span id="packet">BOOT</span></div><div class="screen"><div id="ui"></div></div></div>
 <div class="brand">RAVENOS <b>GOD OBJECT</b></div>
 <div class="controls"><div class="dpad"><div class="h"></div><div class="v"></div><div class="c"></div><button class="d up" onclick="nav(-1)">▲</button><button class="d down" onclick="nav(1)">▼</button><button class="d left" onclick="back()">◀</button><button class="d right" onclick="ok()">▶</button></div><div class="face"><button class="ab a" onclick="ok()">A</button><button class="ab b" onclick="back()">B</button></div></div>
 <div class="smallbuttons"><button onclick="toggleFamily()">SELECT</button><button onclick="reloadPacket()">START</button></div>
 <div class="engrave">RAVEN FINAL AUTHORITY // EFFECT BUDGET 0</div>
</div>
<script>
(() => {
'use strict';
const URL='./ravenos-public-haunt.json';
const menu=[
 ['GOD CONTROL','JokerOS → BootOS → RavenOS','control'],
 ['GOD MAP','Dictionary → Yggdrasil → Omnigraph → Omnimap','map'],
 ['FAIRYOS','six MAX POWER bounded God Objects','fae'],
 ['HAUNT STATE','ghosts / absences / residue','haunt'],
 ['RAVENOS OFFICE','rooms / sockets / haunted workspace','office'],
 ['BLACK BOX','God Replay / God Memory','blackbox'],
 ['PUBLIC BOUNDARY','proof ceiling / privacy','boundary'],
 ['PUBLIC HAUNT','projection diagnostic page','public']
];
let data=null,view='boot',cursor=0,family=false;
const q=id=>document.getElementById(id);
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const gc=()=>data&&data['god_control']?data['god_control']:{};
const fl=()=>data&&Array.isArray(data['fae'])?data['fae']:[];
const rl=()=>data&&Array.isArray(data['rooms'])?data['rooms']:[];
function frame(name,html,help='A OPEN · B BACK'){
 q('ui').innerHTML=`<div class="head"><span>${e(name)}</span><b>${data?'SOURCE LINK':'PUBLIC HOLD'}</b></div><div class="body">${html}</div><div class="foot"><span>${help}</span><span>${family?'FAE FAMILY':'RAVENOS'}</span></div>`;
}
function boot(){q('ui').innerHTML='<div class="boot"><div class="logo">RAVENOS</div><div class="sub">FAIRYOS // GOD OBJECT HANDHELD</div><div class="bootlog">[BOOT] Raven authority ... LOCKED<br>[BOOT] GameBoy shell ... READY<br>[BOOT] public packet ... CHECKING<br>[BOOT] FairyOS ... MAX POWER<br>[LAW] bounded God Object != root authority</div><div class="sub">PRESS A / START</div></div>'}
function home(){const g=gc();frame('RAVENOS // HOME',`<div class="title">CURRENT PUBLIC PROJECTION</div><div class="stats"><div class="stat"><div class="n">${e(g['registered_ghost_ports']??'—')}</div><div class="k">GHOST PORTS</div></div><div class="stat"><div class="n">${e(g['proven_native_owners']??'—')}</div><div class="k">NATIVE OWNERS</div></div><div class="stat"><div class="n">${e(g['fairyos_roster_count']??6)}</div><div class="k">DIGI FAE</div></div></div><div class="row"><span>RAVENOS</span> ${e(g['ravenos_platform']||'HOLD')}</div><div class="row"><span>FAIRYOS</span> <b class="good">${e(g['fairyos_power_mode']||'MAX_POWER')}</b></div><div class="row"><span>CLASS</span> <b class="cyan">${e(g['fairyos_classification']||'BOUNDED_GOD_OBJECTS')}</b></div><div class="box">PUBLIC-SAFE PROJECTION ONLY · NO PRIVATE REPO READS FROM THIS BROWSER · EFFECT AUTHORITY = NONE</div><div class="title" style="margin-top:8px">SELECT SYSTEM</div><div class="menu">${menu.map((m,i)=>`<div class="item ${i===cursor?'sel':''}">${e(m[0])}<div class="s">${e(m[1])}</div></div>`).join('')}</div>`,'▲▼ SELECT · A OPEN · START RELOAD')}
function control(){const g=gc(),cmds=g['read_commands']||[];frame('GOD CONTROL',`<div class="title">BOUNDED OPERATOR PLANE</div><div class="flow"><div>RAVEN LANGUAGE</div><div>JOKEROS // GOD SPEECH</div><div>BOOTOS // GOD SIGHT + ROUTE</div><div>RAVENOS // COMPOSITION</div><div>REAL OWNERS // TRUTH + EFFECTS</div><div>POSTREPLY // SETTLEMENT</div><div>FAIRYOS // HAUNT</div></div><div class="stats"><div class="stat"><div class="n">0</div><div class="k">EFFECT BUDGET</div></div><div class="stat"><div class="n">${e(g['active_hold_count']??'—')}</div><div class="k">ACTIVE HOLDS</div></div><div class="stat"><div class="n">${e(g['resolved_hold_count']??'—')}</div><div class="k">RESOLVED</div></div></div><div class="title">READ COMMANDS</div><div class="cmds">${cmds.map(x=>`<div class="cmd">${e(x)}</div>`).join('')}</div><div class="box">GOD TOOL = MAXIMUM BOUNDED OPERATOR REACH · GOD TOOL != OWNER MERGER</div>`)}
function map(){const g=gc(),chain=g['god_map']||['DictionaryOS','YggdrasilOS','Omnigraph','Omnimap','RavenOS'];frame('GOD MAP',`<div class="title">SEMANTIC → GRAPH → TOPOLOGY → COCKPIT</div><div class="chain">${chain.map((x,i)=>`<div class="node"><b>${e(x)}</b></div>${i<chain.length-1?'<div class="arrow">▼</div>':''}`).join('')}</div><div class="stats"><div class="stat"><div class="n">${e(g['ravenos_core_source_boundaries_settled']??'—')}</div><div class="k">CORE SOURCE SETTLED</div></div><div class="stat"><div class="n">${e(g['registered_ghost_ports']??'—')}</div><div class="k">PORTS</div></div><div class="stat"><div class="n">${e(g['haunt_rooms']??'—')}</div><div class="k">HAUNT ROOMS</div></div></div><div class="row"><span>AUTO CAUSAL INFERENCE</span> <b class="warn">FALSE</b></div><div class="row"><span>WHOLE RUNTIME PROOF</span> <b class="warn">INCOMPLETE</b></div>`)}
function fae(){const g=gc(),list=fl();frame('FAIRYOS // MAX POWER',`<div class="row"><span>POWER MODE</span> <b class="good">${e(g['fairyos_power_mode']||'MAX_POWER')}</b></div><div class="row"><span>CLASSIFICATION</span> <b class="cyan">${e(g['fairyos_classification']||'BOUNDED_GOD_OBJECTS')}</b></div><div class="faegrid" style="margin-top:7px">${list.map(x=>`<div class="fae" style="border-color:${e(x['accent'])}66"><div class="stamp" style="color:${e(x['accent'])}">${e(x['stamp']||x['member'])}</div><div class="power">${e(x['power']||'MAX POWER')}</div><div class="god">BOUNDED GOD OBJECT</div></div>`).join('')}</div><div class="box">MAX POWER != INFINITE POWER · PRESENTATION != EFFECT AUTHORITY · RAVEN RETAINS FINAL AUTHORITY</div>`,'SELECT FAMILY · B BACK')}
function haunt(){frame('HAUNT STATE',`<div class="title">GHOST NERVOUS SYSTEM</div><div class="flow"><div>APPEND-ONLY FLIGHT HISTORY</div><div>HAUNT GRAPH</div><div>GOD MEMORY / LEDGER</div><div>CURRENT HAUNT STATE</div><div>ABSENCE RADAR</div><div>ROOM PROJECTION</div></div><div class="row"><span>CURRENT</span> newest finalized flight only</div><div class="row"><span>RESIDUE</span> history remains history</div><div class="row"><span>ABSENCE</span> missing evidence remains visible</div><div class="row"><span>CAUSES</span> explicit parents only</div><div class="row"><span>PUBLIC LIVE GHOSTS</span> <b class="warn">NOT EXPOSED</b></div><div class="box">RESIDUE != CURRENT TRUTH · ABSENCE != INFERRED FACT · REPLAY != EFFECT REPLAY</div>`)}
function office(){frame('RAVENOS HOME // OFFICE',`<div class="title">PUBLIC HAUNT ROOMS</div><div class="rooms">${rl().map(x=>`<div class="room"><b>${e(x['room'])}</b><small>${e(x['state'])} · ${e(x['atmosphere'])}</small></div>`).join('')}</div><div class="title" style="margin-top:8px">SALVIAOMNICAR OFFICE</div><div class="row"><span>OFFICE ROOMS</span> 17 SOURCE-BOUND</div><div class="row"><span>EQUIPMENT SOCKETS</span> 14 OWNER-PRESERVING</div><div class="row"><span>OFFICE SHIFT</span> COMPOSITION, NOT EFFECT</div><div class="box">ROOM != OWNER · EQUIPPED != EXECUTED · REAL OWNERS ACT</div>`)}
function blackbox(){frame('BLACK BOX // GOD MEMORY',`<div class="title">READ-ONLY REPLAY STACK</div><div class="chain"><div class="node"><b>BOOT FLIGHT</b> · finalized evidence</div><div class="arrow">▼</div><div class="node"><b>GOD REPLAY</b> · explicit causal ancestry</div><div class="arrow">▼</div><div class="node"><b>HAUNT GRAPH</b> · events / absences / causes</div><div class="arrow">▼</div><div class="node"><b>GOD MEMORY</b> · ledger + rooms</div></div><div class="row"><span>EFFECT REPLAY</span> <b class="good">FALSE</b></div><div class="row"><span>VIEW STORAGE WRITE</span> <b class="good">FALSE</b></div><div class="box">BLACK BOX REMEMBERS OBSERVATION. IT DOES NOT RE-EXECUTE THE PAST.</div>`)}
function boundary(){const p=data&&data['proof']?data['proof']:{},pr=data&&data['privacy']?data['privacy']:{};frame('PUBLIC BOUNDARY',`<div class="title">SANITIZED PUBLIC PROJECTION</div><div class="row"><span>PRIVATE SOURCE PATHS</span> ${pr['source_paths_included']===false?'NO':'UNKNOWN'}</div><div class="row"><span>TRANSACTION / EVENT IDS</span> NO</div><div class="row"><span>SECRETS / TOKENS</span> ${pr['secrets_or_tokens_included']===false?'NO':'UNKNOWN'}</div><div class="row"><span>PRIVATE BROWSER CONTACT</span> ${pr['private_repo_contact_from_browser']===false?'NO':'UNKNOWN'}</div><div class="row"><span>FAIRYOS MAX POWER</span> ${p['fairyos_max_power_source_bound']?'SOURCE-BOUND':'UNKNOWN'}</div><div class="row"><span>HOST AUTO INVOCATION</span> <b class="warn">UNPROVEN</b></div><div class="row"><span>AUTHORITY AMPLIFICATION</span> <b class="good">FALSE</b></div><div class="box">SOURCE-BOUND != UNIVERSAL RUNTIME PROOF · PUBLIC HANDHELD != PRIVATE OWNER RUNTIME</div>`)}
function render(){if(view==='boot')return boot();if(view==='home')return home();({control,map,fae,haunt,office,blackbox,boundary}[view]||home)()}
function enter(id){if(id==='public'){location.href='./ravenos-haunt.html';return}view=id;cursor=0;render()}
window.nav=d=>{if(view==='boot')return;if(view==='home'){cursor=(cursor+d+menu.length)%menu.length;render()}else{const b=document.querySelector('.body');if(b)b.scrollTop+=d*50}};
window.ok=()=>{if(view==='boot'){view='home';render();return}if(view==='home'){enter(menu[cursor][2]);return}if(view==='fae'){family=!family;render()}};
window.back=()=>{if(view==='boot')return;if(view!=='home'){view='home';cursor=0;render()}else{view='boot';render()}};
window.toggleFamily=()=>{family=!family;render()};window.reloadPacket=async()=>{await load();view='home';cursor=0;render()};
async function load(){q('packet').textContent='SYNC';try{const r=await fetch(URL,{cache:'no-store'});if(!r.ok)throw new Error('packet');const p=await r.json();if(p['schema']!=='ravenos.public-handheld.projection.v1'||p['target']!=='JARVIS_HANDHELD'||!p['privacy']||p['privacy']['whitelist_only']!==true)throw new Error('schema');data=p;q('packet').textContent='CURRENT';q('led').style.background='var(--green)';q('led').style.boxShadow='0 0 10px var(--green)'}catch(err){data=null;q('packet').textContent='HOLD';q('led').style.background='var(--amber)';q('led').style.boxShadow='0 0 10px var(--amber)'}}
load().finally(render);
})();
</script>
</body>
</html>
